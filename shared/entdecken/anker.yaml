# Feste Ankerpunkte der Oberfläche (#831) – Ziele für Rundgänge und Tipps.
#
# Ein Rundgang oder Tipp zeigt nie auf eine beliebige HTML-Id, sondern auf einen dieser Anker. In der Oberfläche
# trägt das Element das Attribut data-anker="<anker>". Der Test server/test/entdecken.test.ts prüft, dass jeder
# Anker hier im Quelltext der Oberfläche vorkommt – wer ein Element umbaut, behält das Attribut.
#
# Diese Liste ist maschinenlesbar: Ablago prüft damit Rundgänge und Tipps, die Paketprüfung (dms-registry #132)
# später ebenso. Neue Anker kommen dazu, vorhandene werden nicht umbenannt.
#
# Je Anker:
#   anker         Name; mit <platzhalter> ein Muster, z. B. mappe.register:<key>
#   seite         Seite, auf der der Anker sicher vorkommt – Ziel eines Tipps (nicht bei Mustern)
#   beschreibung  Was gemeint ist
#   handy         true: auch in der Handyfassung sichtbar
#   clients       true: gibt es so auch in Clients (spätere App) – Tipps dazu eignen sich für Clients

# ---------- Kopfzeile ----------
- anker: neu
  seite: /ablage/start
  beschreibung: Knopf „+ Neu“ in der Kopfzeile der Ablage (Post ablegen, neue Mappe)
  handy: true
  clients: true
- anker: benutzermenue
  seite: /ablage/start
  beschreibung: Knopf mit dem eigenen Namen oben rechts; öffnet Mein Konto, Ablago entdecken, Ablago verwalten, Hilfe
  handy: true
  clients: false

