<text x="400" y="38" font-size="17" fill="#1c2328" font-weight="700" text-anchor="middle">Nicht lose Dateien, sondern Zusammenhänge</text><line x1="140" y1="206" x2="400" y2="206" stroke="#00796b" stroke-width="2" opacity=".55"/><line x1="400" y1="206" x2="660" y2="98" stroke="#00796b" stroke-width="2" opacity=".55"/><line x1="400" y1="206" x2="660" y2="206" stroke="#00796b" stroke-width="2" opacity=".55"/><line x1="660" y1="206" x2="660" y2="314" stroke="#00796b" stroke-width="2" opacity=".55"/><rect x="30" y="170" width="220" height="72" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="64" cy="206" r="20" fill="#e0f2f1"/><g transform="translate(52 194) scale(1.0)"><path d="M3 11 12 4l9 7M5.5 9.5V20h13V9.5" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="14" width="4" height="6" fill="none" stroke="#00796b" stroke-width="2"/></g><text x="94" y="202" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Haus</text><text x="94" y="222" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Energieausweis, Grundbuch</text><rect x="290" y="170" width="220" height="72" rx="10" fill="#ffffff" stroke="#00796b"/><circle cx="324" cy="206" r="20" fill="#e0f2f1"/><g transform="translate(312 194) scale(1.0)"><path d="M13 2 5 13.5h6l-1 8.5 8-11.5h-6z" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round"/></g><text x="354" y="202" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Heizung</text><text x="354" y="222" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Typ, Baujahr, Anleitung</text><rect x="550" y="62" width="220" height="72" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="584" cy="98" r="20" fill="#e0f2f1"/><g transform="translate(572 86) scale(1.0)"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="614" y="94" font-size="1