<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Vier Situationen, in denen das Wissen im Kopf nicht mehr reicht: eine andere Person, viel Zeit, viel Menge, ein Ereignis" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Vier Situationen, in denen das Wissen im Kopf nicht mehr reicht: eine andere Person, viel Zeit, viel Menge, ein Ereignis</title>
<rect x="0.5" y="0.5" width="799" height="419" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<text x="400" y="40" font-size="17" fill="#1c2328" font-weight="700" text-anchor="middle">Solange alles in einem Kopf steckt, merkt man nichts …</text><line x1="400" y1="215" x2="165" y2="130" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><line x1="400" y1="215" x2="635" y2="130" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><line x1="400" y1="215" x2="165" y2="300" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><line x1="400" y1="215" x2="635" y2="300" stroke="#dde2e6" stroke-width="2" stroke-dasharray="5 5"/><circle cx="400" cy="215" r="78" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/><g transform="translate(383 153) scale(1.45)"><path d="M7 20v-3.5A7 7 0 1 1 18 11l1.8 3H18v2.5a2 2 0 0 1-2 2h-2V20" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g><text x="400" y="217" font-size="12.5" fill="#1c2328" font-weight="400" text-anchor="middle">einpflegen · suchen</text><text x="400" y="234" font-size="12.5" fill="#1c2328" font-weight="400" text-anchor="middle">kündigen · zahlen</text><text x="400" y="251" font-size="12.5" fill="#1c2328" font-weight="400" text-anchor="middle">verantworten</text><text x="400" y="271" font-size="11.5" fill="#00796b" font-weight="700" text-anchor="middle">eine Person</text><rect x="30" y="72" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="30" y="72" width="6" height="112" rx="3" fill="#c77700"/><circle cx="74" cy="112" r="24" fill="#fff3e0"/><g transform="translate(59 97) scale(1.25)"><circle cx="8" cy="8" r="3.2" fill="none" stroke="#c77700" stroke-width="2"/><circle cx="17" cy="9" r="2.6" fill="none" stroke="#c77700" stroke-width="2"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6M14 15.5c.9-.6 2-1 3-1 2.8 0 5 2 5 5" fill="none" stroke="#c77700" stroke-width="2" stroke-linecap="round"/></g><text x="112" y="108" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Eine andere Person</text><text x="112" y="132" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Partnerin, Kinder, Eltern –</text><text x="112" y="151" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">oder du fällst selbst aus</text><rect x="500" y="72" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="500" y="72" width="6" height="112" rx="3" fill="#c77700"/><circle cx="544" cy="112" r="24" fill="#fff3e0"/><g transform="translate(529 97) scale(1.25)"><circle cx="12" cy="12" r="9" fill="none" stroke="#c77700" stroke-width="2"/><path d="M12 7v5l3.5 2.5" fill="none" stroke="#c77700" stroke-width="2" stroke-linecap="round"/></g><text x="582" y="108" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Viel Zeit vergeht</text><text x="582" y="132" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Garantie nach 2 Jahren,</text><text x="582" y="151" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Hausverkauf nach 15</text><rect x="30" y="242" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="30" y="242" width="6" height="112" rx="3" fill="#c77700"/><circle cx="74" cy="282" r="24" fill="#fff3e0"/><g transform="translate(59 267) scale(1.25)"><rect x="4" y="4" width="16" height="5" rx="1.5" fill="none" stroke="#c77700" stroke-width="2"/><rect x="4" y="10" width="16" height="5" rx="1.5" fill="none" stroke="#c77700" stroke-width="2"/><rect x="4" y="16" width="16" height="5" rx="1.5" fill="none" stroke="#c77700" stroke-width="2"/></g><text x="112" y="278" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Es wird mehr</text><text x="112" y="302" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Eigenheim, Vermietung,</text><text x="112" y="321" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Familie, Selbständigkeit</text><rect x="500" y="242" width="270" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="500" y="242" width="6" height="112" rx="3" fill="#c77700"/><circle cx="544" cy="282" r="24" fill="#fff3e0"/><g transform="translate(529 267) scale(1.25)"><path d="M13 2 5 13.5h6l-1 8.5 8-11.5h-6z" fill="none" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/></g><text x="582" y="278" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Etwas passiert</text><text x="582" y="302" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Wasserschaden, Umzug,</text><text x="582" y="321" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Trennung, Steuer</text><text x="400" y="394" font-size="13.5" fill="#5b6670" font-weight="400" text-anchor="middle">… bis eine dieser vier Bedingungen kippt. Dann zeigt sich, ob das Wissen auffindbar ist.</text>
</svg>
