<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Lebenslagen, in denen ein DMS besonders hilft: Familien, Eigenheim, Vermietung, Eltern, Umbruch, Kleinbetrieb" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Lebenslagen, in denen ein DMS besonders hilft: Familien, Eigenheim, Vermietung, Eltern, Umbruch, Kleinbetrieb</title>
<rect x="0.5" y="0.5" width="799" height="319" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<text x="400" y="38" font-size="17" fill="#1c2328" font-weight="700" text-anchor="middle">Für wen sich ein DMS besonders lohnt</text><rect x="30" y="62" width="240" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="68" cy="100" r="22" fill="#e0f2f1"/><g transform="translate(54 86) scale(1.15)"><circle cx="8" cy="8" r="3.2" fill="none" stroke="#00796b" stroke-width="2"/><circle cx="17" cy="9" r="2.6" fill="none" stroke="#00796b" stroke-width="2"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6M14 15.5c.9-.6 2-1 3-1 2.8 0 5 2 5 5" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round"/></g><text x="102" y="106" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Paare und Familien</text><text x="48" y="142" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Eine Person ist „die Ablage“ –</text><text x="48" y="159" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">das Wissen gehört allen.</text><rect x="280" y="62" width="240" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="318" cy="100" r="22" fill="#e0f2f1"/><g transform="translate(304 86) scale(1.15)"><path d="M3 11 12 4l9 7M5.5 9.5V20h13V9.5" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="14" width="4" height="6" fill="none" stroke="#00796b" stroke-width="2"/></g><text x="352" y="106" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Eigenheim</text><text x="298" y="142" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Wartungen, Handwerker, Garantien,</text><text x="298" y="159" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Energieausweis über Jahrzehnte.</text><rect x="530" y="62" width="240" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="568" cy="100" r="22" fill="#e0f2f1"/><g transform="translate(554 86) scale(1.15)"><circle cx="8" cy="12" r="4" fill="none" stroke="#00796b" stroke-width="2"/><path d="M12 12h9M18 12v3M21 12v2" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round"/></g><text x="602" y="106" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Vermietung</text><text x="548" y="142" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Nebenkosten, Mieterwechsel,</text><text x="548" y="159" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Belege für die Steuer.</text><rect x="30" y="186" width="240" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="68" cy="224" r="22" fill="#e0f2f1"/><g transform="translate(54 210) scale(1.15)"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round"/></g><text x="102" y="230" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Für die Eltern sorgen</text><text x="48" y="266" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Vollmachten, Arztbriefe, Pflege-</text><text x="48" y="283" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">kasse, Verträge der Eltern.</text><rect x="280" y="186" width="240" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="318" cy="224" r="22" fill="#e0f2f1"/><g transform="translate(304 210) scale(1.15)"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="352" y="230" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Umbruch</text><text x="298" y="266" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Umzug, Hausbau, Erbe, Trennung,</text><text x="298" y="283" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Rente: alles einmal anfassen.</text><rect x="530" y="186" width="240" height="112" rx="10" fill="#ffffff" stroke="#dde2e6"/><circle cx="568" cy="224" r="22" fill="#e8eaf6"/><g transform="translate(554 210) scale(1.15)"><rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="#3f51b5" stroke-width="2"/><path d="M9 7V5h6v2M3 12h18" fill="none" stroke="#3f51b5" stroke-width="2"/></g><text x="602" y="230" font-size="14.5" fill="#1c2328" font-weight="700" text-anchor="start">Kleinbetrieb</text><text x="548" y="266" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Urlaubsvertretung, Fristen, Belege:</text><text x="548" y="283" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Wissen gehört der Firma.</text>
</svg>
