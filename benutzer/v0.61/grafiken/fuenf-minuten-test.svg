<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-label="Der 5-Minuten-Test: fünf Unterlagen, die man in fünf Minuten finden sollte" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Der 5-Minuten-Test: fünf Unterlagen, die man in fünf Minuten finden sollte</title>
<rect x="0.5" y="0.5" width="799" height="409" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<g transform="translate(36 30) scale(2.4)"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="#00796b" stroke-width="2"/><path d="M12 13.5V9.5M10 3h4M18.5 7l1.3-1.3" fill="none" stroke="#00796b" stroke-width="2" stroke-linecap="round"/></g><text x="110" y="58" font-size="19" fill="#1c2328" font-weight="700" text-anchor="start">Der 5-Minuten-Test</text><text x="110" y="82" font-size="13.5" fill="#5b6670" font-weight="400" text-anchor="start">Findest du diese fünf Dinge in fünf Minuten – oder jemand aus deinem Haushalt?</text><rect x="36" y="118" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="127" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="142" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Den Kaufbeleg deiner Waschmaschine</text><text x="748" y="142" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">1/5</text><rect x="36" y="166" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="175" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="190" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Die Kündigungsfrist deines Handyvertrags</text><text x="748" y="190" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">2/5</text><rect x="36" y="214" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="223" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="238" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Deine Hausratversicherung – und was sie abdeckt</text><text x="748" y="238" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">3/5</text><rect x="36" y="262" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="271" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="286" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Den letzten Zählerstand für Strom</text><text x="748" y="286" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">4/5</text><rect x="36" y="310" width="728" height="38" rx="8" fill="#f6f7f8" stroke="#dde2e6"/><rect x="50" y="319" width="20" height="20" rx="5" fill="#ffffff" stroke="#00796b" stroke-width="2"/><text x="84" y="334" font-size="14.5" fill="#1c2328" font-weight="400" text-anchor="start">Deinen Impfpass oder den der Kinder</text><text x="748" y="334" font-size="12.5" fill="#5b6670" font-weight="400" text-anchor="end">5/5</text><text x="36" y="372" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Alles gefunden? Dann brauchst du vielleicht wirklich kein DMS – und das ist in Ordnung.</text><text x="36" y="391" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Wenn nicht, weißt du jetzt, wo es hakt. Ganz ohne Schreckensszenario.</text>
</svg>
