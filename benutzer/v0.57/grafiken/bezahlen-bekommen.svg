<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" width="800" height="415" role="img" aria-label="Banking- und Vertrags-Apps zeigen, was du bezahlst; das DMS hält fest, was du dafür bekommst. Beides ergänzt sich." style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Banking- und Vertrags-Apps zeigen, was du bezahlst; das DMS hält fest, was du dafür bekommst. Beides ergänzt sich.</title>
<rect x="0.5" y="0.5" width="799" height="414" rx="14" fill="#ffffff" stroke="#dde2e6"/>
<rect x="30" y="30" width="350" height="330" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="30" y="30" width="350" height="64" rx="10" fill="#e8eaf6"/><g transform="translate(50 44) scale(1.45)"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="#3f51b5" stroke-width="2"/><path d="M3 10h18M7 15h4" stroke="#3f51b5" stroke-width="2" stroke-linecap="round"/></g><text x="96" y="58" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Banking- und Vertrags-Apps</text><text x="96" y="80" font-size="13.5" fill="#3f51b5" font-weight="600" text-anchor="start">zeigen, was du bezahlst</text><circle cx="58" cy="125" r="4" fill="#3f51b5"/><text x="74" y="130" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Abbuchungen und Daueraufträge</text><circle cx="58" cy="165" r="4" fill="#3f51b5"/><text x="74" y="170" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Laufende Verträge mit Kosten</text><circle cx="58" cy="205" r="4" fill="#3f51b5"/><text x="74" y="210" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Ausgaben nach Kategorien</text><circle cx="58" cy="245" r="4" fill="#3f51b5"/><text x="74" y="250" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Wenn ein Betrag sich ändert</text><text x="54" y="300" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Sie wissen von einem Vertrag erst,</text><text x="54" y="319" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">wenn Geld fließt.</text><rect x="420" y="30" width="350" height="330" rx="10" fill="#ffffff" stroke="#dde2e6"/><rect x="420" y="30" width="350" height="64" rx="10" fill="#e0f2f1"/><g transform="translate(440 44) scale(1.45)"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round"/></g><text x="486" y="58" font-size="15.5" fill="#1c2328" font-weight="700" text-anchor="start">Das DMS</text><text x="486" y="80" font-size="13.5" fill="#00796b" font-weight="600" text-anchor="start">hält fest, was du dafür bekommst</text><g transform="translate(440 112) scale(0.95)"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="#00796b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="468" y="130" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Police, Bedingungen, Kündigungsfrist</text><g transform="translate(440 152) scale(0.95)"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="#00796b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="468" y="170" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Garantie, Kaufbeleg, Seriennummer</text><g transform="translate(440 192) scale(0.95)"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="#00796b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="468" y="210" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Nachweise: Fahrzeugbrief, Zeugnis …</text><g transform="translate(440 232) scale(0.95)"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="#00796b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="468" y="250" font-size="14" fill="#1c2328" font-weight="400" text-anchor="start">Wer, was, wann – auch ohne Kosten</text><text x="444" y="300" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">Damit kannst du etwas beweisen,</text><text x="444" y="319" font-size="13" fill="#5b6670" font-weight="400" text-anchor="start">einfordern oder übergeben.</text><circle cx="400" cy="195" r="20" fill="#ffffff" stroke="#dde2e6"/><text x="400" y="201" font-size="20" fill="#1c2328" font-weight="700" text-anchor="middle">+</text><text x="400" y="392" font-size="13.5" fill="#5b6670" font-weight="400" text-anchor="middle">Kein Entweder-oder: Der Kontoauszug zeigt die 23 Verträge – das DMS hält die 23 Mappen dazu.</text>
</svg>
