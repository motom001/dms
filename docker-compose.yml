# Lokal ausprobieren: baut das Image aus dem Quellcode.
#   docker compose up --build
# Danach: http://localhost:8080

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
      # Datenbank genau im Ordner unten (#1464): postgres:18 legt sie sonst unter /var/lib/postgresql/18/docker ab,
      # also in einem unbenannten Volume, das beim Neuanlegen des Containers verloren ginge.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      retries: 10

  app:
    build: .
    # Nach einem Absturz (#877: Ablago beendet sich bei einem unerwarteten Fehler) startet Docker neu.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dms:dms@db:5432/dms
      # Prozesse für Anfragen (#1309): Ohne DMS_PROZESSE wählt Ablago selbst – 2, wenn der Container mindestens
      # 4 Kerne und 8 GB darf (Grenzen mit cpus und mem_limit), sonst 1; nie mehr, als DMS_DB_VERBINDUNGEN trägt.
      # Zurück zu einem Prozess:
      # DMS_PROZESSE: "1"
    volumes:
      - ./data/files:/data/files
      - ./data/geheim:/data/geheim
      - ./data/sicherung:/data/sicherung
      # Exporte (optional, #797): Vollexport, „Meine Daten exportieren“, Auskünfte – unverschlüsselt.
      # Ohne diese Zeile liegen sie im Container; nach dem Herunterladen bzw. nach 7 Tagen sind sie ohnehin weg.
      # Mit eigenem Ort (z. B. für große Exporte zum Kopieren) nie in den Sicherungsordner legen.
      # - ./data/export:/data/export
    ports:
      - "8080:3000"
