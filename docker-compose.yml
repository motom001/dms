# Lokal ausprobieren: baut das Image aus dem Quellcode.
#   docker compose up --build
# Danach: http://localhost:8080

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dms:dms@db:5432/dms
    volumes:
      - ./data/files:/data/files
      - ./data/geheim:/data/geheim
      - ./data/sicherung:/data/sicherung
    ports:
      - "8080:3000"
