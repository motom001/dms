# Messergebnis Lasttest (#563): Betreiber melden freiwillig, was Ablago auf ihrer Hardware verkraftet.
# Sammel-Issue für alle Messergebnisse: #576.
# Daraus pflegt das Projekt die Tabelle „Was Ablago verkraftet“ im Administratorhandbuch.
# Ablago selbst meldet nichts (keine Telemetrie, #389) – Rückmeldung gibt es nur auf diesem Weg.
name: Messergebnis Lasttest · Load test result
description: Melde freiwillig, was Ablago auf deinem Gerät verkraftet – mit dem Ergebnisblock des Lasttests. · Voluntarily report what Ablago handles on your device – with the result block of the load test.
title: "Messergebnis Lasttest: "
labels: ["messergebnis-lasttest"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du den Lasttest auf deinem Gerät hast laufen lassen! Wie das geht, steht im Administratorhandbuch unter [Lasttest selbst durchführen](https://help.ablago.app/admin/aktuell/lasttest/). Aus den Meldungen entsteht die Tabelle [Was Ablago verkraftet](https://help.ablago.app/admin/aktuell/verkraftet/).

        Alle Messergebnisse sammeln wir im Issue [#576 Messergebnisse Lasttest](https://github.com/motom001/dms/issues/576) – dort siehst du, was andere gemessen haben. Statt dieses Formulars geht auch ein Kommentar dort.

        Der Lasttest läuft **nur gegen eine eigene Test-Installation**, nie gegen deine echte Ablage.

        > **Dieser Beitrag ist öffentlich sichtbar.** Der Ergebnisblock enthält keine Namen, Adressen oder Rechnernamen – trage auch sonst keine ein: keine Namen, Domains, IP-Adressen, Seriennummern oder Bildschirmfotos mit echten Unterlagen.

        ---

        **English:** Thank you for running the load test on your device! How to run it is described in the administrator manual (in German) under [Lasttest selbst durchführen](https://help.ablago.app/admin/aktuell/lasttest/). The reports are collected in the table [Was Ablago verkraftet](https://help.ablago.app/admin/aktuell/verkraftet/); all results are gathered in issue [#576](https://github.com/motom001/dms/issues/576), where you can see what others measured – instead of this form, a comment there works too. Only run the load test **against a separate test installation**, never against your real documents.

        > **This post is publicly visible.** The result block contains no names, addresses or host names – do not add any elsewhere either: no names, domains, IP addresses, serial numbers or screenshots of real documents.
  - type: input
    id: geraet
    attributes:
      label: Gerät/Modell · Device/model
      description: z. B. „UGREEN DXP2800“, „Synology DS224+“, „Raspberry Pi 5 (8 GB)“, „Mini-PC mit Intel N100“. · e.g. "UGREEN DXP2800", "Synology DS224+", "Raspberry Pi 5 (8 GB)", "mini PC with Intel N100".
    validations:
      required: true
  - type: dropdown
    id: image
    attributes:
      label: Image · Image
      options:
        - dms (Datenbank getrennt · separate database)
        - dms-komplett (Datenbank im Container · database in the container)
        - Etwas anderes · Something else
    validations:
      required: true
  - type: dropdown
    id: speicher
    attributes:
      label: Speicher der Daten · Storage of the data
      options:
        - HDD
        - SSD (SATA)
        - NVMe
        - Gemischt (z. B. Datenbank auf SSD, Dateien auf HDD) · Mixed (e.g. database on SSD, files on HDD)
        - Weiß ich nicht · Don't know
    validations:
      required: true
  - type: dropdown
    id: stufen
    attributes:
      label: Gemessene Stufen · Measured levels
      multiple: true
      options:
        - klein (25 gleichzeitig, 5.000 Mappen) · small
        - mittel (100 gleichzeitig mit Export, 50.000 Mappen) · medium
        - groß (Belastungsgrenze, 200.000 Mappen) · large
        - extrem (Belastungsgrenze, 500.000 oder 1 Mio. Mappen) · extreme
    validations:
      required: true
  - type: textarea
    id: ergebnis
    attributes:
      label: Ergebnisblock · Result block
      # Ohne „render: text“ (#1452): Der Block bringt seinen eigenen ```text-Rahmen mit. Nur der Block: Ein Feld fasst höchstens
      # 65.536 Zeichen, ein ganzer Lauf mit `alle` hat etwa 121.000.
      description: Der Block „Messergebnis Lasttest“ von der Lasttest-Seite, unverändert (mit den Zeilen „… + Speichern“, „… + Pakete und Tabellen“, „Paketaufrufe …“ und „… + Anmeldeschutz“, falls vorhanden) – bis einschließlich der Zeile mit ```. Der Knopf zum Formular auf der Seite hat ihn schon kopiert, du musst ihn nur einfügen. Der ganze Bericht passt nicht in dieses Feld (höchstens 65.536 Zeichen); ihn nimmt „Kopieren“ für einen Kommentar im Sammel-Issue mit. · The block "Messergebnis Lasttest" from the load test page, unchanged (including the lines "… + Speichern", "… + Pakete und Tabellen", "Paketaufrufe …" and "… + Anmeldeschutz", if present) – up to and including the line with ```. The form button on the page has already copied it, you only need to paste it. The whole report doesn't fit into this field (at most 65,536 characters); "Copy" takes it along for a comment on the collective issue.
    validations:
      required: true
  - type: textarea
    id: nebenher
    attributes:
      label: Lief nebenher etwas? · Was anything else running?
      description: z. B. andere Container, Medienserver, Sicherung des NAS. Hilft beim Einordnen. · e.g. other containers, media server, NAS backup. Helps to put the numbers into context.
    validations:
      required: false
  - type: textarea
    id: bemerkung
    attributes:
      label: Bemerkungen · Remarks
      description: Was ist dir aufgefallen? Größere Probleme gern zusätzlich als eigenes Issue mit der Vorlage „Fehler“. · What did you notice? Larger problems are welcome as a separate issue with the template "Fehler / Bug".
    validations:
      required: false
