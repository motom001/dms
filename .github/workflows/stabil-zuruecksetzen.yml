name: ":stabil zurücksetzen"

# Zurückrollen (#714): Hat die stabile Version einen schweren Fehler, setzt der Maintainer
# :stabil von Hand auf eine frühere Version zurück (Actions → „:stabil zurücksetzen“ → Run workflow).
# Starten können nur Personen mit Schreibrecht am Repository. Erlaubt sind nur veröffentlichte
# Releases X.Y.Z, die es für beide Images gibt. Beschrieben im Admin-Handbuch „Aktualisieren“ und in SECURITY.md.
# Geht in beide Richtungen (#907): zurück auf eine frühere Version oder vor auf eine neuere, ohne den
# Wochenlauf (stabil.yml) abzuwarten. Das Release dieser Version wird „Latest“, damit der Hinweis
# „neue Version“ in Ablago und der nächste Wochenlauf von ihr ausgehen. Nach einem Zurücksetzen
# das Label „nicht-stabil“ an den Pull Request der fehlerhaften Version setzen – sonst befördert
# der nächste Wochenlauf sie wieder.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, auf die :stabil zeigen soll, z. B. 0.158.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stabil

jobs:
  zuruecksetzen:
    runs-on: ubuntu-latest
    permissions:
      # Release auf „Latest“ setzen (#907)
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version prüfen und :stabil setzen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::„$VERSION“ ist keine Versionsnummer X.Y.Z"; exit 1; }
          gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" -q .tag_name >/dev/null || { echo "::error::Es gibt kein Release v$VERSION"; exit 1; }
          for image in dms dms-komplett; do
            ref="ghcr.io/${{ github.repository_owner }}/$image"
            docker buildx imagetools inspect "$ref:$VERSION" >/dev/null || { echo "::error::$ref:$VERSION fehlt"; exit 1; }
          done
          for image in dms dms-komplett; do
            ref="ghcr.io/${{ github.repository_owner }}/$image"
            docker buildx imagetools create -t "$ref:stabil" "$ref:$VERSION"
            echo "::notice title=:stabil zurückgesetzt::$image:stabil → $VERSION (von ${{ github.actor }})"
          done
          gh release edit "v$VERSION" -R "${{ github.repository }}" --latest
          echo "::notice title=Release::v$VERSION ist jetzt „Latest“"
