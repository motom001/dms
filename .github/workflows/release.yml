name: Release

# GitHub Releases sind der Changelog von Ablago. Dieser Workflow legt sie an oder füllt ihren Text:
#  - automatisch: „Prüfen und Image bauen“ ruft ihn auf, wenn auf main eine neue
#    Versionsnummer in package.json steht (#34) – Tag und Release entstehen dann hier,
#  - bei einem von Hand gepushten Tag v*,
#  - bei einem von Hand auf GitHub veröffentlichten Release (nur der Text wird gesetzt).
# Liegt docs/releases/<tag>.md vor, wird es als Text übernommen; sonst die
# Commit-Überschriften seit dem vorigen Tag.
# Neue Releases sind nicht „Latest“ (#907): das wird erst die Version, auf die :stabil wandert
# (stabil.yml, im Wochentakt) – danach richtet sich der Hinweis „neue Version“ in Ablago.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag des Releases, z. B. v0.9.0
        required: true
        type: string
      ziel:
        description: Commit, auf den der neue Tag zeigen soll
        required: true
        type: string

# Grundsätzlich nur lesen (#221); Schreibrechte bekommt nur der Job, der sie braucht.
permissions:
  contents: read

# Tag-Push und veröffentlichtes Release kommen oft gleichzeitig: nacheinander laufen lassen.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
      # Herkunftsnachweis der Anhänge „Bestandteile und Lizenzen“ (#1405); sonst keine weiteren Rechte.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # Zeitgrenze (#1369): gewöhnlich 10–60 s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release-Notizen
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          ziel="${{ inputs.ziel || github.sha }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIEL=$ziel" >> "$GITHUB_ENV"
          # Gibt es den Tag schon, reicht der Text bis zu ihm; sonst bis zum Ziel-Commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            bis="$tag"; vorher=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          else
            bis="$ziel"; vorher=$(git describe --tags --abbrev=0 "$ziel" 2>/dev/null || true)
          fi
          if [ -f "docs/releases/${tag}.md" ]; then
            cp "docs/releases/${tag}.md" notizen.md
          else
            {
              echo "## Änderungen"
              echo
              git log --no-merges --format='- %s' ${vorher:+$vorher..}"$bis"
            } > notizen.md
          fi
          echo "VORHER=$vorher" >> "$GITHUB_ENV"
      # Bestandteile und Lizenzen (#1393): Stücklisten, Digests und Node-Version legt „Prüfen und Image bauen“ als
      # Artefakte ab (Job image-zusammen), die Pakete im Bündel der Oberfläche der Job rauchtests (#1470). Nur dort,
      # wo dieser Workflow von dort aufgerufen wird.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.tag != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bestandteile
          pattern: bestandteile-*
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Übersicht im Text, die vollständige Liste als Anhänge (CSV, SPDX, CycloneDX). Verglichen wird mit der CSV
      # am vorigen Release. Ohne neue Daten (Release von Hand, Stückliste fehlgeschlagen) bleibt ein schon
      # vorhandener Abschnitt stehen; sonst steht ein Hinweis da. Das Release selbst hält das nie auf.
      - name: Bestandteile und Lizenzen
        env:
          GH_TOKEN: ${{ github.token }}
          AUFRUF_TAG: ${{ inputs.tag }}
        run: |
          stand="$RUNNER_TEMP/bestandteile"
          aus="$RUNNER_TEMP/bestandteile-aus"
          if [ -f "$stand/stand-dms.json" ] && [ -f "$stand/stand-dms-komplett.json" ]; then
            vorher_csv="$RUNNER_TEMP/vorher.csv"
            if [ -n "$VORHER" ]; then
              gh release download "$VORHER" -p ablago-bestandteile.csv -O "$vorher_csv" 2>/dev/null ||
                echo "::notice title=Bestandteile::$VORHER hat keine Liste der Bestandteile – kein Vergleich."
            fi
            if node .github/werkzeuge/bestandteile.mjs --stand "$stand" --tag "$TAG" --commit "$(git rev-parse "$ZIEL")" \
              --datum "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --aus "$aus" --vorher "$vorher_csv" --vorher-tag "$VORHER"; then
              { echo; cat "$aus/bestandteile.md"; } >> notizen.md
              echo "ANHAENGE=$aus" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning title=Bestandteile::Übersicht ließ sich nicht erzeugen (siehe Protokoll)."
          fi
          bisher=$(gh release view "$TAG" --json body -q .body 2>/dev/null | awk '{sub(/\r$/, "")} /^## Bestandteile und Lizenzen$/ {an = 1} an && /^---$/ {exit} an' || true)
          if [ -n "$bisher" ]; then
            { echo; printf '%s\n' "$bisher"; } >> notizen.md
          elif [ -n "$AUFRUF_TAG" ]; then
            {
              echo
              echo "## Bestandteile und Lizenzen"
              echo
              echo "Die Übersicht ließ sich für dieses Release nicht erzeugen. Stückliste und Herkunftsnachweis hängen, soweit erzeugt, signiert am Image: [Administratorhandbuch](https://help.ablago.app/admin/aktuell/bestandteile/)."
            } >> notizen.md
          fi
      # Herkunftsnachweis der Anhänge (#1405): Text und Anhänge schreibt dasselbe Token, eine Prüfsumme im Text belegt
      # also nichts. Das Attest bindet jede Datei an Workflow und Commit; jeder Lauf attestiert seine Dateien neu, auch
      # nach einem Neulauf mit --clobber. Prüfen: gh attestation verify ablago-bestandteile.csv -R motom001/dms
      # Ein Fehler hier hält das Release nicht auf, es gibt eine Warnung.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: env.ANHAENGE != ''
        continue-on-error: true
        with:
          subject-path: |
            ${{ env.ANHAENGE }}/ablago-bestandteile.csv
            ${{ env.ANHAENGE }}/ablago-bestandteile.spdx.json
            ${{ env.ANHAENGE }}/ablago-bestandteile.cdx.json
      - name: Warnung, wenn der Herkunftsnachweis fehlt
        if: steps.attest.outcome == 'failure'
        run: echo "::warning title=Bestandteile::Herkunftsnachweis der Anhänge ließ sich nicht erzeugen (siehe Protokoll)."
      - name: Fußzeile
        run: |
          {
            echo
            echo "---"
            echo "Aktualisieren: Image \`ghcr.io/motom001/dms:${TAG#v}\` bzw. \`ghcr.io/motom001/dms-komplett:${TAG#v}\` (oder \`:latest\`) neu ziehen und neu starten. Anleitung im [Administratorhandbuch](https://help.ablago.app/admin/aktualisieren/)."
          } >> notizen.md
      - name: Release anlegen oder Text setzen
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Ablago ${TAG}" --notes-file notizen.md
          else
            gh release create "$TAG" --title "Ablago ${TAG}" --notes-file notizen.md --target "$ZIEL" --latest=false
          fi
          if [ -n "${ANHAENGE:-}" ]; then
            gh release upload "$TAG" --clobber "$ANHAENGE"/ablago-bestandteile.csv "$ANHAENGE"/ablago-bestandteile.spdx.json "$ANHAENGE"/ablago-bestandteile.cdx.json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
