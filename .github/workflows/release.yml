name: Release

# GitHub Releases sind der Changelog des DMS. Dieser Workflow legt sie an oder füllt ihren Text:
#  - automatisch: „Prüfen und Image bauen“ ruft ihn auf, wenn auf main eine neue
#    Versionsnummer in package.json steht (#34) – Tag und Release entstehen dann hier,
#  - bei einem von Hand gepushten Tag v*,
#  - bei einem von Hand auf GitHub veröffentlichten Release (nur der Text wird gesetzt).
# Liegt docs/releases/<tag>.md vor, wird es als Text übernommen; sonst die
# Commit-Überschriften seit dem vorigen Tag.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag des Releases, z. B. v0.9.0
        required: true
        type: string
      ziel:
        description: Commit, auf den der neue Tag zeigen soll
        required: true
        type: string

# Grundsätzlich nur lesen (#221); Schreibrechte bekommt nur der Job, der sie braucht.
permissions:
  contents: read

# Tag-Push und veröffentlichtes Release kommen oft gleichzeitig: nacheinander laufen lassen.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release-Notizen
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          ziel="${{ inputs.ziel || github.sha }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIEL=$ziel" >> "$GITHUB_ENV"
          # Gibt es den Tag schon, reicht der Text bis zu ihm; sonst bis zum Ziel-Commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            bis="$tag"; vorher=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          else
            bis="$ziel"; vorher=$(git describe --tags --abbrev=0 "$ziel" 2>/dev/null || true)
          fi
          if [ -f "docs/releases/${tag}.md" ]; then
            cp "docs/releases/${tag}.md" notizen.md
          else
            {
              echo "## Änderungen"
              echo
              git log --no-merges --format='- %s' ${vorher:+$vorher..}"$bis"
            } > notizen.md
          fi
          {
            echo
            echo "---"
            echo "Aktualisieren: Image \`ghcr.io/motom001/dms:${tag#v}\` bzw. \`ghcr.io/motom001/dms-komplett:${tag#v}\` (oder \`:main\`) neu ziehen und neu starten. Anleitung im [Administratorhandbuch](https://motom001.github.io/dms/admin/aktualisieren/)."
          } >> notizen.md
      - name: Release anlegen oder Text setzen
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "DMS ${TAG}" --notes-file notizen.md
          else
            gh release create "$TAG" --title "DMS ${TAG}" --notes-file notizen.md --target "$ZIEL"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
