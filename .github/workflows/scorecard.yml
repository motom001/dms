# OpenSSF Scorecard (#221): bewertet regelmäßig, wie das Projekt mit Sicherheit umgeht
# (Rechte der Workflows, feste Versionen, Abhängigkeiten, Prüfungen, Sicherheitsrichtlinie …).
# Das Ergebnis ist öffentlich (scorecard.dev, Abzeichen in der README); die Hinweise stehen
# unter Security → Code scanning. Für die Veröffentlichung darf dieser Workflow nur die
# Schritte unten enthalten und oben keine Schreibrechte haben.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
