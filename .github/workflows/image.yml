name: Prüfen und Image bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typen prüfen
        run: npm run typecheck
      - name: Tests (inklusive PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # Fehlschläge als Anmerkungen ausgeben, damit sie ohne Log-Zugriff sichtbar sind.
            # Fehlschläge als Anmerkungen ausgeben (die Job-Logs sind nicht überall abrufbar).
            grep -n -B2 -A30 "^ *not ok" test.log | head -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'
            echo
            exit 1
          }
        env:
          TEST_DATABASE_URL: postgres://dms:dms@localhost:5432/dms_test
      - name: Bauen
        run: npm run build

  image:
    needs: pruefen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - id: zeit
        run: echo "jetzt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            DMS_COMMIT=${{ github.sha }}
            DMS_GEBAUT=${{ steps.zeit.outputs.jetzt }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
