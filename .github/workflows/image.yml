name: Prüfen und Image bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Jede Woche neu bauen (#214): neue Alpine-Pakete (poppler, PostgreSQL in dms-komplett) auch ohne neues Release.
  # Ergibt nur das Tag main (und den Kurz-Hash); Versionsnummern bleiben unverändert.
  schedule:
    - cron: '17 3 * * 1'

# Grundsätzlich nur lesen (#221); Schreibrechte bekommt nur der Job, der sie braucht.
permissions:
  contents: read

jobs:
  # Server-Tests in drei Teilen parallel (#1056): Jeder Teil hat seine eigene PostgreSQL und seinen IMAP-Testserver;
  # `node --test --test-shard` verteilt die Testdateien fest. Die Quarantäne (#900) wertet jeder Teil für sich aus.
  tests:
    name: tests (${{ matrix.teil }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Nur als Quelle für den Umzug 17 → 18 über die Sicherung (#1464, server/test/umzug-pg17-pg18.test.ts). Getestet
      # wird Ablago selbst nur noch mit 18 (Entscheidung Thomas 21.11.2026, #1544).
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci --no-audit --no-fund
      # poppler und qpdf (#45, #459): dieselben Werkzeuge wie im Image – ohne Texterkennung (die ist ein Paket).
      # Höchstens drei Versuche: erst ohne „apt-get update“ (#905), ab dem zweiten mit verlässlichen Spiegeln (apt-pakete.sh).
      - name: poppler und qpdf installieren
        run: bash "$GITHUB_WORKSPACE/.github/werkzeuge/apt-pakete.sh" poppler-utils qpdf
      # IMAP-Testserver für die Postfächer (#196); fehlt das Image, laufen die übrigen Tests trotzdem.
      - name: IMAP-Testserver (GreenMail) starten
        run: |
          if docker run -d --name greenmail -p 3025:3025 -p 3143:3143 \
               -e GREENMAIL_OPTS='-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=dms:geheim@dms.test -Dgreenmail.verbose=false' \
               greenmail/standalone:2.1.15 >/dev/null; then echo "IMAP_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          else echo "::warning::GreenMail nicht verfügbar – IMAP-Test übersprungen"; fi
      # Jede Testdatei mit PostgreSQL legt sich eine eigene Datenbank an (#900, test/hilfe-db.ts).
      # Quarantäne (#900): Tests aus server/test/quarantaene.json laufen mit, brechen aber nicht ab; ihr Ergebnis
      # steht in der Zusammenfassung. Steht einer über seine Fälligkeit hinaus darin, scheitert der Schritt.
      - name: Tests (inklusive PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm run test:teil -w server 2>&1 | tee test.log || status=$?
          node --import tsx server/test/quarantaene.ts test.log "$status" || {
            # Fehlschläge als Anmerkungen ausgeben, damit sie ohne Log-Zugriff sichtbar sind.
            # Fehlschläge als Anmerkungen ausgeben (die Job-Logs sind nicht überall abrufbar).
            grep -n -B2 -A30 "^ *not ok" test.log | head -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'
            echo
            exit 1
          }
        env:
          TEST_DATABASE_URL: postgres://dms:dms@localhost:5432/dms_test
          TEST_DATABASE_URL_PG17: postgres://dms:dms@localhost:5433/dms_test
          TEST_TEIL: ${{ matrix.teil }}/3
      # Ungelesene Datei-Ströme (#1456, Vorbereitung auf Node 26): die Testdateien, die echte Dateien lesen, noch einmal
      # mit regelmäßiger Speicherbereinigung (server/test/offene-dateien.ts). Nur in Teil 1 – etwa 2 Minuten, und die
      # Teile sind lange vor den Rauchtests fertig, die Dauer der CI bleibt also gleich.
      - name: Ungelesene Datei-Ströme (Node 26)
        if: matrix.teil == 1
        shell: bash
        run: |
          set -o pipefail
          npm run test:dateien -w server 2>&1 | tee dateien.log || {
            grep -n -A12 "Ungelesener Datei-Strom\|^ *not ok" dateien.log | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Ungelesene Datei-Ströme::/'
            echo
            exit 1
          }
        env:
          TEST_DATABASE_URL: postgres://dms:dms@localhost:5432/dms_test

  # Alles außer den Server-Tests (#1056): Release-Notiz, Sicherheitslücken, Typen, Tests von Oberfläche und Gemeinsamem (#1282), Bau, Rauchtests – parallel zu „tests“.
  # Die Rauchtests legen ihre Datenbank im PostgreSQL dieses Jobs an.
  rauchtests:
    runs-on: ubuntu-latest
    # 40 statt 30 Minuten (QS-Runde 11/2026): Der volle Lauf dauerte zuletzt 23 bis 27 Minuten mit Bau und Einrichtung;
    # mit 30 blieb kaum Luft für einen langsamen Runner oder neue Bereiche. Ein hängender Lauf bricht trotzdem ab.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Genau die Versionen aus package-lock.json (#215).
      # Versionsnummer erst beim Merge (#952): Wer das Programm ändert, bringt genau einen Schnipsel
      # docs/releases/neu/<name>.md mit („art: patch|minor|keine“). Dependabot ist ausgenommen.
      - name: Release-Notiz
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        # Basis ist der erste Elternteil des Merge-Refs (das aktuelle main), nicht die Basis beim letzten Push: Sonst
        # zählen Schnipsel mit, die inzwischen auf main gekommen sind (Fund Entwicklung 08.11.2026, #952).
        run: |
          git fetch -q --depth=2 origin "$GITHUB_SHA"
          BASIS=$(git rev-parse HEAD^1)
          node --test .github/werkzeuge/version.test.mjs
          node .github/werkzeuge/version.mjs pruefen "$BASIS"
      - run: npm ci --no-audit --no-fund
      # Bekannte Sicherheitslücken in den Abhängigkeiten, die im Image landen (#215): ab „hoch“ schlägt die Prüfung fehl.
      - name: Sicherheitslücken in Abhängigkeiten
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log || {
            grep -E "Severity|^[a-z@].*  |fix available|No fix" audit.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=npm audit::/'
            echo
            exit 1
          }
      # poppler und qpdf (#45, #459): dieselben Werkzeuge wie im Image – ohne Texterkennung (die ist ein Paket).
      # Höchstens drei Versuche: erst ohne „apt-get update“ (#905), ab dem zweiten mit verlässlichen Spiegeln (apt-pakete.sh).
      - name: poppler und qpdf installieren
        run: bash "$GITHUB_WORKSPACE/.github/werkzeuge/apt-pakete.sh" poppler-utils qpdf
      - name: Typen prüfen
        run: npm run typecheck
      # Tests der Oberfläche und über Gemeinsames (#1282): getrennt von den Server-Tests, ohne Datenbank.
      - name: Tests der Oberfläche (web/test)
        run: npm test -w web
      - name: Tests über Sprachdateien und Gemeinsames (shared/test)
        run: npm test --prefix shared
      # Der offizielle Katalog unter seiner echten Adresse: erreichbar, nur https, Signatur gültig (#688).
      - name: Offizieller Katalog erreichbar und signiert
        run: node --import tsx server/werkzeuge/katalog-erreichbar.ts
      # Wann :stabil weiterwandert (#714, #907): kein Release → kein :stabil, Vorabversionen und „nicht-stabil“ nie;
      # Auswahl im Wochenlauf (mindestens 24 Stunden alt, nie zurück).
      - name: Regeln für :stabil
        run: .github/werkzeuge/stabil-pruefen.test.sh
      # Vergleich der Alpine-Pakete beider Varianten (#1397), angewandt in image-probe.
      - name: Vergleich der Alpine-Pakete
        run: .github/werkzeuge/apk-versionen-vergleichen.test.sh
      # Installation der Ubuntu-Pakete in der CI: höchstens drei Versuche, Spiegelwechsel ab dem zweiten.
      - name: Test apt-pakete
        run: .github/werkzeuge/apt-pakete.test.sh
      # Die Musterseite der Bausteine (#967) darf nie ins Image: Produktivbau der Oberfläche ohne VITE_MUSTER bauen und
      # prüfen, dass weder der Teil „muster“ noch der Weg /muster darin steckt.
      - name: Produktivbau ohne Musterseite
        shell: bash
        run: |
          npm run build -w web
          if ls web/dist/assets | grep -q '^muster' || grep -alq '/muster' web/dist/assets/*.js; then
            echo "::error title=Musterseite::Die Musterseite steckt im Produktivbau (web/src/start.tsx, VITE_MUSTER)"; exit 1
          fi
          # Bestandteile der Oberfläche (#1470): welche npm-Pakete wirklich im Bündel stecken. Gleicher Bau wie im Image;
          # release.yml liest die Datei mit den Stücklisten (Artefakte „bestandteile-*“). qrcode bringt seine
          # Kommandozeile (yargs) nicht ins Bündel.
          jq -e '[.pakete[].name] | (index("react") != null and index("qrcode") != null and index("yargs") == null)' \
            web/bestandteile-buendel.json >/dev/null ||
            { echo "::error title=Bestandteile::web/bestandteile-buendel.json unvollständig (vite.config.ts, #1470)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bestandteile-oberflaeche"
          cp web/bestandteile-buendel.json "$RUNNER_TEMP/bestandteile-oberflaeche/"
      - name: Bestandteile der Oberfläche ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bestandteile-oberflaeche
          path: ${{ runner.temp }}/bestandteile-oberflaeche
          retention-days: 7
      # Testbau (#967): mit Musterseite unter /muster für die Rauchtests. Das Image baut das Dockerfile, ohne Musterseite.
      - name: Bauen
        run: npm run build
        env:
          VITE_MUSTER: '1'

      # Rauchtests für die Oberfläche (#897): die wichtigsten Wege einmal im Browser, gegen das eben gebaute Ablago –
      # gestartet wie im Workflow „Handbuch“: ohne Datenbank-Anbindung, der erste Test geht den Assistenten durch und
      # legt dabei die eigene Datenbank dms_rauchtest im PostgreSQL dieses Jobs an.
      # Mit leerem Eingangsordner (#986): Der Rauchtest prüft „Jetzt prüfen“ in Werkbank → Eingangsordner.
      - name: Ablago für die Rauchtests starten
        run: |
          mkdir -p "$RUNNER_TEMP/rauchtest-eingang"
          nohup node server/dist/index.js > "$RUNNER_TEMP/rauchtest-dms.log" 2>&1 &
        env:
          DMS_DATENWURZEL: ${{ runner.temp }}/rauchtest-daten
          DMS_EINGANG: ${{ runner.temp }}/rauchtest-eingang
          PORT: '3000'
          DMS_VERSION: rauchtest
          # Ein Prozess wie bisher: Ohne DMS_PROZESSE nähme Ablago seit #1309 auf diesem Runner (4 Kerne, 16 GB) zwei.
          DMS_PROZESSE: '1'
      # Playwright mit fester Version aus web/rauchtest/package.json und eigenem Lockfile (#289, #1272), nur Chromium.
      # Die Rechner von GitHub bringen die Bibliotheken für Chromium mit; nur wenn der Browser so nicht startet, kommen
      # sie per apt dazu – höchstens 5 Minuten je Versuch, dann ein zweiter (die apt-Installation hängt gelegentlich).
      # Browser zwischenspeichern (#1059), wie im Workflow „Handbuch“; der Schlüssel folgt dem Lockfile, damit Paket
      # und Browser immer zusammenpassen.
      - name: Browser aus dem Zwischenspeicher
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/rauchtest/package-lock.json') }}-${{ runner.os }}-${{ runner.arch }}-chromium
      - name: Playwright für die Rauchtests installieren
        working-directory: web/rauchtest
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          timeout 300 npx playwright install chromium || { echo "::warning::Download von Chromium hing oder scheiterte – zweiter Versuch"; timeout 300 npx playwright install chromium; }
          if node -e "const { chromium } = require('playwright'); chromium.launch().then((b) => b.close())"; then exit 0; fi
          echo "::notice::Chromium startet nicht – Bibliotheken per apt nachinstallieren"
          bash "$GITHUB_WORKSPACE/.github/werkzeuge/apt-spiegel.sh"  # langsamer Spiegel (18.11.)
          for versuch in 1 2; do
            timeout 300 npx playwright install-deps chromium && exit 0
            [ "$versuch" = 2 ] && exit 1
            echo "::warning::Installation der Bibliotheken hing oder scheiterte – zweiter Versuch"
            sudo pkill -x apt-get || true; sudo pkill -x dpkg || true; sleep 5
            sudo dpkg --configure -a || true
          done
      # rauchtest.mjs startet die Einrichtung und danach alle Bereiche unter web/rauchtest/bereiche/ (#1234) nacheinander:
      # Sie teilen sich dieses eine Ablago samt Datenbank, spätere Bereiche bauen auf dem Zustand der früheren auf
      # (Post wird zur Mappe, Verwaltungsmodus, Neustarts) – parallel liefen sie gegeneinander.
      - name: Rauchtests der Oberfläche
        shell: bash
        run: |
          set -o pipefail
          node web/rauchtest/rauchtest.mjs "$RUNNER_TEMP/rauchtest-fehler" "$RUNNER_TEMP/rauchtest-muster" 2>&1 | tee "$RUNNER_TEMP/rauchtest.log"
        env:
          DMS_URL: http://localhost:3000
          DMS_DATENWURZEL: ${{ runner.temp }}/rauchtest-daten
          DB_HOST: localhost
          DB_PASSWORT: dms
          DB_NAME: dms_rauchtest
      # Fehler als Anmerkungen (die Job-Logs sind nicht überall abrufbar) und Bilder der Seiten zum Nachsehen.
      - name: Fehler der Rauchtests melden
        if: failure()
        shell: bash
        run: |
          # Ohne pipefail: Ein grep ohne Treffer bräche den Schritt sonst vor dem Protokoll von Ablago ab (QS-Runde 11/2026).
          # Der Testläufer meldet Fehlschläge mit „✖“, TAP mit „not ok“.
          set +o pipefail
          grep -n -A12 -E "^(not ok|✖)" "$RUNNER_TEMP/rauchtest.log" 2>/dev/null | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Rauchtests::/'; echo
          grep -E "ERROR|WARN" "$RUNNER_TEMP/rauchtest-dms.log" 2>/dev/null | tail -n 30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Ablago-Protokoll (Rauchtests)::/'; echo
          # Das ganze Protokoll von Ablago kommt zu den Bildern: den Ablauf neben dem Fehler nachlesen.
          mkdir -p "$RUNNER_TEMP/rauchtest-fehler" && cp "$RUNNER_TEMP/rauchtest-dms.log" "$RUNNER_TEMP/rauchtest-fehler/" 2>/dev/null || true
      # Immer (#967): Musterseite der Bausteine hell und dunkel, Desktop und Handy – zum Ansehen im Pull Request.
      - name: Bilder der Musterseite hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musterseite
          path: ${{ runner.temp }}/rauchtest-muster
          if-no-files-found: ignore
          retention-days: 7
      - name: Bilder der Rauchtests hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rauchtest-fehler
          path: ${{ runner.temp }}/rauchtest-fehler
          if-no-files-found: ignore
          retention-days: 7


  # Rauchtests mit zwei Prozessen (QS-Runde 11/2026): Seit #1309 nimmt Ablago ohne DMS_PROZESSE ab 4 Kernen und 8 GB
  # zwei Prozesse – im Alltag also oft zwei, im vollen Lauf oben bleibt es für vergleichbare Ergebnisse bei einem. Hier
  # läuft eine schnelle Teilmenge (web/rauchtest/zwei-prozesse.mjs: Einrichtung, Start und Suche, Werkbank, Post,
  # Erwähnen; etwa eine Minute) gegen ein Ablago mit DMS_PROZESSE=2. Eigener Job parallel zu „rauchtests“, damit die
  # Dauer der CI gleich bleibt: Er braucht mit Bau etwa 5 Minuten, der volle Lauf über 20.
  rauchtests-zwei-prozesse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci --no-audit --no-fund
      # Höchstens drei Versuche: erst ohne „apt-get update“ (#905), ab dem zweiten mit verlässlichen Spiegeln (apt-pakete.sh).
      - name: poppler und qpdf installieren
        run: bash "$GITHUB_WORKSPACE/.github/werkzeuge/apt-pakete.sh" poppler-utils qpdf
      - name: Bauen
        run: npm run build
        env:
          VITE_MUSTER: '1'
      - name: Ablago mit zwei Prozessen starten
        run: |
          mkdir -p "$RUNNER_TEMP/rauchtest-eingang"
          nohup node server/dist/index.js > "$RUNNER_TEMP/rauchtest-dms.log" 2>&1 &
        env:
          DMS_DATENWURZEL: ${{ runner.temp }}/rauchtest-daten
          DMS_EINGANG: ${{ runner.temp }}/rauchtest-eingang
          PORT: '3000'
          DMS_VERSION: rauchtest
          DMS_PROZESSE: '2'
      - name: Browser aus dem Zwischenspeicher
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/rauchtest/package-lock.json') }}-${{ runner.os }}-${{ runner.arch }}-chromium
      - name: Playwright für die Rauchtests installieren
        working-directory: web/rauchtest
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          timeout 300 npx playwright install chromium || { echo "::warning::Download von Chromium hing oder scheiterte – zweiter Versuch"; timeout 300 npx playwright install chromium; }
          if node -e "const { chromium } = require('playwright'); chromium.launch().then((b) => b.close())"; then exit 0; fi
          echo "::notice::Chromium startet nicht – Bibliotheken per apt nachinstallieren"
          bash "$GITHUB_WORKSPACE/.github/werkzeuge/apt-spiegel.sh"
          for versuch in 1 2; do
            timeout 300 npx playwright install-deps chromium && exit 0
            [ "$versuch" = 2 ] && exit 1
            echo "::warning::Installation der Bibliotheken hing oder scheiterte – zweiter Versuch"
            sudo pkill -x apt-get || true; sudo pkill -x dpkg || true; sleep 5
            sudo dpkg --configure -a || true
          done
      - name: Rauchtests mit zwei Prozessen
        shell: bash
        run: |
          set -o pipefail
          node web/rauchtest/zwei-prozesse.mjs "$RUNNER_TEMP/rauchtest-fehler" 2>&1 | tee "$RUNNER_TEMP/rauchtest.log"
        env:
          DMS_URL: http://localhost:3000
          DMS_DATENWURZEL: ${{ runner.temp }}/rauchtest-daten
          DB_HOST: localhost
          DB_PASSWORT: dms
          DB_NAME: dms_rauchtest
      - name: Fehler der Rauchtests melden
        if: failure()
        shell: bash
        run: |
          # Ohne pipefail: Ein grep ohne Treffer bräche den Schritt sonst vor dem Protokoll von Ablago ab (QS-Runde 11/2026).
          # Der Testläufer meldet Fehlschläge mit „✖“, TAP mit „not ok“.
          set +o pipefail
          grep -n -A12 -E "^(not ok|✖)" "$RUNNER_TEMP/rauchtest.log" 2>/dev/null | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Rauchtests (zwei Prozesse)::/'; echo
          grep -E "ERROR|WARN" "$RUNNER_TEMP/rauchtest-dms.log" 2>/dev/null | tail -n 30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Ablago-Protokoll (zwei Prozesse)::/'; echo
          # Das ganze Protokoll von Ablago kommt zu den Bildern: den Ablauf neben dem Fehler nachlesen.
          mkdir -p "$RUNNER_TEMP/rauchtest-fehler" && cp "$RUNNER_TEMP/rauchtest-dms.log" "$RUNNER_TEMP/rauchtest-fehler/" 2>/dev/null || true
      - name: Bilder der Rauchtests hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rauchtest-fehler-zwei-prozesse
          path: ${{ runner.temp }}/rauchtest-fehler
          if-no-files-found: ignore
          retention-days: 7

  # Sammel-Job (#1056): Der Name „pruefen“ ist Pflichtprüfung im Ruleset „main schützen“, und „version“/„image“ warten
  # auf ihn. Grün nur, wenn alle Teile der Tests und die Rauchtests (auch mit zwei Prozessen) grün sind.
  pruefen:
    runs-on: ubuntu-latest
    needs: [tests, rauchtests, rauchtests-zwei-prozesse]
    if: always()
    steps:
      - name: Alle Teile grün?
        env:
          TESTS: ${{ needs.tests.result }}
          RAUCHTESTS: ${{ needs.rauchtests.result }}
          ZWEI: ${{ needs.rauchtests-zwei-prozesse.result }}
        run: |
          echo "tests: $TESTS · rauchtests: $RAUCHTESTS · zwei Prozesse: $ZWEI"
          [ "$TESTS" = success ] && [ "$RAUCHTESTS" = success ] && [ "$ZWEI" = success ]

  # Stil und Abhängigkeiten (#899), parallel zu „pruefen“: Prettier (#1280), ESLint (mit Typinformation) und dependency-cruiser.
  # Bestand steht in eslint-suppressions.json bzw. .dependency-cruiser-known-violations.json und meldet sich nicht;
  # neuer Code ist voll streng. Die beiden Listen dürfen nie wachsen – umtragen ja, hinzufügen nein.
  # Einträge, die nicht mehr vorkommen, räumt der Workflow „Bestandslisten aufräumen“ auf main ab.
  stil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Bestandslisten wachsen nicht
        if: github.event_name == 'pull_request'
        # Gegen das aktuelle main (erster Elternteil des Merge-Refs), wie bei der Release-Notiz (#952).
        run: |
          git fetch -q --depth=2 origin "$GITHUB_SHA"
          BASIS=$(git rev-parse HEAD^1)
          node --test .github/werkzeuge/ausnahmen-zaehlen.test.mjs
          node .github/werkzeuge/ausnahmen-zaehlen.mjs "$BASIS"
      # Feste Farben nur in web/src/tokens.css (#966); jeder Fund erscheint als Anmerkung an der Zeile. Dazu höchstens
      # 400 Zeilen je CSS-Datei (#1234, ohne Leerzeilen und Kommentare).
      - name: Keine festen Farben, CSS-Dateien kurz
        run: |
          node --test .github/werkzeuge/farben-pruefen.test.mjs
          node .github/werkzeuge/farben-pruefen.mjs
      # Jede Klasse der Gestaltung steht auf oberster Ebene in genau einer Datei, der ihres Besitzers; keine ungenutzten
      # Klassen; z-index nur als Stufe aus tokens.css (#1270). Jeder Fund erscheint als Anmerkung an der Datei.
      - name: Klassen einmal und beim Besitzer
        run: |
          node --test .github/werkzeuge/klassen-pruefen.test.mjs
          node .github/werkzeuge/klassen-pruefen.mjs
      # Jeder Fachordner mit *.dienst.ts hat index.ts und README.md (#1072); was darin steht, prüft niemand.
      - name: Fachordner mit Tür und README
        run: |
          node --test .github/werkzeuge/fachordner-pruefen.test.mjs
          node .github/werkzeuge/fachordner-pruefen.mjs
      # Werkzeug für „Bestandteile und Lizenzen“ im Release-Text (#1393); prüft auch, dass jedes Paket aus „apk add“
      # im Dockerfile und jedes direkt eingebundene npm-Paket einen Zweck in bestandteile-wozu.json hat (#1412), und
      # dass die erzeugte Seite „Aufbau aus Bestandteilen“ im Entwicklerhandbuch aktuell ist (Fehler bei Ebene 1,
      # Zweck oder Einsatz; nur Hinweis, wenn sich bloß Mitgebrachtes geändert hat, etwa durch Dependabot).
      - name: Bestandteile und Lizenzen (Werkzeug)
        run: |
          node --test .github/werkzeuge/bestandteile.test.mjs
          node .github/werkzeuge/bestandteile.mjs --handbuch-pruefen
      - run: npm ci --no-audit --no-fund
      # Formatierung (#1280): Prettier in fester Version aus npm ci; Einstellungen in .prettierrc.json, Ausnahmen in
      # .prettierignore. Rot, wenn eine Datei nicht so aussieht, wie Prettier sie schreibt (`npm run format` behebt das).
      - name: Formatierung (Prettier)
        run: npm run -s format:pruefen
      # Neue Einträge im Abschnitt „Formatierer“ von .git-blame-ignore-revs (Bedingung Sicherheit, #1280): Prettier
      # auf dem Stand davor muss genau diesen Commit ergeben – sonst steckt darin mehr als Formatierung.
      - name: Formatier-Commits nachprüfen
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=2 origin "$GITHUB_SHA"
          BASIS=$(git rev-parse HEAD^1)
          bash .github/werkzeuge/formatierung-nachpruefen.sh --neu "$BASIS"
      - name: Abhängigkeiten (dependency-cruiser)
        run: npm run lint:abh
      # Nur Fehler; jeder erscheint als Anmerkung an der Zeile im Pull Request.
      - name: ESLint
        run: |
          node --test .github/werkzeuge/eslint-ablago.test.mjs
          npx eslint --pass-on-unpruned-suppressions --quiet --format ./.github/werkzeuge/eslint-github.mjs .
      # Toter Code (#1286): knip meldet ungenutzte Dateien, Exporte und Abhängigkeiten. Bestand in knip-bestand.json
      # (wächst nie, siehe „Bestandslisten wachsen nicht“), begründete Ausnahmen in knip.jsonc. Rot bei neuen Funden.
      - name: Toter Code (knip)
        run: |
          node --test .github/werkzeuge/knip-pruefen.test.mjs
          node .github/werkzeuge/knip-pruefen.mjs
      # Warnungen (z. B. Komplexität über 15) nur für die geänderten Dateien – als Hinweis, sie brechen nichts.
      - name: Hinweise zu geänderten Dateien
        if: github.event_name == 'pull_request'
        shell: bash
        # Nur die Dateien dieses Pull Requests: gegen das aktuelle main (erster Elternteil des Merge-Refs, #952).
        run: |
          git fetch -q --depth=2 origin "$GITHUB_SHA"
          BASIS=$(git rev-parse HEAD^1)
          mapfile -t dateien < <(git diff --name-only --diff-filter=d "$BASIS" HEAD -- 'server/src/*.ts' 'server/test/*.ts' 'web/src/*.ts' 'web/src/*.tsx' 'web/test/*.ts' 'shared/src/*.ts' 'shared/test/*.ts')
          if [ "${#dateien[@]}" -eq 0 ]; then echo "Keine geänderten Dateien mit Hinweisen."; exit 0; fi
          npx eslint --pass-on-unpruned-suppressions --format ./.github/werkzeuge/eslint-github.mjs "${dateien[@]}"

  # Pakete aus dms-registry main gegen diesen Stand (#1124): Bricht eine strengere Prüfung im Kern Pakete aus dem Katalog
  # (wie #1108 Basis, Verträge und Rechnungen), steht das hier als Warnung – kein Blocker, nicht in „pruefen“: Die
  # Pakete ändert das Paket-Team in dms-registry, und der Fund gehört dorthin oder in diesen Pull Request. Installiert
  # wird mit dem echten Installer in eine Ablage im Arbeitsspeicher (server/src/pakete/paketpruefung.ts), ohne Netz.
  katalog-pakete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci --no-audit --no-fund
      - name: dms-registry main holen
        run: git clone --quiet --depth 1 https://github.com/motom001/dms-registry "$RUNNER_TEMP/registry"
      - name: Alle Pakete mit diesem Stand installieren
        shell: bash
        run: |
          set +e
          node --import tsx server/src/pakete-pruefen.ts --ergebnis "$RUNNER_TEMP/ergebnis.json" "$RUNNER_TEMP/registry/pakete" > "$RUNNER_TEMP/ergebnis.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/ergebnis.txt"
          { echo '### Pakete aus dms-registry main'; echo; echo '```'; cat "$RUNNER_TEMP/ergebnis.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/ergebnis.json" ]; then
            echo "::warning title=Katalog-Pakete::pakete-pruefen lief nicht durch (Exit-Code $code), Ausgabe oben"
          elif [ "$code" -ne 0 ]; then
            node -e '
              const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              for (const p of e.pakete.filter((x) => !x.ok)) {
                const was = p.id ? `${p.id} ${p.version}` : p.ordner;
                console.log(`::warning title=Katalog-Paket ${was}::${p.gruende.join(" · ").replace(/[\r\n%]/g, " ")}`);
              }' "$RUNNER_TEMP/ergebnis.json"
          fi

  # Pull Requests: Image für beide Architekturen bauen (ohne Veröffentlichung), jeweils auf
  # einem passenden Rechner (#88), und prüfen, ob die Werkzeuge im Image laufen – so fallen
  # falsche Paketnamen und Probleme mit arm64 vor dem Merge auf.
  image-probe:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            rechner: ubuntu-24.04
          - plattform: linux/arm64
            rechner: ubuntu-24.04-arm
    runs-on: ${{ matrix.rechner }}
    # Gewöhnlich 3–4 Minuten; eine hängende Probe hielt einen PR fast zwei Stunden auf (#1369).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Dieselbe Tageskennung der Paketschicht wie beim Bau auf main (#1397): So kommt sie wie dort aus dem Cache, und
      # der Vergleich der Paketlisten unten sieht, was ein Release sähe.
      - id: zeit
        run: |
          echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Release-Version für DMS_VERSION im Image (#1447), wie beim Bau auf main.
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APK_TAG=${{ steps.zeit.outputs.tag }}
            DMS_VERSION=${{ steps.zeit.outputs.version }}
          platforms: ${{ matrix.plattform }}
          load: true
          push: false
          tags: dms:probe
          cache-from: type=gha,scope=${{ matrix.plattform }}
      # Werkzeuge im Image (#459): poppler ja, Texterkennung nein (die ist ein Paket); Größe für die Versionshinweise.
      - name: Werkzeuge und Größe des Images
        run: |
          docker run --rm --entrypoint sh dms:probe -c 'uname -m && pdftotext -v 2>&1 | head -1 && qpdf --version | head -1'
          if docker run --rm --entrypoint sh dms:probe -c 'command -v tesseract'; then echo "::error::tesseract steckt wieder im Image (#459)"; exit 1; fi
          docker run --rm --entrypoint node dms:probe -e "console.log('Node.js', process.version, process.arch)"
          # Version im Image (#1447): DMS_VERSION wie package.json.
          v=$(docker run --rm --entrypoint printenv dms:probe DMS_VERSION)
          [ "$v" = "${{ steps.zeit.outputs.version }}" ] || { echo "::error::DMS_VERSION im Image ist „$v“ statt ${{ steps.zeit.outputs.version }}"; exit 1; }
          groesse=$(docker image inspect dms:probe --format '{{.Size}}')
          echo "::notice title=Image ${{ matrix.plattform }}::$((groesse / 1048576)) MB"
      # Lizenztexte im Image (#1278): Datendateien in server/lizenzen/, die server/src/pakete/lizenztexte.ts beim Start liest.
      - name: Lizenztexte im Image
        run: docker run --rm --entrypoint sh dms:probe -c 'for s in MIT Apache-2.0 BSD-2-Clause BSD-3-Clause MPL-2.0 LGPL-3.0-or-later GPL-3.0-or-later AGPL-3.0-or-later CC0-1.0; do test -s "/app/server/lizenzen/$s.txt" || { echo "::error::Lizenztext $s fehlt im Image"; exit 1; }; done'
      # Schriften im Image (#1329): Ein PDF mit nicht eingebetteter Helvetica und Arial muss sichtbaren Text haben
      # (dunkle Bildpunkte gezählt). Gegenprobe mit leerer fontconfig: Dann muss die Prüfung scheitern – und zwar an
      # den fehlenden Schriften. Ihre Meldungen sind erwartet: ohne „::error::“ in einer Gruppe (#1419), sonst stünden
      # sie als Fehler am Lauf, obwohl der Schritt grün ist.
      - name: Ersatzschriften für nicht eingebettete Schriften
        run: |
          docker run --rm -v "$PWD/.github/werkzeuge:/w:ro" --entrypoint node dms:probe /w/schriften-pruefen.mjs
          printf '<?xml version="1.0"?>\n<fontconfig><dir>/tmp/leer</dir><cachedir>/tmp/fc</cachedir></fontconfig>\n' > "$RUNNER_TEMP/leer.conf"
          if docker run --rm -v "$PWD/.github/werkzeuge:/w:ro" -v "$RUNNER_TEMP/leer.conf:/leer.conf:ro" -e FONTCONFIG_FILE=/leer.conf --entrypoint node dms:probe /w/schriften-pruefen.mjs > "$RUNNER_TEMP/gegenprobe.log" 2>&1; then
            cat "$RUNNER_TEMP/gegenprobe.log"; echo "::error::Die Prüfung der Schriften erkennt fehlende Schriften nicht"; exit 1
          fi
          echo "::group::Gegenprobe ohne Schriften – scheitert wie erwartet"
          sed 's/::error::/erwartet: /' "$RUNNER_TEMP/gegenprobe.log"
          echo "::endgroup::"
          grep -q "Couldn't find a font" "$RUNNER_TEMP/gegenprobe.log" || { echo "::error::Gegenprobe scheiterte, aber nicht an fehlenden Schriften"; exit 1; }
      # Pakete prüfen im Image (#1124) – so, wie die CI von dms-registry es aufruft: Befehl statt CMD, Ordner schreibgeschützt.
      - name: Pakete prüfen im Image
        run: |
          docker run --rm -v "$PWD/server/test/pakete:/pakete:ro" dms:probe pakete-pruefen /pakete/basis
          if docker run --rm dms:probe pakete-pruefen; then echo "::error::pakete-pruefen ohne Ordner muss scheitern"; exit 1; fi
      # Ohne root (#1354), auf beiden Architekturen: Ablago läuft als ablago (1000), die Dokumentwerkzeuge im Werkzeugdienst
      # als ablago-werkzeug (61000) mit Speichergrenze, und ein riesiges PDF endet nur im Werkzeug
      # (.github/werkzeuge/werkzeuge-pruefen.mjs). Ohne Datenbank startet Ablago im Einrichtungsmodus – das genügt dafür.
      # setpriv muss das aus util-linux sein: busybox bringt ein gleichnamiges ohne --reuid mit.
      - name: Ohne root, Dokumentwerkzeuge getrennt und begrenzt
        run: |
          docker run --rm --entrypoint setpriv dms:probe --version | grep -q util-linux || { echo "::error::setpriv im Image ist nicht das aus util-linux"; exit 1; }
          docker run -d --name ohne-root -p 18091:3000 dms:probe >/dev/null
          for _ in $(seq 1 60); do curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:18091/api/konto/status >/dev/null 2>&1 && break; sleep 1; done
          uid() { docker exec ohne-root sh -c 'for p in $(pgrep -f "^node .*$1"); do awk "/^Uid:/ {print \$2}" /proc/$p/status; done | sort -u' uid "$1"; }
          [ "$(uid server/dist/index.js)" = 1000 ] || { echo "::error::Ablago läuft nicht als Benutzer 1000: $(uid server/dist/index.js | tr '\n' ' ')"; docker logs --tail 40 ohne-root; exit 1; }
          [ "$(uid server/dist/werkzeugdienst.js)" = 61000 ] || { echo "::error::Werkzeugdienst läuft nicht als Benutzer 61000"; docker logs --tail 40 ohne-root; exit 1; }
          docker cp .github/werkzeuge/werkzeuge-pruefen.mjs ohne-root:/tmp/werkzeuge-pruefen.mjs
          ergebnis=$(docker exec ohne-root ablago-als node /tmp/werkzeuge-pruefen.mjs) || { echo "$ergebnis"; docker logs --tail 40 ohne-root; exit 1; }
          echo "::notice title=Dokumentwerkzeuge ${{ matrix.plattform }}::$ergebnis"
          curl -fsS --max-time 10 http://127.0.0.1:18091/api/konto/status >/dev/null || { echo "::error::Ablago antwortet nach dem riesigen PDF nicht mehr"; exit 1; }
          docker rm -f ohne-root >/dev/null
      # Benutzer aus dem Datenordner (#1466), Image dms auf beiden Architekturen (dms-komplett: komplett-probe, Schritt 2e):
      # Bind-Mounts eines NAS-Benutzers (1026:100) ohne PUID → Ablago läuft als 1026:100 und schreibt nichts um;
      # schreibgeschützt eingebundener Ordner → Startseite nennt den Grund und den Ausweg.
      - name: Benutzer aus dem Datenordner
        shell: bash
        run: |
          set -euo pipefail
          k="$RUNNER_TEMP/kennung"
          sudo mkdir -p "$k/files/2025" "$k/geheim" "$k/sicherung"
          printf 'vom NAS\n' | sudo tee "$k/files/2025/vom-nas.txt" >/dev/null
          sudo chmod 755 "$k/files" "$k/files/2025" "$k/geheim" "$k/sicherung"; sudo chmod 644 "$k/files/2025/vom-nas.txt"
          sudo chown -R 1026:100 "$k/files" "$k/geheim" "$k/sicherung"
          liste() { sudo find "$k/files" "$k/geheim" "$k/sicherung" -printf '%p|%u:%g %m\n'; }
          vorher=$(liste)
          docker run -d --name kennung -p 18097:3000 -v "$k/files:/data/files" -v "$k/geheim:/data/geheim" -v "$k/sicherung:/data/sicherung" dms:probe >/dev/null
          for _ in $(seq 1 60); do curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:18097/api/konto/status >/dev/null 2>&1 && break; sleep 1; done
          ist=$(docker exec kennung sh -c 'p=$(pgrep -f "^node .*server/dist/index.js" | head -1); awk "/^Uid:/ {u = \$2} /^Gid:/ {g = \$2} END {print u \":\" g}" /proc/$p/status')
          [ "$ist" = 1026:100 ] || { echo "::error::Ablago läuft als $ist statt 1026:100 (Bind-Mount ohne PUID)"; docker logs --tail 40 kennung; exit 1; }
          # Protokoll erst ganz lesen (wie in komplett-probe.sh): Mit pipefail scheiterte „docker logs | grep -q“, sobald grep
          # beim ersten Treffer endet und docker logs noch schreibt (SIGPIPE, 19.11.2026).
          grep -q "wie der Besitzer des Datenordners" <<< "$(docker logs kennung 2>&1)" || { echo "::error::kein Satz zum Benutzer im Protokoll"; docker logs --tail 40 kennung; exit 1; }
          weg=$(awk -F'|' 'NR == FNR { v[$1] = $2; next } ($1 in v) && v[$1] != $2 { print $1 ": " v[$1] " → " $2 }' <(echo "$vorher") <(liste) | head -5)
          [ -z "$weg" ] || { echo "::error::Dateien des NAS-Benutzers umgeschrieben: $weg"; exit 1; }
          fremd=$(sudo find "$k/files" "$k/geheim" "$k/sicherung" ! -uid 1026 | head -5)
          [ -z "$fremd" ] || { echo "::error::gehört nicht 1026: $fremd"; exit 1; }
          [ "$(docker exec kennung ablago-als id -u)" = 1026 ] || { echo "::error::ablago-als (docker exec) nicht als 1026"; exit 1; }
          docker rm -f kennung >/dev/null
          echo "::notice title=Benutzer aus dem Datenordner ${{ matrix.plattform }}::Bind-Mount 1026:100 ohne PUID → läuft als 1026:100, nichts umgeschrieben"
          ro="$RUNNER_TEMP/kennung-ro"; mkdir -p "$ro"
          docker run -d --name kennung-ro -p 18097:3000 -e DMS_START_FEHLER_WARTEN_S=60 -v "$ro:/data/files:ro" dms:probe >/dev/null
          s=""
          for _ in $(seq 1 60); do s=$(curl -fsS --connect-timeout 2 --max-time 5 -H 'accept-language: de' http://127.0.0.1:18097/ 2>/dev/null || true); grep -q "Ablago konnte nicht starten" <<< "$s" && break; sleep 1; done
          grep -q "schreibgeschützt eingebunden" <<< "$s" || { echo "::error::Fehlerseite nennt den schreibgeschützten Ordner nicht"; echo "$s"; docker logs --tail 40 kennung-ro; exit 1; }
          grep -q "die Angabe :ro entfernen" <<< "$(docker logs kennung-ro 2>&1)" || { echo "::error::Protokoll ohne Abhilfe für :ro"; docker logs --tail 40 kennung-ro; exit 1; }
          docker rm -f kennung-ro >/dev/null
      # Einrichtungsskript für den Raspberry Pi (#578); shellcheck ist auf den GitHub-Rechnern vorinstalliert.
      - name: Einrichtungsskript prüfen
        if: matrix.plattform == 'linux/amd64'
        run: shellcheck deploy/image/einstieg.sh deploy/image/start-hilfen.sh deploy/image/ablago-als.sh deploy/image/werkzeug-grenzen.sh deploy/raspberry-pi/einrichten.sh .github/werkzeuge/update-test.sh .github/werkzeuge/stabil-pruefen.sh .github/werkzeuge/stabil-pruefen.test.sh .github/werkzeuge/stabil-bisher.sh .github/werkzeuge/stabil-auswahl.sh .github/werkzeuge/pr-labels.sh .github/werkzeuge/apk-versionen-vergleichen.sh .github/werkzeuge/apk-versionen-vergleichen.test.sh .github/werkzeuge/apt-pakete.sh .github/werkzeuge/apt-pakete.test.sh .github/werkzeuge/apt-spiegel.sh
      # dms-komplett (#208): Ablago und PostgreSQL in einem Container – auf beiden Architekturen.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: komplett
          platforms: ${{ matrix.plattform }}
          load: true
          push: false
          build-args: |
            APK_TAG=${{ steps.zeit.outputs.tag }}
            DMS_VERSION=${{ steps.zeit.outputs.version }}
          tags: dms-komplett:probe
          cache-from: type=gha,scope=${{ matrix.plattform }}
      # Gleiche Alpine-Pakete in beiden Varianten (#1397): gemeinsame Pakete müssen dieselbe Version haben, je
      # Architektur. Liest nur /lib/apk/db/installed aus beiden Images (wenige Sekunden).
      - name: Alpine-Pakete beider Varianten gleich
        run: |
          docker run --rm --entrypoint cat dms:probe /lib/apk/db/installed > "$RUNNER_TEMP/apk-dms"
          docker run --rm --entrypoint cat dms-komplett:probe /lib/apk/db/installed > "$RUNNER_TEMP/apk-komplett"
          if ! .github/werkzeuge/apk-versionen-vergleichen.sh "$RUNNER_TEMP/apk-dms" "$RUNNER_TEMP/apk-komplett" dms dms-komplett > "$RUNNER_TEMP/apk-abweichend"; then
            while read -r zeile; do echo "::error title=Alpine-Pakete ${{ matrix.plattform }}::$zeile"; done < "$RUNNER_TEMP/apk-abweichend"
            exit 1
          fi
      # Probe-Installationen gleichzeitig (#1059) – sie sind voneinander unabhängig (eigene Ports, Namen, Ordner):
      # - Vorlagen für Synology, UGREEN, QNAP, TrueNAS, Unraid (#179) und den Raspberry Pi (#578): starten, Ablago
      #   antwortet, Assistent beginnt ohne Datenbankschritt (nur amd64);
      # - dms-komplett (#208) auf beiden Architekturen;
      # - Update-Test (#714): vom bisherigen :stabil (bis es das gibt: vom letzten Release) auf diesen Stand (nur amd64).
      # Jede Probe schreibt ihr eigenes Protokoll; es erscheint danach in einer eigenen Gruppe. Eine gescheiterte Probe
      # lässt den Schritt scheitern.
      # Zeitgrenze je Probe (#1369): Gewöhnlich ist der ganze Schritt nach gut 2 Minuten fertig (109–134 s in den
      # letzten 25 Läufen). 15 Minuten lassen das Siebenfache Luft für langsame Rechner und liegen sicher unter den
      # 30 Minuten des Jobs – so bricht die Probe ab, solange der Job noch läuft, und ihr Protokoll erscheint noch.
      # Nach TERM bleiben 30 s fürs Aufräumen der Container, dann KILL.
      - name: Probe-Installationen (gleichzeitig)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AMD64: ${{ matrix.plattform == 'linux/amd64' }}
          GRENZE: 15m
        run: |
          d="$RUNNER_TEMP/probe"; mkdir -p "$d"
          namen=(); pids=()
          starte() { local n=$1; shift; timeout --kill-after=30s "$GRENZE" "$@" > "$d/$n.log" 2>&1 & namen+=("$n"); pids+=($!); }
          if [ "$AMD64" = true ]; then
            starte vorlagen deploy/vorlagen-probe.sh dms:probe
            bisher=$(timeout 2m .github/werkzeuge/stabil-bisher.sh dms-komplett) || bisher=""
            starte update .github/werkzeuge/update-test.sh "$bisher" dms-komplett:probe
          fi
          starte komplett deploy/komplett-probe.sh dms-komplett:probe
          fehler=0
          for i in "${!namen[@]}"; do
            n=${namen[$i]}; code=0
            wait "${pids[$i]}" || code=$?
            # timeout meldet 124 (nach TERM beendet) bzw. 137 (nach KILL).
            case $code in
              0) zustand=ok ;;
              124|137) zustand="Zeitgrenze überschritten ($GRENZE)"; fehler=1 ;;
              *) zustand="FEHLER (Code $code)"; fehler=1 ;;
            esac
            echo "::group::$n – $zustand"; cat "$d/$n.log"; echo "::endgroup::"
            [ "$code" = 0 ] || echo "::error title=Probe $n::$zustand, Protokoll in der Gruppe „$n“"
          done
          exit $fehler
      # Bekannte Sicherheitslücken in den Systempaketen (#220): kritisch mit Korrektur → Fehler.
      # Eine Architektur genügt, die Pakete sind dieselben.
      - name: Trivy installieren
        if: matrix.plattform == 'linux/amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/werkzeuge/trivy-installieren.sh
      - name: Sicherheitslücken im Image dms
        if: matrix.plattform == 'linux/amd64'
        run: .github/werkzeuge/image-pruefen.sh dms:probe
      - name: Sicherheitslücken im Image dms-komplett
        if: matrix.plattform == 'linux/amd64'
        run: .github/werkzeuge/image-pruefen.sh dms-komplett:probe

  # Neue Versionsnummer in package.json auf main? Dann gibt es ein Release (#34).
  version:
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Zeitgrenze (#1369): gewöhnlich 5–12 s.
    timeout-minutes: 5
    permissions:
      contents: read
      # Label „sofort-stabil“ am Pull Request (#907)
      pull-requests: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
      # Ordner des Handbuchs zu dieser Version (#111): je Minor-Version, z. B. v0.22.
      handbuch: ${{ steps.v.outputs.handbuch }}
      sofort: ${{ steps.v.outputs.sofort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "handbuch=v$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "v$version gibt es schon – kein neues Release."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version v$version – nach dem Image entsteht das Release."
            # Dringende Fehlerbehebung (#907): mit „sofort-stabil“ am Pull Request wandert :stabil gleich mit.
            # Seit #952 gehört der Versions-Commit zu keinem PR; pr-labels.sh liest dann „Pull-Request: #…“ im Commit.
            sofort=$(.github/werkzeuge/pr-labels.sh "$REPO" "$SHA" | tr ',' '\n' | grep -qx sofort-stabil && echo true || echo false)
            echo "sofort=$sofort" >> "$GITHUB_OUTPUT"
            if [ "$sofort" = true ]; then echo "Label sofort-stabil: :stabil wandert direkt nach dem Release."; fi
          fi

  # Image je Architektur auf einem passenden Rechner bauen (#88): arm64 auf einem echten
  # ARM-Rechner statt emuliert (QEMU stürzte dort gelegentlich mit Fehler 132 ab). Jeder Teil
  # wird nur unter seinem Prüfwert (Digest) hochgeladen; „image-zusammen“ setzt daraus das
  # gemeinsame Image mit allen Tags zusammen.
  image:
    needs: [pruefen, version]
    # Läuft auch, wenn „version“ übersprungen wurde (Tags, manueller Start).
    if: always() && needs.pruefen.result == 'success' && github.event_name != 'pull_request' && needs.version.result != 'failure'
    # Zwei Images (#208): dms (Standard) und dms-komplett (mit PostgreSQL), je zwei Architekturen.
    strategy:
      fail-fast: false
      matrix:
        variante: [dms, komplett]
        plattform: [linux/amd64, linux/arm64]
        include:
          - plattform: linux/amd64
            rechner: ubuntu-24.04
            name: amd64
          - plattform: linux/arm64
            rechner: ubuntu-24.04-arm
            name: arm64
          - variante: dms
            image: dms
          - variante: komplett
            image: dms-komplett
    runs-on: ${{ matrix.rechner }}
    # Zeitgrenze (#1369): gewöhnlich 1–2 Minuten, mit kaltem Cache bis gut 5.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: zeit
        run: |
          echo "jetzt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Release-Version aus package.json (#1447): das Image setzt DMS_VERSION selbst.
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - id: bau
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            DMS_COMMIT=${{ github.sha }}
            DMS_GEBAUT=${{ steps.zeit.outputs.jetzt }}
            DMS_VERSION=${{ steps.zeit.outputs.version }}
            APK_TAG=${{ steps.zeit.outputs.tag }}
          target: ${{ matrix.variante }}
          platforms: ${{ matrix.plattform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plattform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plattform }}
      - name: Prüfwert merken
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.bau.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variante }}-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-zusammen:
    needs: [version, image]
    if: always() && needs.image.result == 'success'
    strategy:
      matrix:
        include:
          - variante: dms
            image: dms
          - variante: komplett
            image: dms-komplett
    runs-on: ubuntu-latest
    # Zeitgrenze (#1369): gewöhnlich etwa 1 Minute.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Herkunftsnachweis und SBOM (#220)
      id-token: write
      attestations: write
      # Funde der Image-Prüfung in Security → Code scanning (#220)
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/werkzeuge
            .trivyignore
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variante }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # :latest setzt nur der Job „latest“ nach dem Release (#1398) – auch nicht bei einem von Hand gepushten Tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=main,enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.neu == 'true' }}
      - name: Gemeinsames Image mit allen Tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" -eq 2 || { echo "::error::Es fehlt eine Architektur: $(ls)"; exit 1; }
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)
      - name: Prüfen
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}" | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)' >/dev/null
      - id: digest
        name: Prüfwert des gemeinsamen Images
        run: |
          d=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@$d" >> "$GITHUB_OUTPUT"
      # Sicherheitslücken (#220): Das Image ist schon veröffentlicht, hier wird nur gemeldet –
      # im Security-Reiter und als Anmerkung. Blockiert wird im Pull Request (image-probe).
      # Ein gestörter Download von Trivy darf das Release nicht aufhalten (504 von github.com, 08.11.2026).
      - name: Trivy installieren
        id: trivy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/werkzeuge/trivy-installieren.sh
      - name: Trivy nicht verfügbar
        if: steps.trivy.outcome == 'failure'
        run: echo "::warning title=Trivy::Trivy ließ sich nicht laden – Prüfung der veröffentlichten Images übersprungen (im Pull Request wurde geprüft)."
      - name: Sicherheitslücken im Image
        if: steps.trivy.outcome == 'success'
        run: .github/werkzeuge/image-pruefen.sh "${{ steps.digest.outputs.ref }}" --sarif "$RUNNER_TEMP/trivy.sarif" --nur-melden
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: image-${{ matrix.image }}
      # Stückliste (SBOM) und Herkunftsnachweis (#220): prüfbar mit
      #   gh attestation verify oci://ghcr.io/motom001/dms:<version> -R motom001/dms
      - name: Stückliste (SBOM) erzeugen
        run: trivy image --quiet --format spdx-json --output "$RUNNER_TEMP/sbom.spdx.json" "${{ steps.digest.outputs.ref }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      # Bestandteile und Lizenzen im Release-Text (#1393): je Architektur eine Stückliste (die angehängte oben deckt
      # nur die Architektur des Runners ab), dazu die Digests und die Node-Version aus dem Image. Daraus schreibt
      # release.yml die Übersicht und die Anhänge. Gelingt das nicht, erscheint das Release trotzdem – mit Hinweis.
      - name: Stand für „Bestandteile und Lizenzen“
        id: bestandteile
        if: needs.version.outputs.neu == 'true' && steps.trivy.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VARIANTE: ${{ matrix.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          ordner="$RUNNER_TEMP/bestandteile"
          mkdir -p "$ordner"
          archs=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -c '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | {(.platform.architecture): .digest}] | add')
          [ "$(jq 'keys | length' <<< "$archs")" -eq 2 ] || { echo "::error::Nicht beide Architekturen im Index: $archs"; exit 1; }
          node=$(docker buildx imagetools inspect "$IMAGE@$(jq -r .amd64 <<< "$archs")" --format '{{json .Image}}' |
            jq -r '(.config.Env // [])[] | select(startswith("NODE_VERSION=")) | ltrimstr("NODE_VERSION=")')
          for arch in amd64 arm64; do
            trivy image --quiet --image-src remote --platform "linux/$arch" --format spdx-json \
              --output "$ordner/$VARIANTE-$arch.spdx.json" "$IMAGE@$DIGEST"
          done
          jq -n --arg variante "$VARIANTE" --arg image "$IMAGE" --arg digest "$DIGEST" --arg node "$node" --argjson architekturen "$archs" \
            '{variante: $variante, image: $image, digest: $digest, node: $node, architekturen: $architekturen}' > "$ordner/stand-$VARIANTE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bestandteile.outcome == 'success'
        with:
          name: bestandteile-${{ matrix.image }}
          path: ${{ runner.temp }}/bestandteile
          retention-days: 7

  # Tag und Release anlegen. Ein vom Workflow angelegter Tag startet keine weiteren
  # Workflows; deshalb trägt das Image oben schon die Versionsnummer.
  release:
    needs: [version, image-zusammen]
    if: needs.version.outputs.neu == 'true' && needs.image-zusammen.result == 'success'
    permissions:
      contents: write
      # Herkunftsnachweis der Anhänge „Bestandteile und Lizenzen“ (#1405)
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      ziel: ${{ github.sha }}

  # :latest (#1398): immer die zuletzt veröffentlichte Version, für dms und dms-komplett (beide Architekturen) –
  # gesetzt erst, wenn das Release angelegt ist, und nur bei einer neuen Version (der wöchentliche Neubau setzt
  # nur :main). Nicht zu verwechseln mit der Markierung „Latest“ bei GitHub: die trägt das Release von :stabil.
  # Laufen zwei Releases kurz hintereinander, wandert :latest nie zurück: gesetzt wird nur, wenn kein höheres
  # Release X.Y.Z existiert.
  latest:
    needs: [version, release]
    if: needs.release.result == 'success' && needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    # Zeitgrenze: zwei Manifeste umhängen, gewöhnlich unter einer Minute.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: :latest auf die neue Version
        run: |
          set -o pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::notice title=:latest::$VERSION ist keine Version X.Y.Z – :latest bleibt"; exit 0; }
          hoechste=$(gh api "repos/$REPO/releases?per_page=100" -q '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' |
            sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$hoechste" ] && [ "$hoechste" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$hoechste" "$VERSION" | sort -V | tail -1)" = "$hoechste" ]; then
            echo "::notice title=:latest::bleibt – v$hoechste ist neuer als v$VERSION"; exit 0
          fi
          for image in dms dms-komplett; do
            ref="ghcr.io/$OWNER/$image"
            docker buildx imagetools inspect --raw "$ref:$VERSION" | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)' >/dev/null \
              || { echo "::error::$ref:$VERSION fehlt oder hat nicht beide Architekturen"; exit 1; }
            docker buildx imagetools create -t "$ref:latest" "$ref:$VERSION"
            d() { docker buildx imagetools inspect "$ref:$1" --format '{{json .Manifest}}' | jq -r .digest; }
            [ "$(d latest)" = "$(d "$VERSION")" ] || { echo "::error::$ref:latest zeigt nicht auf $VERSION"; exit 1; }
            echo "::notice title=:latest::$image:latest → $VERSION"
          done

  # :stabil (#714, #907): wandert nicht mehr mit jedem Release, sondern einmal pro Woche (stabil.yml).
  # Ausnahme für dringende Fehlerbehebungen: Label „sofort-stabil“ am Pull Request – dann gleich nach
  # dem Release, mit denselben Prüfungen (beide Images, Herkunftsnachweis, Update-Test vom bisherigen
  # :stabil). „nicht-stabil“ hält auch dann zurück; zurückrollen mit dem Workflow „:stabil zurücksetzen“.
  stabil:
    needs: [version, release]
    if: needs.release.result == 'success' && needs.version.outputs.sofort == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: read
      attestations: read
    uses: ./.github/workflows/stabil.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Handbuch online (#846): nur „aktuell“, veröffentlicht über GitHub Actions.
  handbuch:
    needs: [version, release]
    if: needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/handbuch.yml
    with:
      version: ${{ needs.version.outputs.handbuch }}
      ref: ${{ github.sha }}
