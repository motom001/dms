name: Prüfen und Image bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Jede Woche neu bauen (#214): neue Alpine-Pakete (poppler, PostgreSQL in dms-komplett) auch ohne neues Release.
  # Ergibt nur das Tag main (und den Kurz-Hash); Versionsnummern bleiben unverändert.
  schedule:
    - cron: '17 3 * * 1'

# Grundsätzlich nur lesen (#221); Schreibrechte bekommt nur der Job, der sie braucht.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    # Ein hängender Test soll die Reihe nicht stundenlang blockieren (sonst läuft der Job bis 6 h).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Genau die Versionen aus package-lock.json (#215).
      # Versionsnummer erst beim Merge (#952): Wer das Programm ändert, bringt genau einen Schnipsel
      # docs/releases/neu/<name>.md mit („art: patch|minor|keine“). Dependabot ist ausgenommen.
      - name: Release-Notiz
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth 1 origin "$BASIS"
          node --test .github/werkzeuge/version.test.mjs
          node .github/werkzeuge/version.mjs pruefen "$BASIS"
      - run: npm ci --no-audit --no-fund
      # Bekannte Sicherheitslücken in den Abhängigkeiten, die im Image landen (#215): ab „hoch“ schlägt die Prüfung fehl.
      - name: Sicherheitslücken in Abhängigkeiten
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log || {
            grep -E "Severity|^[a-z@].*  |fix available|No fix" audit.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=npm audit::/'
            echo
            exit 1
          }
      # poppler und qpdf (#45, #459): dieselben Werkzeuge wie im Image – ohne Texterkennung (die ist ein Paket).
      # Erst ohne „apt-get update“ (#905), nur wenn das scheitert mit – das Update dauert mal 10 s, mal über 3 Minuten.
      - name: poppler und qpdf installieren
        run: sudo apt-get install -y -qq poppler-utils qpdf >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf >/dev/null; }
      # IMAP-Testserver für die Postfächer (#196); fehlt das Image, laufen die übrigen Tests trotzdem.
      - name: IMAP-Testserver (GreenMail) starten
        run: |
          if docker run -d --name greenmail -p 3025:3025 -p 3143:3143 \
               -e GREENMAIL_OPTS='-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=dms:geheim@dms.test -Dgreenmail.verbose=false' \
               greenmail/standalone:2.1.15 >/dev/null; then echo "IMAP_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          else echo "::warning::GreenMail nicht verfügbar – IMAP-Test übersprungen"; fi
      - name: Typen prüfen
        run: npm run typecheck
      # Jede Testdatei mit PostgreSQL legt sich eine eigene Datenbank an (#900, test/hilfe-db.ts).
      # Quarantäne (#900): Tests aus server/test/quarantaene.json laufen mit, brechen aber nicht ab; ihr Ergebnis
      # steht in der Zusammenfassung. Steht einer über seine Fälligkeit hinaus darin, scheitert der Schritt.
      - name: Tests (inklusive PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee test.log || status=$?
          node --import tsx server/test/quarantaene.ts test.log "$status" || {
            # Fehlschläge als Anmerkungen ausgeben, damit sie ohne Log-Zugriff sichtbar sind.
            # Fehlschläge als Anmerkungen ausgeben (die Job-Logs sind nicht überall abrufbar).
            grep -n -B2 -A30 "^ *not ok" test.log | head -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'
            echo
            exit 1
          }
        env:
          TEST_DATABASE_URL: postgres://dms:dms@localhost:5432/dms_test
      # Der offizielle Katalog unter seiner echten Adresse: erreichbar, nur https, Signatur gültig (#688).
      - name: Offizieller Katalog erreichbar und signiert
        run: node --import tsx server/werkzeuge/katalog-erreichbar.ts
      # Wann :stabil weiterwandert (#714, #907): kein Release → kein :stabil, Vorabversionen und „nicht-stabil“ nie;
      # Auswahl im Wochenlauf (mindestens 24 Stunden alt, nie zurück).
      - name: Regeln für :stabil
        run: .github/werkzeuge/stabil-pruefen.test.sh
      - name: Bauen
        run: npm run build

      # Rauchtests für die Oberfläche (#897): die wichtigsten Wege einmal im Browser, gegen das eben gebaute Ablago –
      # gestartet wie im Workflow „Handbuch“: ohne Datenbank-Anbindung, der erste Test geht den Assistenten durch und
      # legt dabei die eigene Datenbank dms_rauchtest im PostgreSQL dieses Jobs an.
      - name: Ablago für die Rauchtests starten
        run: nohup node server/dist/index.js > "$RUNNER_TEMP/rauchtest-dms.log" 2>&1 &
        env:
          DMS_DATENWURZEL: ${{ runner.temp }}/rauchtest-daten
          PORT: '3000'
          DMS_VERSION: rauchtest
      # Dieselbe feste Playwright-Version wie im Workflow „Handbuch“ (#289), nur Chromium. Die Rechner von GitHub
      # bringen die Bibliotheken für Chromium mit; nur wenn der Browser so nicht startet, kommen sie per apt dazu –
      # höchstens 5 Minuten je Versuch, dann ein zweiter (die apt-Installation hängt gelegentlich).
      - name: Playwright für die Rauchtests installieren
        working-directory: web/rauchtest
        shell: bash
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.64.1
          timeout 300 npx playwright install chromium || { echo "::warning::Download von Chromium hing oder scheiterte – zweiter Versuch"; timeout 300 npx playwright install chromium; }
          if node -e "const { chromium } = require('playwright'); chromium.launch().then((b) => b.close())"; then exit 0; fi
          echo "::notice::Chromium startet nicht – Bibliotheken per apt nachinstallieren"
          for versuch in 1 2; do
            timeout 300 npx playwright install-deps chromium && exit 0
            [ "$versuch" = 2 ] && exit 1
            echo "::warning::Installation der Bibliotheken hing oder scheiterte – zweiter Versuch"
            sudo pkill -x apt-get || true; sudo pkill -x dpkg || true; sleep 5
            sudo dpkg --configure -a || true
          done
      - name: Rauchtests der Oberfläche
        shell: bash
        run: |
          set -o pipefail
          node web/rauchtest/rauchtest.mjs "$RUNNER_TEMP/rauchtest-fehler" 2>&1 | tee "$RUNNER_TEMP/rauchtest.log"
        env:
          DMS_URL: http://localhost:3000
          DMS_DATENWURZEL: ${{ runner.temp }}/rauchtest-daten
          DB_HOST: localhost
          DB_PASSWORT: dms
          DB_NAME: dms_rauchtest
      # Fehler als Anmerkungen (die Job-Logs sind nicht überall abrufbar) und Bilder der Seiten zum Nachsehen.
      - name: Fehler der Rauchtests melden
        if: failure()
        shell: bash
        run: |
          grep -n -A12 "^not ok" "$RUNNER_TEMP/rauchtest.log" 2>/dev/null | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Rauchtests::/'; echo
          grep -E "ERROR|WARN" "$RUNNER_TEMP/rauchtest-dms.log" 2>/dev/null | tail -n 30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Ablago-Protokoll (Rauchtests)::/'; echo
      - name: Bilder der Rauchtests hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rauchtest-fehler
          path: ${{ runner.temp }}/rauchtest-fehler
          if-no-files-found: ignore
          retention-days: 7

  # Pull Requests: Image für beide Architekturen bauen (ohne Veröffentlichung), jeweils auf
  # einem passenden Rechner (#88), und prüfen, ob die Werkzeuge im Image laufen – so fallen
  # falsche Paketnamen und Probleme mit arm64 vor dem Merge auf.
  image-probe:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            rechner: ubuntu-24.04
          - plattform: linux/arm64
            rechner: ubuntu-24.04-arm
    runs-on: ${{ matrix.rechner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.plattform }}
          load: true
          push: false
          tags: dms:probe
          cache-from: type=gha,scope=${{ matrix.plattform }}
      # Werkzeuge im Image (#459): poppler ja, Texterkennung nein (die ist ein Paket); Größe für die Versionshinweise.
      - name: Werkzeuge und Größe des Images
        run: |
          docker run --rm --entrypoint sh dms:probe -c 'uname -m && pdftotext -v 2>&1 | head -1 && qpdf --version | head -1'
          if docker run --rm --entrypoint sh dms:probe -c 'command -v tesseract'; then echo "::error::tesseract steckt wieder im Image (#459)"; exit 1; fi
          docker run --rm --entrypoint node dms:probe -e "console.log('Node.js', process.version, process.arch)"
          groesse=$(docker image inspect dms:probe --format '{{.Size}}')
          echo "::notice title=Image ${{ matrix.plattform }}::$((groesse / 1048576)) MB"
      # Vorlagen für Synology, UGREEN, QNAP, TrueNAS, Unraid (#179) und den Raspberry Pi (#578): starten, Ablago antwortet,
      # Assistent beginnt ohne Datenbankschritt.
      - name: Vorlagen probehalber installieren
        if: matrix.plattform == 'linux/amd64'
        run: deploy/vorlagen-probe.sh dms:probe
      # Einrichtungsskript für den Raspberry Pi (#578); shellcheck ist auf den GitHub-Rechnern vorinstalliert.
      - name: Einrichtungsskript prüfen
        if: matrix.plattform == 'linux/amd64'
        run: shellcheck deploy/raspberry-pi/einrichten.sh .github/werkzeuge/update-test.sh .github/werkzeuge/stabil-pruefen.sh .github/werkzeuge/stabil-pruefen.test.sh .github/werkzeuge/stabil-bisher.sh .github/werkzeuge/stabil-auswahl.sh .github/werkzeuge/pr-labels.sh
      # dms-komplett (#208): Ablago und PostgreSQL in einem Container – auf beiden Architekturen.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: komplett
          platforms: ${{ matrix.plattform }}
          load: true
          push: false
          tags: dms-komplett:probe
          cache-from: type=gha,scope=${{ matrix.plattform }}
      - name: dms-komplett probehalber installieren
        run: deploy/komplett-probe.sh dms-komplett:probe
      # Update-Test (#714): vom bisherigen :stabil (bis es das gibt: vom letzten Release) auf diesen Stand.
      - name: Update vom bisherigen Stand
        if: matrix.plattform == 'linux/amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/werkzeuge/update-test.sh "$(.github/werkzeuge/stabil-bisher.sh dms-komplett)" dms-komplett:probe
      # Bekannte Sicherheitslücken in den Systempaketen (#220): kritisch mit Korrektur → Fehler.
      # Eine Architektur genügt, die Pakete sind dieselben.
      - name: Trivy installieren
        if: matrix.plattform == 'linux/amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/werkzeuge/trivy-installieren.sh
      - name: Sicherheitslücken im Image dms
        if: matrix.plattform == 'linux/amd64'
        run: .github/werkzeuge/image-pruefen.sh dms:probe
      - name: Sicherheitslücken im Image dms-komplett
        if: matrix.plattform == 'linux/amd64'
        run: .github/werkzeuge/image-pruefen.sh dms-komplett:probe

  # Neue Versionsnummer in package.json auf main? Dann gibt es ein Release (#34).
  version:
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Label „sofort-stabil“ am Pull Request (#907)
      pull-requests: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
      # Ordner des Handbuchs zu dieser Version (#111): je Minor-Version, z. B. v0.22.
      handbuch: ${{ steps.v.outputs.handbuch }}
      sofort: ${{ steps.v.outputs.sofort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "handbuch=v$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "v$version gibt es schon – kein neues Release."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version v$version – nach dem Image entsteht das Release."
            # Dringende Fehlerbehebung (#907): mit „sofort-stabil“ am Pull Request wandert :stabil gleich mit.
            # Seit #952 gehört der Versions-Commit zu keinem PR; pr-labels.sh liest dann „Pull-Request: #…“ im Commit.
            sofort=$(.github/werkzeuge/pr-labels.sh "$REPO" "$SHA" | tr ',' '\n' | grep -qx sofort-stabil && echo true || echo false)
            echo "sofort=$sofort" >> "$GITHUB_OUTPUT"
            if [ "$sofort" = true ]; then echo "Label sofort-stabil: :stabil wandert direkt nach dem Release."; fi
          fi

  # Image je Architektur auf einem passenden Rechner bauen (#88): arm64 auf einem echten
  # ARM-Rechner statt emuliert (QEMU stürzte dort gelegentlich mit Fehler 132 ab). Jeder Teil
  # wird nur unter seinem Prüfwert (Digest) hochgeladen; „image-zusammen“ setzt daraus das
  # gemeinsame Image mit allen Tags zusammen.
  image:
    needs: [pruefen, version]
    # Läuft auch, wenn „version“ übersprungen wurde (Tags, manueller Start).
    if: always() && needs.pruefen.result == 'success' && github.event_name != 'pull_request' && needs.version.result != 'failure'
    # Zwei Images (#208): dms (Standard) und dms-komplett (mit PostgreSQL), je zwei Architekturen.
    strategy:
      fail-fast: false
      matrix:
        variante: [dms, komplett]
        plattform: [linux/amd64, linux/arm64]
        include:
          - plattform: linux/amd64
            rechner: ubuntu-24.04
            name: amd64
          - plattform: linux/arm64
            rechner: ubuntu-24.04-arm
            name: arm64
          - variante: dms
            image: dms
          - variante: komplett
            image: dms-komplett
    runs-on: ${{ matrix.rechner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: zeit
        run: |
          echo "jetzt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: bau
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            DMS_COMMIT=${{ github.sha }}
            DMS_GEBAUT=${{ steps.zeit.outputs.jetzt }}
            APK_TAG=${{ steps.zeit.outputs.tag }}
          target: ${{ matrix.variante }}
          platforms: ${{ matrix.plattform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plattform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plattform }}
      - name: Prüfwert merken
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.bau.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variante }}-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-zusammen:
    needs: [version, image]
    if: always() && needs.image.result == 'success'
    strategy:
      matrix:
        include:
          - variante: dms
            image: dms
          - variante: komplett
            image: dms-komplett
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Herkunftsnachweis und SBOM (#220)
      id-token: write
      attestations: write
      # Funde der Image-Prüfung in Security → Code scanning (#220)
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/werkzeuge
            .trivyignore
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variante }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=main,enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.neu == 'true' }}
      - name: Gemeinsames Image mit allen Tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" -eq 2 || { echo "::error::Es fehlt eine Architektur: $(ls)"; exit 1; }
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)
      - name: Prüfen
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}" | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)' >/dev/null
      - id: digest
        name: Prüfwert des gemeinsamen Images
        run: |
          d=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@$d" >> "$GITHUB_OUTPUT"
      # Sicherheitslücken (#220): Das Image ist schon veröffentlicht, hier wird nur gemeldet –
      # im Security-Reiter und als Anmerkung. Blockiert wird im Pull Request (image-probe).
      # Ein gestörter Download von Trivy darf das Release nicht aufhalten (504 von github.com, 08.11.2026).
      - name: Trivy installieren
        id: trivy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/werkzeuge/trivy-installieren.sh
      - name: Trivy nicht verfügbar
        if: steps.trivy.outcome == 'failure'
        run: echo "::warning title=Trivy::Trivy ließ sich nicht laden – Prüfung der veröffentlichten Images übersprungen (im Pull Request wurde geprüft)."
      - name: Sicherheitslücken im Image
        if: steps.trivy.outcome == 'success'
        run: .github/werkzeuge/image-pruefen.sh "${{ steps.digest.outputs.ref }}" --sarif "$RUNNER_TEMP/trivy.sarif" --nur-melden
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: image-${{ matrix.image }}
      # Stückliste (SBOM) und Herkunftsnachweis (#220): prüfbar mit
      #   gh attestation verify oci://ghcr.io/motom001/dms:<version> -R motom001/dms
      - name: Stückliste (SBOM) erzeugen
        run: trivy image --quiet --format spdx-json --output "$RUNNER_TEMP/sbom.spdx.json" "${{ steps.digest.outputs.ref }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

  # Tag und Release anlegen. Ein vom Workflow angelegter Tag startet keine weiteren
  # Workflows; deshalb trägt das Image oben schon die Versionsnummer.
  release:
    needs: [version, image-zusammen]
    if: needs.version.outputs.neu == 'true' && needs.image-zusammen.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      ziel: ${{ github.sha }}

  # :stabil (#714, #907): wandert nicht mehr mit jedem Release, sondern einmal pro Woche (stabil.yml).
  # Ausnahme für dringende Fehlerbehebungen: Label „sofort-stabil“ am Pull Request – dann gleich nach
  # dem Release, mit denselben Prüfungen (beide Images, Herkunftsnachweis, Update-Test vom bisherigen
  # :stabil). „nicht-stabil“ hält auch dann zurück; zurückrollen mit dem Workflow „:stabil zurücksetzen“.
  stabil:
    needs: [version, release]
    if: needs.release.result == 'success' && needs.version.outputs.sofort == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: read
      attestations: read
    uses: ./.github/workflows/stabil.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Handbuch online (#846): nur „aktuell“, veröffentlicht über GitHub Actions.
  handbuch:
    needs: [version, release]
    if: needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/handbuch.yml
    with:
      version: ${{ needs.version.outputs.handbuch }}
      ref: ${{ github.sha }}
