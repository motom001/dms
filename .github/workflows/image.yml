name: Prüfen und Image bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Texterkennung (#45): dieselben Werkzeuge wie im Image.
      - name: Texterkennung installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu poppler-utils >/dev/null
      - name: Typen prüfen
        run: npm run typecheck
      - name: Tests (inklusive PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # Fehlschläge als Anmerkungen ausgeben, damit sie ohne Log-Zugriff sichtbar sind.
            # Fehlschläge als Anmerkungen ausgeben (die Job-Logs sind nicht überall abrufbar).
            grep -n -B2 -A30 "^ *not ok" test.log | head -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'
            echo
            exit 1
          }
        env:
          TEST_DATABASE_URL: postgres://dms:dms@localhost:5432/dms_test
      - name: Bauen
        run: npm run build

  # Pull Requests: Image für amd64 bauen (ohne Veröffentlichung) und prüfen, ob die
  # Texterkennung im Image läuft – so fallen falsche Paketnamen vor dem Merge auf.
  image-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dms:probe
          cache-from: type=gha
      - name: Texterkennung im Image
        run: |
          docker run --rm --entrypoint sh dms:probe -c 'tesseract --version | head -1 && tesseract --list-langs && pdftotext -v 2>&1 | head -1'
          docker run --rm --entrypoint sh dms:probe -c 'tesseract --list-langs' | grep -qx deu

  # Neue Versionsnummer in package.json auf main? Dann gibt es ein Release (#34).
  version:
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "v$version gibt es schon – kein neues Release."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version v$version – nach dem Image entsteht das Release."
          fi

  image:
    needs: [pruefen, version]
    # Läuft auch, wenn „version“ übersprungen wurde (Tags, manueller Start).
    if: always() && needs.pruefen.result == 'success' && github.event_name != 'pull_request' && needs.version.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.neu == 'true' }}
      - id: zeit
        run: echo "jetzt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            DMS_COMMIT=${{ github.sha }}
            DMS_GEBAUT=${{ steps.zeit.outputs.jetzt }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag und Release anlegen. Ein vom Workflow angelegter Tag startet keine weiteren
  # Workflows; deshalb trägt das Image oben schon die Versionsnummer.
  release:
    needs: [version, image]
    if: needs.version.outputs.neu == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      ziel: ${{ github.sha }}
