name: Prüfen und Image bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Texterkennung (#45): dieselben Werkzeuge wie im Image.
      - name: Texterkennung installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu poppler-utils >/dev/null
      - name: Typen prüfen
        run: npm run typecheck
      - name: Tests (inklusive PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # Fehlschläge als Anmerkungen ausgeben, damit sie ohne Log-Zugriff sichtbar sind.
            # Fehlschläge als Anmerkungen ausgeben (die Job-Logs sind nicht überall abrufbar).
            grep -n -B2 -A30 "^ *not ok" test.log | head -120 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'
            echo
            exit 1
          }
        env:
          TEST_DATABASE_URL: postgres://dms:dms@localhost:5432/dms_test
      - name: Bauen
        run: npm run build

  # Pull Requests: Image für beide Architekturen bauen (ohne Veröffentlichung), jeweils auf
  # einem passenden Rechner (#88), und prüfen, ob die Texterkennung im Image läuft – so fallen
  # falsche Paketnamen und Probleme mit arm64 vor dem Merge auf.
  image-probe:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            rechner: ubuntu-24.04
          - plattform: linux/arm64
            rechner: ubuntu-24.04-arm
    runs-on: ${{ matrix.rechner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.plattform }}
          load: true
          push: false
          tags: dms:probe
          cache-from: type=gha,scope=${{ matrix.plattform }}
      - name: Texterkennung im Image
        run: |
          docker run --rm --entrypoint sh dms:probe -c 'uname -m && tesseract --version | head -1 && tesseract --list-langs && pdftotext -v 2>&1 | head -1'
          docker run --rm --entrypoint sh dms:probe -c 'tesseract --list-langs' | grep -qx deu
          docker run --rm --entrypoint node dms:probe -e "console.log('Node.js', process.version, process.arch)"

  # Neue Versionsnummer in package.json auf main? Dann gibt es ein Release (#34).
  version:
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "v$version gibt es schon – kein neues Release."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version v$version – nach dem Image entsteht das Release."
          fi

  # Image je Architektur auf einem passenden Rechner bauen (#88): arm64 auf einem echten
  # ARM-Rechner statt emuliert (QEMU stürzte dort gelegentlich mit Fehler 132 ab). Jeder Teil
  # wird nur unter seinem Prüfwert (Digest) hochgeladen; „image-zusammen“ setzt daraus das
  # gemeinsame Image mit allen Tags zusammen.
  image:
    needs: [pruefen, version]
    # Läuft auch, wenn „version“ übersprungen wurde (Tags, manueller Start).
    if: always() && needs.pruefen.result == 'success' && github.event_name != 'pull_request' && needs.version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - plattform: linux/amd64
            rechner: ubuntu-24.04
            name: amd64
          - plattform: linux/arm64
            rechner: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.rechner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: zeit
        run: echo "jetzt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: bau
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            DMS_COMMIT=${{ github.sha }}
            DMS_GEBAUT=${{ steps.zeit.outputs.jetzt }}
          platforms: ${{ matrix.plattform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plattform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plattform }}
      - name: Prüfwert merken
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.bau.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-zusammen:
    needs: [version, image]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.neu == 'true' }}
      - name: Gemeinsames Image mit allen Tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" -eq 2 || { echo "::error::Es fehlt eine Architektur: $(ls)"; exit 1; }
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Prüfen
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)' >/dev/null

  # Tag und Release anlegen. Ein vom Workflow angelegter Tag startet keine weiteren
  # Workflows; deshalb trägt das Image oben schon die Versionsnummer.
  release:
    needs: [version, image-zusammen]
    if: needs.version.outputs.neu == 'true' && needs.image-zusammen.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      ziel: ${{ github.sha }}
