# Einmaliges Hilfswerkzeug für #289 (nur auf werkzeug/pins, kommt nicht nach main).
name: Pins ermitteln
on:
  push:
    branches: ['werkzeug/pins']
permissions:
  contents: read
jobs:
  pins:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          pip install --quiet pip-tools
          pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras --no-header -o docs/handbuch/requirements.txt docs/handbuch/requirements.in
          {
            for i in node:24-alpine python:3.12-alpine; do echo "$i $(docker buildx imagetools inspect $i --format '{{json .Manifest.Digest}}')"; done
            echo "playwright $(npm view playwright@1 version | tail -n1)"
          } > pins.txt
          cat pins.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handbuch/requirements.txt pins.txt
          git commit -m "Pins ermittelt"
          git push origin HEAD:werkzeug/pins
