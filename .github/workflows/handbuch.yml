name: Handbuch

# Baut alle vier Handbücher mit aktuellen Screenshots, auf Deutsch und Englisch (#730: …/<handbuch>/aktuell/en/).
# Online gibt es nur noch „aktuell“ (#846),
# veröffentlicht über GitHub Actions (Pages-Quelle „GitHub Actions“, kein Zweig gh-pages).
# Ältere Fassungen bringt jede Installation unter /hilfe/ mit (#219).
#   Release (image.yml)    → bauen und veröffentlichen
#   von Hand auf main      → bauen und veröffentlichen (z. B. nach einer Störung)
#   PRs                    → nur bauen und prüfen; PRs legen die Screenshots als Artefakt ab.
# Nach einem Merge auf main baut nichts mehr (#905) – veröffentlicht wird über die Release-Kette.
#
# Ablauf (#905): Die Bildschirmfotos auf Deutsch und Englisch und die iPhone-Prüfung laufen parallel im Job
# „bilder“, jeweils mit eigenem Ablago und eigener Datenbank. „bauen“ (Pflicht-Prüfung) wartet auf alle drei,
# holt die Bilder ab, baut die Handbücher und macht die übrigen Prüfungen.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version für „Neu in dieser Version“, z. B. v0.22 (leer = entwicklung)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version für „Neu in dieser Version“, z. B. v0.22'
        required: true
        type: string
      ref:
        description: 'Commit, aus dem gebaut wird'
        required: true
        type: string

# Grundsätzlich nur lesen (#221); Schreibrechte bekommt nur der Job, der sie braucht.
permissions:
  contents: read

# Neuer Stand im PR bricht den alten Lauf ganz ab (#905), alle Jobs zusammen. Release und Start von Hand bekommen
# je Lauf eine eigene Gruppe; dort gilt weiter nur die Gruppe von „bauen“ (und „pages“ beim Veröffentlichen).
concurrency:
  group: handbuch-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Bildschirmfotos und Prüfungen mit laufendem Ablago (#905): je Teil ein eigener Rechner mit frischem Ablago.
  #   de    – Bildschirmfotos auf Deutsch nach bilder/ (mit openapi.json und den README-Bildern)
  #   en    – Bildschirmfotos auf Englisch nach bilder/en/ (#730)
  #   mobil – iPhone-Größe, erweiterte Suche, gleichzeitig bearbeiten; Daten wie für die Bilder (DMS_NUR_DATEN)
  bilder:
    name: bilder (${{ matrix.teil }})
    runs-on: ubuntu-latest
    # Ein hängender Browser-Schritt soll den PR nicht stundenlang blockieren (sonst läuft der Job bis 6 h).
    timeout-minutes: 20
    strategy:
      # Alle drei zu Ende laufen lassen: Fehlerbilder der iPhone-Prüfung auch dann, wenn ein anderer Teil scheitert.
      fail-fast: false
      matrix:
        teil: [de, en, mobil]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dms -d dms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # poppler und qpdf wie im Image (#459: ohne Texterkennung – die ist ein Paket).
      # Erst ohne „apt-get update“ (#905), nur wenn das scheitert mit – das Update dauert mal 10 s, mal über 3 Minuten.
      - name: poppler und qpdf installieren
        run: sudo apt-get install -y -qq poppler-utils qpdf >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf >/dev/null; }

      # Testbau (#967): mit der Musterseite der Bausteine unter /muster – ihre Bilder zeigt das Entwicklerhandbuch.
      - name: Ablago bauen
        run: |
          npm ci --no-audit --no-fund
          npm run build
        env:
          VITE_MUSTER: '1'

      # Ohne DATABASE_URL: Ablago startet im Einrichtungsmodus, das Screenshot-Skript geht den
      # Assistenten im Browser durch (#119) – inklusive Datenbank-Schritt und Start ohne Neustart.
      - name: Ablago starten (ohne Datenbank-Anbindung)
        run: |
          nohup node server/dist/index.js > "$RUNNER_TEMP/dms.log" 2>&1 &
        env:
          # Feste Ordner (#115) außerhalb von Docker: files, geheim, sicherung unter dieser Wurzel.
          DMS_DATENWURZEL: ${{ runner.temp }}/daten
          PORT: '3000'
          DMS_VERSION: handbuch

      # Chromium für die Bilder und die Prüfungen, WebKit zusätzlich für die iPhone-Prüfung (#174, #489).
      - name: Playwright installieren
        working-directory: docs/handbuch/screenshots
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.64.1  # feste Version (#289)
          # Die Installation hängt bei GitHub gelegentlich (apt der Browser-Abhängigkeiten): höchstens 5 Minuten, dann
          # ein zweiter Versuch – statt dass der ganze Job erst an seiner Zeitgrenze abbricht.
          for versuch in 1 2; do
            timeout 480 npx playwright install --with-deps chromium ${{ matrix.teil == 'mobil' && 'webkit' || '' }} && break
            [ "$versuch" = 2 ] && exit 1
            echo "::warning::Playwright-Installation hing oder scheiterte – zweiter Versuch"
            # timeout beendet nur npx; ein hängendes apt-get hielte sonst die Sperre von dpkg fest.
            sudo pkill -x apt-get || true; sudo pkill -x dpkg || true; sleep 5
            sudo dpkg --configure -a || true
          done

      - name: Screenshots aufnehmen
        if: matrix.teil == 'de'
        working-directory: docs/handbuch/screenshots
        run: |
          set -o pipefail
          node aufnehmen.mjs "$GITHUB_WORKSPACE/docs/handbuch/bilder" 2>&1 | tee "$RUNNER_TEMP/aufnahme.log"
          # Das README bindet diese beiden Bilder vom Handbuch ein (#290) – ohne sie kein Handbuch.
          for b in readme readme-dunkel; do test -s "$GITHUB_WORKSPACE/docs/handbuch/bilder/$b.png" || { echo "::error title=README-Bild::$b.png fehlt"; exit 1; }; done
        shell: bash
        env:
          DMS_URL: http://localhost:3000
          # Einrichtungscode liegt unter <Wurzel>/geheim/EINRICHTUNGSCODE; Datenbank für den Assistenten.
          DMS_DATENWURZEL: ${{ runner.temp }}/daten
          DB_HOST: localhost
          DB_PASSWORT: dms

      # Bildschirmfotos auf Englisch (#730): ein eigenes, frisches Ablago mit englischer Oberfläche nach bilder/en/.
      # Solange die Oberfläche noch kein Englisch spricht (#729), endet das Skript ohne Bilder; die englischen
      # Handbücher zeigen dann die deutschen mit einem Hinweis. Ein Fehler hier hält das Handbuch nicht auf –
      # dann fehlen nur englische Bilder.
      - name: Bildschirmfotos auf Englisch
        if: matrix.teil == 'en'
        continue-on-error: true
        working-directory: docs/handbuch/screenshots
        run: |
          set -o pipefail
          node aufnehmen.mjs "$GITHUB_WORKSPACE/docs/handbuch/bilder/en" 2>&1 | tee "$RUNNER_TEMP/aufnahme.log"
        shell: bash
        env:
          DMS_URL: http://localhost:3000
          DMS_SPRACHE: en
          DMS_DATENWURZEL: ${{ runner.temp }}/daten
          DB_HOST: localhost
          DB_PASSWORT: dms

      # Für die Prüfungen (#905): Assistent und dieselben Daten wie für die Bilder, aber ohne Bildschirmfotos.
      - name: Ablago einrichten und Daten anlegen
        if: matrix.teil == 'mobil'
        working-directory: docs/handbuch/screenshots
        run: |
          set -o pipefail
          node aufnehmen.mjs "$RUNNER_TEMP/einrichtung" 2>&1 | tee "$RUNNER_TEMP/aufnahme.log"
        shell: bash
        env:
          DMS_URL: http://localhost:3000
          DMS_NUR_DATEN: '1'
          DMS_DATENWURZEL: ${{ runner.temp }}/daten
          DB_HOST: localhost
          DB_PASSWORT: dms

      # iPhone-Größe mit WebKit (#174, #489): kein Eingabefeld und kein Element ragt über den Rand, Menüs im Bild.
      - name: Oberfläche in iPhone-Größe prüfen
        if: matrix.teil == 'mobil'
        working-directory: docs/handbuch/screenshots
        run: |
          set -o pipefail
          node mobil-pruefen.mjs "$RUNNER_TEMP/mobil" 2>&1 | tee -a "$RUNNER_TEMP/aufnahme.log"
        shell: bash
        env:
          DMS_URL: http://localhost:3000

      # Erweiterte Suche (#199): Formular, Chips, Link in der Adresse, Ablauf am Handy.
      - name: Erweiterte Suche prüfen
        if: matrix.teil == 'mobil'
        working-directory: docs/handbuch/screenshots
        run: |
          set -o pipefail
          node suche-pruefen.mjs "$RUNNER_TEMP/mobil" 2>&1 | tee -a "$RUNNER_TEMP/aufnahme.log"
        shell: bash
        env:
          DMS_URL: http://localhost:3000

      # Gleichzeitig bearbeiten (#609): dieselbe Mappe in zwei Fenstern, Rückfrage hell/dunkel, breit/Handy.
      - name: Gleichzeitig bearbeiten prüfen
        if: matrix.teil == 'mobil'
        working-directory: docs/handbuch/screenshots
        run: |
          set -o pipefail
          node gleichzeitig-pruefen.mjs "$RUNNER_TEMP/mobil" 2>&1 | tee -a "$RUNNER_TEMP/aufnahme.log"
        shell: bash
        env:
          DMS_URL: http://localhost:3000

      # Bilder für „bauen“ (#905), nur für diesen Lauf. Ohne englische Bilder gibt es kein Artefakt „bilder-en“.
      - name: Bilder an „bauen“ übergeben
        if: matrix.teil != 'mobil'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilder-${{ matrix.teil }}
          path: ${{ matrix.teil == 'en' && 'docs/handbuch/bilder/en' || 'docs/handbuch/bilder' }}
          if-no-files-found: ${{ matrix.teil == 'en' && 'ignore' || 'error' }}
          retention-days: 1

      # Immer (#489): Bilder in iPhone SE/15/17 Pro-Größe zum Nachsehen, bei Fehlern mit den Fundstellen.
      - name: Bilder der iPhone-Prüfung hochladen
        if: always() && matrix.teil == 'mobil'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobil-pruefung
          path: ${{ runner.temp }}/mobil
          if-no-files-found: ignore

      # Fehler als Anmerkungen ausgeben – die Job-Logs sind nicht überall abrufbar.
      - name: Fehler bei den Screenshots melden
        if: failure()
        shell: bash
        run: |
          tail -n 40 "$RUNNER_TEMP/aufnahme.log" 2>/dev/null | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Screenshots (${{ matrix.teil }})::/'; echo
          grep -E "ERROR|WARN|error" "$RUNNER_TEMP/dms.log" | tail -n 30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Ablago-Protokoll (${{ matrix.teil }})::/'; echo

  # Pflicht-Prüfung im Ruleset „main schützen“ – der Name „bauen“ bleibt. „bauen“ läuft immer (ein übersprungener
  # Job zählt bei GitHub als bestanden) und scheitert als Erstes, wenn ein Teil von „bilder“ nicht durchlief.
  bauen:
    needs: bilder
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: handbuch-bauen-${{ inputs.version || github.ref }}
      cancel-in-progress: true
    env:
      ZIEL: ${{ inputs.version || 'entwicklung' }}
    steps:
      - name: Bilder vollständig?
        if: needs.bilder.result != 'success'
        run: |
          echo "::error title=Bilder::Bildschirmfotos oder Prüfungen in „bilder“ sind gescheitert (${{ needs.bilder.result }}) – Einzelheiten dort."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      # Nur für die Prüfskripte (tsx, shared/); Ablago selbst wird hier nicht gebaut.
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Bilder abholen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bilder-*
          path: ${{ runner.temp }}/bilder

      # Deutsch nach bilder/, Englisch (falls aufgenommen) nach bilder/en/ – wie bisher in einem Job.
      - name: Bilder einsortieren
        shell: bash
        run: |
          test -d "$RUNNER_TEMP/bilder/bilder-de" || { echo "::error title=Bilder::Bilder auf Deutsch fehlen"; exit 1; }
          rm -rf docs/handbuch/bilder
          mv "$RUNNER_TEMP/bilder/bilder-de" docs/handbuch/bilder
          if [ -d "$RUNNER_TEMP/bilder/bilder-en" ]; then mv "$RUNNER_TEMP/bilder/bilder-en" docs/handbuch/bilder/en; fi
          test -s docs/handbuch/bilder/openapi.json || { echo "::error title=Bilder::openapi.json fehlt"; exit 1; }
          echo "$(find docs/handbuch/bilder -maxdepth 1 -name '*.png' | wc -l) Bilder auf Deutsch, $(find docs/handbuch/bilder/en -maxdepth 1 -name '*.png' 2>/dev/null | wc -l) auf Englisch"

      - name: Neu in dieser Version
        run: python3 docs/handbuch/werkzeuge/neu.py "$ZIEL"

      - name: Handbücher bauen
        run: |
          pip install --quiet --require-hashes -r docs/handbuch/requirements.txt  # feste Versionen mit Hashes (#289)
          # Seite „Begriffe“ aus dem Glossar (#276).
          python3 docs/handbuch/werkzeuge/glossar.py
          # Tabellen der Werkbank-Bereiche aus shared/src/werkbankansicht.ts (#296).
          python3 docs/handbuch/werkzeuge/werkbank_bereiche.py --pruefen
          # Vorlagen Verfahrensdokumentation (#213) und Löschkonzept (#389) als Word und LibreOffice zum Herunterladen.
          command -v pandoc >/dev/null || sudo apt-get install -y -qq pandoc >/dev/null
          mkdir -p docs/handbuch/admin/docs/vorlagen
          for v in verfahrensdokumentation loeschkonzept; do
            for f in docx odt; do pandoc "docs/handbuch/vorlagen/$v.md" -o "docs/handbuch/admin/docs/vorlagen/$v.$f"; done
          done
          # Bilder brauchen Benutzer- und Administratorhandbuch; die anderen verlinken dorthin.
          for h in benutzer admin; do
            cp -r docs/handbuch/bilder "docs/handbuch/$h/docs/bilder"
          done
          # Entwicklerhandbuch (#967): nur die Bilder der Musterseite („Gestaltung und Bausteine“).
          mkdir -p docs/handbuch/entwickler/docs/bilder
          cp docs/handbuch/bilder/muster-*.png docs/handbuch/entwickler/docs/bilder/
          if ls docs/handbuch/bilder/en/muster-*.png >/dev/null 2>&1; then
            mkdir -p docs/handbuch/entwickler/docs/bilder/en; cp docs/handbuch/bilder/en/muster-*.png docs/handbuch/entwickler/docs/bilder/en/
          fi
          # Die Anleitung für den Raspberry Pi (#578) zeigt ein paar Bilder des Einrichtungsassistenten selbst.
          mkdir -p docs/handbuch/installieren/docs/bilder
          for b in einrichtung-code einrichtung-pakete anmelden werkbank-demo; do
            cp "docs/handbuch/bilder/$b.png" docs/handbuch/installieren/docs/bilder/
            # Englische Fassung, falls aufgenommen (#730)
            if [ -f "docs/handbuch/bilder/en/$b.png" ]; then mkdir -p docs/handbuch/installieren/docs/bilder/en; cp "docs/handbuch/bilder/en/$b.png" docs/handbuch/installieren/docs/bilder/en/; fi
          done
          mkdir -p docs/handbuch/admin/docs/api
          mv docs/handbuch/admin/docs/bilder/openapi.json docs/handbuch/admin/docs/api/openapi.json
          rm -f docs/handbuch/benutzer/docs/bilder/openapi.json
          # Alle Handbücher (#179, #180): Benutzer, Administrator, Installieren, Entwickler –
          # erst Deutsch, dann Englisch in den Unterordner en/ (#730).
          for h in benutzer admin installieren entwickler; do
            SITE_URL="https://help.ablago.app/$h/aktuell/" mkdocs build --strict -f "docs/handbuch/$h/mkdocs.yml" -d "$GITHUB_WORKSPACE/site/$h"
            SITE_URL="https://help.ablago.app/$h/aktuell/en/" mkdocs build --strict -f "docs/handbuch/$h/mkdocs.en.yml" -d "$GITHUB_WORKSPACE/site/$h/en"
          done
          # Größe (#730): GitHub Pages erlaubt 1 GB, veroeffentlichen.py bricht über 900 MB ab.
          { echo '### Größe der Handbücher'; echo; echo '| Handbuch | Deutsch und Englisch | davon Englisch |'; echo '| --- | --- | --- |';
            for h in benutzer admin installieren entwickler; do echo "| $h | $(du -sh "site/$h" | cut -f1) | $(du -sh "site/$h/en" | cut -f1) |"; done; } >> "$GITHUB_STEP_SUMMARY"

      # Gleiche Anker in jeder Sprache (#730): fehlende Seiten oder Abschnitte der Übersetzung auflisten, bricht nie ab.
      # Was die Oberfläche verlinkt, prüft „Hilfe-Links prüfen“ – das bricht ab.
      - name: Übersetzung vollständig?
        continue-on-error: true
        run: python3 docs/handbuch/werkzeuge/anker.py en --pruefen

      # Weiche Zeitangaben (#303): Liste zum Durchsehen in der Zusammenfassung des Laufs, bricht nie ab.
      - name: Weiche Zeitangaben auflisten
        continue-on-error: true
        run: python3 docs/handbuch/werkzeuge/zeitangaben.py --markdown >> "$GITHUB_STEP_SUMMARY" || true

      # Jede Stelle der kontextbezogenen Hilfe (#110) muss im gebauten Handbuch existieren.
      - name: Hilfe-Links prüfen
        run: npx tsx docs/handbuch/werkzeuge/hilfe-pruefen.ts site

      # Nichts von fremden Diensten (#698): keine Schriften, Skripte, Stile oder Bilder von außerhalb
      # help.ablago.app – weder in den Handbüchern noch auf der Einstiegsseite. Links nach draußen sind erlaubt.
      - name: Nichts von fremden Diensten
        run: python3 docs/handbuch/werkzeuge/fremd.py site docs/handbuch/start/index.html docs/handbuch/start/en/index.html

      # Offline-Fassung fürs Image (#219): baut wie im Dockerfile und prüft lokale Verweise und Hilfe-Ziele.
      - name: Offline-Hilfe prüfen
        run: |
          python3 docs/handbuch/werkzeuge/offline.py "$RUNNER_TEMP/hilfe"
          npx tsx docs/handbuch/werkzeuge/hilfe-pruefen.ts "$RUNNER_TEMP/hilfe"

      - name: Screenshots zum Ansehen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/handbuch/bilder
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: handbuch
          path: site
          retention-days: 3

  # Über GitHub Actions veröffentlichen (#846). Immer nur ein Lauf zur Zeit (#898): Die Gruppe „pages“ ohne
  # cancel-in-progress bricht ein laufendes Deployment nie ab; ein neuerer Lauf wartet, und von mehreren wartenden
  # behält GitHub nur den neuesten – veröffentlicht wird also immer der neueste Stand.
  veroeffentlichen:
    needs: bauen
    # Aufgerufen aus image.yml (inputs.ref gesetzt) oder von Hand auf main – nie bei PRs oder einem einfachen Push.
    if: github.event_name != 'pull_request' && (inputs.ref != '' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.bereitstellen.outputs.page_url || steps.nochmal.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: quelle
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handbuch
          path: gebaut
      - name: Seite zusammenstellen
        run: python3 quelle/docs/handbuch/werkzeuge/veroeffentlichen.py seite gebaut quelle/docs/handbuch/start/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: seite
      # Lehnt GitHub ab („in progress deployment“, etwa ein Deployment von außerhalb dieser Gruppe) oder läuft die Zeit
      # ab: nach einer Pause genau ein zweiter Versuch (#898). Erst wenn auch der scheitert, wird der Lauf rot.
      - id: bereitstellen
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Pause vor dem zweiten Versuch
        if: steps.bereitstellen.outcome == 'failure'
        run: sleep 90
      - id: nochmal
        name: Zweiter Versuch
        if: steps.bereitstellen.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
