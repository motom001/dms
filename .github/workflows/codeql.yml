# CodeQL im Advanced Setup (S1, 31.10.2026).
# Warum nicht das Default Setup: Es läuft nicht auf Pull Requests von Dependabot. Die Rulesets
# verlangen aber die Prüfung „CodeQL“ – Dependabot-PRs blieben dadurch für immer blockiert.
# Dieser Workflow läuft auf allen Pull Requests (auch von Dependabot), auf main und wöchentlich.
# Die Prüfung „CodeQL“ im Ruleset entsteht weiter aus dem Hochladen der Ergebnisse.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Zeitgrenze (#1369): gewöhnlich 1–7 Minuten (javascript-typescript).
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
