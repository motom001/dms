# Ablago auf QNAP (Container Station) – Vorlage aus https://github.com/motom001/dms (deploy/qnap)
# Anleitung: https://help.ablago.app/installieren/aktuell/qnap/
#
# Nur eine Stelle ändern: das Passwort in der nächsten Zeile. Ein langes aus Buchstaben und
# Zahlen genügt. Es schützt die Datenbank und steht danach nur noch in dieser Datei.
x-passwort: &passwort "HIER-EIN-LANGES-PASSWORT-EINTRAGEN"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: *passwort
      # Datenbank genau im Ordner unten (#1464): postgres:18 legt sie sonst unter /var/lib/postgresql/18/docker ab,
      # also in einem unbenannten Volume, das beim Neuanlegen des Containers verloren ginge.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - /share/Container/dms/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/motom001/dms:stabil
    restart: unless-stopped
    # Ohne Administratorrechte (#1354, #1466): Ablago läuft als derselbe Benutzer, dem die Ordner unten gehören
    # (gehören sie root: 1000:1000), und kann keine Rechte zurückgewinnen. PUID und PGID unter environment nur, wenn
    # Ablago ausdrücklich als ein anderer Benutzer laufen soll.
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dasselbe Passwort für Ablago – der Einrichtungsassistent überspringt dann den Datenbankschritt.
      DMS_DB_PASSWORT: *passwort
    volumes:
      # Hochgeladene Dateien
      - /share/Container/dms/files:/data/files
      # Schlüssel und Einrichtungscode – getrennt von den Sicherungen aufbewahren
      - /share/Container/dms/geheim:/data/geheim
      # Sicherungen (Werkbank → Sicherung) – ab und zu an einen anderen Ort kopieren
      - /share/Container/dms/sicherung:/data/sicherung
      # Exporte (optional, #797): Vollexport, „Meine Daten exportieren“, Auskünfte – unverschlüsselt.
      # Ohne diese Zeile liegen sie im Container; nach dem Herunterladen bzw. nach 7 Tagen sind sie ohnehin weg.
      # Mit eigenem Ort (z. B. für große Exporte zum Kopieren) nie in den Sicherungsordner legen.
      # - /share/Container/dms/export:/data/export
      # Eingangsordner (optional): Scanner und NAS legen hier Dateien ab → neue Post
      - /share/Container/dms/eingang:/eingang
    ports:
      - "8080:3000"
