# pg_hba.conf von dms-komplett (#1354), gilt auch für Datenbanken, die schon in /data/postgres liegen
# (start.sh startet PostgreSQL mit hba_file=…).
#
# Socket: ohne Passwort – der Ordner des Sockets ist nur für postgres (und root) zugänglich (start.sh).
# 127.0.0.1: nur mit Passwort. Das Passwort der Rolle dms setzt start.sh bei jedem Start neu und gibt es nur Ablago mit;
# andere Benutzer im Container (etwa die Dokumentwerkzeuge) kennen es nicht.
local   all   all                  trust
host    all   all   127.0.0.1/32   scram-sha-256
host    all   all   ::1/128        scram-sha-256
