# Ablago als ein Container mit eingebauter Datenbank (dms-komplett, #208) – Vorlage aus
# https://github.com/motom001/dms (deploy/komplett)
# Anleitung: https://help.ablago.app/installieren/aktuell/komplett/
#
# Nichts einzutragen: kein Passwort, keine Datenbank. Die Ordner liegen neben dieser Datei;
# auf einem NAS z. B. /volume1/docker/dms/files statt ./files.
services:
  dms:
    image: ghcr.io/motom001/dms-komplett:stabil
    restart: unless-stopped
    # Ohne Administratorrechte (#1354, #1466): Ablago läuft als derselbe Benutzer, dem die Ordner unten gehören
    # (gehören sie root: 1000:1000), und kann keine Rechte zurückgewinnen. PUID und PGID unter environment nur, wenn
    # Ablago ausdrücklich als ein anderer Benutzer laufen soll.
    security_opt:
      - no-new-privileges:true
    # Beim Stoppen fährt der Container erst Ablago, dann die Datenbank sauber herunter. Nicht entfernen:
    # Ohne diese Zeile beendet Docker PostgreSQL nach 10 Sekunden hart (#943).
    stop_grace_period: 60s
    volumes:
      # Hochgeladene Dateien
      - ./files:/data/files
      # Schlüssel und Einrichtungscode – getrennt von den Sicherungen aufbewahren
      - ./geheim:/data/geheim
      # Sicherungen (Werkbank → Sicherung) – ab und zu an einen anderen Ort kopieren
      - ./sicherung:/data/sicherung
      # Exporte (optional, #797): Vollexport, „Meine Daten exportieren“, Auskünfte – unverschlüsselt.
      # Ohne diese Zeile liegen sie im Container; nach dem Herunterladen bzw. nach 7 Tagen sind sie ohnehin weg.
      # Mit eigenem Ort (z. B. für große Exporte zum Kopieren) nie in den Sicherungsordner legen.
      # - ./export:/data/export
      # Datenbank (PostgreSQL 18) – darf nicht fehlen, sonst ist sie beim nächsten Update weg. Gern auf der SSD;
      # die Rechte richtet der Container selbst (#943).
      - ./postgres:/data/postgres
      # Eingangsordner (optional): Scanner und NAS legen hier Dateien ab → neue Post
      - ./eingang:/eingang
    ports:
      - "8080:3000"
