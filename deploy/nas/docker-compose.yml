# Vorlage für den Betrieb auf dem NAS.
# Daneben eine Datei .env anlegen mit:  DB_PASSWORD=<langes zufälliges Passwort>
# Pfade unter /volume1/docker/dms an den Docker-Ordner deines NAS anpassen.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      - /volume1/docker/dms/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/motom001/dms:stabil
    restart: unless-stopped
    # Ohne Administratorrechte (#1354): Ablago läuft als eigener Benutzer (Vorgabe 1000:1000) und kann keine Rechte
    # zurückgewinnen. Sollen die Ordner einem Benutzer des NAS gehören, PUID und PGID unter environment setzen
    # (die Zahlen zeigt „id <benutzer>“), z. B. PUID: "1026" und PGID: "100".
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    # Die Verbindung zur Datenbank fragt der Einrichtungsassistent im Browser ab (Server „db“,
    # Benutzer und Datenbank „dms“, Passwort aus der .env) und speichert sie in /data/geheim.
    # E-Mail-Versand und die Adresse von Ablago stellst du in der Werkbank ein.
    # Hinter einem Reverse-Proxy (nginx …) ist nichts einzustellen: Ablago glaubt Proxys im
    # eigenen Rechner und in privaten Netzen von selbst. Abschalten mit TRUST_PROXY: "false".
    # Die Ordner im Container sind fest; wohin sie auf dem NAS zeigen, bestimmst du nur hier.
    volumes:
      # Hochgeladene Dateien, Logos, Fehlerbilder.
      - /volume1/docker/dms/files:/data/files
      # Schlüssel für gespeicherte Passwörter (Werkbank → Verschlüsselung).
      # Getrennt von der Datenbank sichern – ohne ihn sind Passwörter in einer Sicherung nicht lesbar.
      - /volume1/docker/dms/geheim:/data/geheim
      # Sicherungen (Werkbank → Sicherung), verschlüsselt. Am besten auf einer anderen Platte
      # als Datenbank und Dateien – und vom NAS weiterkopiert (3-2-1-Regel).
      - /volume1/docker/dms/sicherung:/data/sicherung
      # Exporte (optional, #797): Vollexport, „Meine Daten exportieren“, Auskünfte – unverschlüsselt.
      # Ohne diese Zeile liegen sie im Container; nach dem Herunterladen bzw. nach 7 Tagen sind sie ohnehin weg.
      # Mit eigenem Ort (z. B. für große Exporte zum Kopieren) nie in den Sicherungsordner legen.
      # - /volume1/docker/dms/export:/data/export
      # Eingangsordner (optional): Scanner und NAS legen hier Dateien ab → neue Post
      - /volume1/docker/dms/eingang:/eingang
    ports:
      - "8080:3000"
