# Ablago auf Synology (Container Manager) – Vorlage aus https://github.com/motom001/dms (deploy/synology)
# Anleitung: https://help.ablago.app/installieren/aktuell/synology/
#
# Nur eine Stelle ändern: das Passwort in der nächsten Zeile. Ein langes aus Buchstaben und
# Zahlen genügt. Es schützt die Datenbank und steht danach nur noch in dieser Datei.
x-passwort: &passwort "HIER-EIN-LANGES-PASSWORT-EINTRAGEN"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: *passwort
    volumes:
      - /volume1/docker/dms/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/motom001/dms:stabil
    restart: unless-stopped
    # Ohne Administratorrechte (#1354): Ablago läuft als eigener Benutzer (Vorgabe 1000:1000) und kann keine Rechte
    # zurückgewinnen. Sollen die Ordner einem Benutzer des NAS gehören, PUID und PGID unter environment setzen
    # (die Zahlen zeigt „id <benutzer>“), z. B. PUID: "1026" und PGID: "100".
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dasselbe Passwort für Ablago – der Einrichtungsassistent überspringt dann den Datenbankschritt.
      DMS_DB_PASSWORT: *passwort
      # Reverse-Proxy von DSM (läuft auf dem NAS selbst, kommt über das Gateway des Docker-Netzes): nach der
      # Einrichtung die Adresse eintragen, die die Werkbank nennt, und die Raute entfernen (#1355).
      # TRUST_PROXY: "172.18.0.1"
    volumes:
      # Hochgeladene Dateien
      - /volume1/docker/dms/files:/data/files
      # Schlüssel und Einrichtungscode – getrennt von den Sicherungen aufbewahren
      - /volume1/docker/dms/geheim:/data/geheim
      # Sicherungen (Werkbank → Sicherung) – ab und zu an einen anderen Ort kopieren
      - /volume1/docker/dms/sicherung:/data/sicherung
      # Exporte (optional, #797): Vollexport, „Meine Daten exportieren“, Auskünfte – unverschlüsselt.
      # Ohne diese Zeile liegen sie im Container; nach dem Herunterladen bzw. nach 7 Tagen sind sie ohnehin weg.
      # Mit eigenem Ort (z. B. für große Exporte zum Kopieren) nie in den Sicherungsordner legen.
      # - /volume1/docker/dms/export:/data/export
      # Eingangsordner (optional): Scanner und NAS legen hier Dateien ab → neue Post
      - /volume1/docker/dms/eingang:/eingang
    ports:
      - "8080:3000"
