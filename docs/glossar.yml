# Glossar von Ablago (#276) – die eine Quelle für alle Begriffe.
#
# Daraus entsteht die Seite „Begriffe“ im Benutzerhandbuch:
#     python3 docs/handbuch/werkzeuge/glossar.py
#
# Je Begriff:
#   begriff          So heißt es in Oberfläche, Handbüchern, Hilfetexten, Meldungen und Release-Notizen.
#   bereich          grundbegriffe | ablage | werkbank | betrieb
#   beschreibung     Was gemeint ist (Grundlage für spätere Übersetzungen – nicht nur das Wort).
#   einsteiger       Einstufung für die Einsteiger-Familie (Persona Lena, Stufe 1):
#                      alltag    = versteht sie sofort
#                      erklaeren = geht, wenn die Oberfläche kurz erklärt
#                      fachwort  = verstehen Einsteiger nicht; nur mit Erklärung oder im Expertenmodus
#   begegnet         Wer dem Begriff begegnet: alle | admin (Werkbank) | fortgeschritten (Expertenmodus, Technik)
#   nicht_verwenden  Wörter, die wir dafür nicht schreiben (optional)
#   verwandt         Verwandte Begriffe (optional)
#   code             Bezeichner im Code (optional)
#   profile          Abweichendes Wort je Sprachprofil, z. B. organisation: … (optional, siehe usability-grundsaetze 2.8).
#                    Sprachprofile sind geplant; die Seite „Begriffe“ kennzeichnet sie so.
#   konflikt         Nummern offener Konflikte unten (optional)
#
# Neue Begriffe kommen mit dem Release hierher (Qualitätskontrolle).
# Die Personas: docs/handbuch/entwickler/docs/personas.md

stand: '2026-11-10'

begriffe:

  # ---------- Grundbegriffe ----------
  - begriff: Ablago
    bereich: grundbegriffe
    beschreibung: Der Name des Programms – eine Dokumentenablage für zu Hause und kleine Betriebe. Ein Wort, nur das A groß. Ist die Programmart gemeint, heißt es weiter „DMS“ (Dokumentenmanagementsystem).
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Ablago DMS, ABLAGO, „das DMS“ für das eigene Programm]
    verwandt: [Ablage, Werkbank]
  - begriff: Ablage
    bereich: grundbegriffe
    beschreibung: Der Arbeitsbereich für alle Benutzer – mit Ansichten, Listen und Mappen. Zugleich das Wort für die ganze Installation, zu Hause wie im Betrieb („Name deiner Ablage“, „Ablage-Id“); eine Installation ist eine Ablage.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Haushalt (für die Installation), Mandant (in der Oberfläche)]
    code: mandant, haushalt_id
    verwandt: [Werkbank, Ansicht]
  - begriff: Werkbank
    bereich: grundbegriffe
    beschreibung: Der Arbeitsbereich der Administratoren. Hier werden Mappentypen, Ansichten, Benutzer und Einstellungen gepflegt und Ablago betrieben.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Ablage, Administrator, Werkbank anpassen]
  - begriff: Mein Konto
    bereich: grundbegriffe
    beschreibung: Die persönlichen Einstellungen des angemeldeten Benutzers – ein Klick oben rechts auf den eigenen Namen, dann „Mein Konto“. Wege beschreiben wir so, wie man klickt, z. B. „Mein Konto → Sicherheit → API-Schlüssel“.
    nicht_verwenden: [Profil]
    einsteiger: alltag
    begegnet: alle
  - begriff: Mappe
    bereich: grundbegriffe
    beschreibung: Die Grundeinheit von Ablago, wie eine Pappmappe im Regal. Sie fasst Angaben, Dokumente und Verweise zu einem Ding zusammen, z. B. zu einem Vertrag, einer Rechnung oder einem Vertragspartner.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Akte, Ordner, Datensatz]
    verwandt: [Mappentyp, Register, Dokument]
    code: Mappe
  - begriff: Mappentyp
    bereich: grundbegriffe
    beschreibung: Der Bauplan einer Mappe – welche Felder und Register sie hat, wie ihr Titel entsteht und wer was darf.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Typ (allein), Vorlage, Klasse]
    verwandt: [Mappe, Feld, Systemmappentyp]
    code: Mappentyp
  - begriff: Systemmappentyp
    bereich: grundbegriffe
    beschreibung: Ein Mappentyp, den Ablago selbst mitbringt – Benutzer, Rolle und Post.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Mappentyp]
    code: Systemtyp
  - begriff: Feld
    bereich: grundbegriffe
    beschreibung: Eine Angabe in einer Mappe, z. B. die Vertragsnummer. Jedes Feld hat eine Feldart – Text, Langtext, Formatierter Text, Zahl, Betrag, Datum, Ja/Nein, Auswahlliste, Verweis, Passwort, Zeitraum oder Prozent.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Feldart, Pflichtfeld, Standardwert]
    code: Feld
  - begriff: Feldart
    bereich: grundbegriffe
    beschreibung: Welche Art von Angabe ein Feld aufnimmt, z. B. Datum oder Betrag. Die Oberfläche schreibt „Feldart“.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Feldtyp, Datentyp, Art (allein)]
    code: Feldtyp, FELDTYPEN, Feld.typ
  - begriff: Format
    bereich: grundbegriffe
    beschreibung: Was in einem Textfeld stehen darf – E-Mail, Telefon, Internetseite, IBAN oder PLZ. Neue und geänderte Angaben müssen passen, am Handy erscheint die passende Tastatur, E-Mail und Telefon lassen sich antippen. Gespeicherte Angaben bleiben gültig. Datumsfelder haben stattdessen Grenzen (frühestens, spätestens, auch „heute“).
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Validierung, Datentyp]
    verwandt: [Feld, Feldart]
    code: Feld.format, Feld.landFeld, FELDFORMATE, shared/src/feldformate.ts
  - begriff: Zeitraum
    bereich: grundbegriffe
    beschreibung: Feldart für eine Dauer aus ganzer Zahl und Einheit – Tage, Wochen, Monate oder Jahre, z. B. die Kündigungsfrist „3 Monate“ oder die Laufzeit „1 Jahr“. Sortiert und verglichen wird nach der Länge. Nicht zu verwechseln mit „im Zeitraum“ bei Datumsbedingungen (Jahr, Monat).
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Dauer (als Feldart), Periode, Intervall]
    verwandt: [Feldart, Frist]
    code: zeitraum, Zeitraum, shared/src/feldarten.ts
  - begriff: Prozent
    bereich: grundbegriffe
    beschreibung: Feldart für einen Prozentsatz, z. B. den Steuersatz „19 %“ – mit Nachkommastellen, frei wählbar (auch ausländische Sätze). „19“, „19 %“ und „19,0“ bedeuten dasselbe.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Feldart]
    code: prozent, shared/src/feldarten.ts
  - begriff: Gutschrift
    bereich: ablage
    beschreibung: Ein Betrag, den man zurückbekommt (auch Erstattung) – in Ablago ein Betrag mit Minus, z. B. „−25,00 €“. Das geht nur bei Betragsfeldern, an denen der Administrator „Negative Beträge erlauben“ angehakt hat; dort steht der Hinweis „Mit Minus eintragen“.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Feld]
    code: Feld.negativ
  - begriff: Kennung
    bereich: grundbegriffe
    beschreibung: Der feste, technische Name eines Felds, Registers, Mappentyps oder Nummernkreises, z. B. vertragsnummer (bis 60 Zeichen). Nach dem Speichern bleibt er gleich, damit gespeicherte Werte, Links und Pakete passen. Mappentypen aus Paketen haben die Kennung Paket:Kennung, z. B. basis:person (#1084); eigene Mappentypen eine ohne Doppelpunkt.
    einsteiger: fachwort
    begegnet: admin
    nicht_verwenden: [Schlüssel (für Felder), Key]
    code: key, schluessel
  - begriff: Pflichtfeld
    bereich: grundbegriffe
    beschreibung: Ein Feld, das ausgefüllt sein muss, bevor die Mappe gespeichert werden kann.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Eindeutig]
  - begriff: Eindeutig
    bereich: grundbegriffe
    beschreibung: Ein Feldwert, der in diesem Mappentyp nur einmal vorkommen darf, z. B. eine Rechnungsnummer.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Standardwert
    bereich: grundbegriffe
    beschreibung: Die Vorbelegung eines Feldes beim Anlegen einer Mappe, auch mit Platzhaltern wie einem Nummernkreis.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Defaultwert]
  - begriff: Register
    bereich: grundbegriffe
    beschreibung: Ein Trennblatt in einer Mappe, z. B. Allgemein (mit Feldern), Dokumente, Verknüpfungen oder Historie. Notizen und Historie sind feste Register jeder Mappe.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Tab, Reiter]
    code: Register
  - begriff: Dokument
    bereich: grundbegriffe
    beschreibung: Eine Datei, die in Ablago in einem Dokumentenregister einer Mappe liegt. Hochgeladen wird eine Datei; in Ablago ist sie ein Dokument. An einer E-Mail heißt sie Anhang.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Version]
    code: Dokument
  - begriff: Version
    bereich: grundbegriffe
    beschreibung: Ein Dokument kann mehrere Versionen haben. Beim Ersetzen entsteht eine neue Version, die älteren bleiben darunter und lassen sich zurückholen. Nur in Registern mit Versionierung. Nicht zu verwechseln mit der Version von Ablago.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Revision, Stand (für Dokumente)]
    verwandt: [Dokument, Archivmodus, Version von Ablago]
    code: DokumentVersion
  - begriff: Verweis
    bereich: grundbegriffe
    beschreibung: Ein Feld, das auf andere Mappen zeigt, z. B. von einer Rechnung auf den Vertrag. Es kann auf Mappen eines oder mehrerer Mappentypen zeigen (z. B. „betrifft“ auf Fahrzeug, Wohnung oder Vertrag).
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Referenz, Link, Relation]
    verwandt: [Verknüpfungen, Verweisart, Zieltyp]
    code: referenz, Feld.zielTypen
  - begriff: Zieltyp
    bereich: grundbegriffe
    beschreibung: Ein Mappentyp, auf dessen Mappen ein Verweis zeigen darf; ein Verweis hat einen oder mehrere. Mit „alle vom selben Typ“ bleiben mehrere gewählte Mappen beim Typ der ersten. Aus Paketen gibt es auch optionale Zieltypen – Typen eines anderen Pakets, die Ablago aufnimmt, sobald es installiert ist.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Zielklasse, Referenztyp]
    verwandt: [Verweis, Mappentyp]
    code: Feld.zielTypen, Feld.gleicherTyp, Feld.zielOptional, zielOptional (Paket)
  - begriff: Verknüpfungen
    bereich: grundbegriffe
    beschreibung: Das Register, das alle Mappen zeigt, die auf diese Mappe verweisen – die Gegenrichtung des Verweises.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Verweis]
  - begriff: Verweisart
    bereich: grundbegriffe
    beschreibung: Ob ein Verweis eine Zugehörigkeit ist („gehört zu“, z. B. eine Rechnung zum Vertrag) oder nur ein Bezug (z. B. der Aussteller). Die Mappe zeigt die Art am Verweis und in den Verknüpfungen.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Verweis]
    code: Verweisart, VERWEISARTEN
  - begriff: Titel
    bereich: grundbegriffe
    beschreibung: Der Anzeigename einer Mappe. Er wird aus einer Vorlage mit Feldwerten gebildet.
    einsteiger: alltag
    begegnet: alle
  - begriff: Filter (Titel)
    bereich: grundbegriffe
    beschreibung: Formatiert einen Platzhalter in der Titel-Vorlage, z. B. nur das Jahr eines Datums oder gekürzter Text. Steht hinter einem senkrechten Strich, z. B. {datum|jahr}.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Titel]
  - begriff: Ansicht
    bereich: grundbegriffe
    beschreibung: Eine gespeicherte Auswahl von Mappen – welche Mappentypen, mit welchen Bedingungen. Ansichten stehen im Baum links in der Ablage. Wie etwas aussieht, heißt dagegen „Darstellung“.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Sicht, Filter, View]
    verwandt: [Unteransicht, Bedingung, Trefferliste]
    code: Sicht
  - begriff: Unteransicht
    bereich: grundbegriffe
    beschreibung: Eine Ansicht unterhalb einer anderen. Sie erbt deren Berechtigungen.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Untersicht]
  - begriff: Trefferliste
    bereich: grundbegriffe
    beschreibung: Legt fest, welche Spalten eine Liste zeigt. Ein Mappentyp hat eine oder mehrere Trefferlisten; eine davon ist der Standard. Eine Ansicht oder ein Verknüpfungsregister wählt eine davon, sonst gilt der Standard. Zeigt eine Ansicht mehrere Mappentypen, stehen nur Trefferlisten mit gleicher Kennung in allen zur Wahl, mit den gemeinsamen Spalten.
    einsteiger: fachwort
    begegnet: admin
    code: Trefferliste
  - begriff: Bedingung
    bereich: grundbegriffe
    beschreibung: Ein Filter einer Ansicht auf Feldwerte, Anzahlen, Fristen, Persönliches oder das Merkmal der Ablage, z. B. ein Feld gleich „aktueller Benutzer“, „ist mein Favorit“ oder „Ablage wird beruflich genutzt“.
    einsteiger: erklaeren
    begegnet: admin
    code: Bedingung
  - begriff: Anzeigen, wenn …
    bereich: grundbegriffe
    beschreibung: Einstellung an einem Feld oder Abschnitt eines Mappentyps – die Mappe zeigt es nur, wenn die Bedingungen zutreffen, z. B. Abschnitt „Miete“ nur bei Vertragsart Miete. Ein ausgeblendeter Abschnitt blendet alle Felder bis zum nächsten Abschnitt aus. Ausblenden ist Ordnung, kein Schutz – Werte bleiben gespeichert und stehen in Schnittstelle, Export und Auskunft; Pflicht ist ein Feld nur, solange es zu sehen ist.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Sichtbarkeitsregel, bedingtes Feld]
    verwandt: [Bedingung, Beruflich genutzt, Mappentyp]
    code: anzeigen (Anzeigeregel)
  - begriff: Beruflich genutzt
    bereich: grundbegriffe
    beschreibung: Das eine Merkmal der Ablage – die Ablage wird auch beruflich genutzt (Selbständige, Verein, Betrieb). Vorgabe nein. Mappentypen zeigen damit ihre beruflichen Felder und Abschnitte; Rechte, Ansichten und Automatisierungen können darauf schauen. Gilt für die ganze Ablage, nicht je Person; einstellen in Werkbank → Nutzung.
    einsteiger: alltag
    begegnet: admin
    verwandt: ["Anzeigen, wenn …", Bedingung]
    code: merkmale.beruflich
  - begriff: Favoriten
    bereich: grundbegriffe
    beschreibung: Mappen, die ein Benutzer mit dem Stern markiert hat. Die Ansicht „Favoriten“ zeigt sie. Ein Favorit ist zugleich ein Abo – ändern andere die Mappe, gibt es eine gebündelte Benachrichtigung „Geändert“ (je Favorit abschaltbar).
    einsteiger: alltag
    begegnet: alle
  - begriff: Archivnummer
    bereich: grundbegriffe
    beschreibung: Nummer auf einem Aufkleber am Papieroriginal (z. B. A-000123), dieselbe steht am Dokument in Ablago. Eindeutig je Ablage; kommt aus dem Nummernkreis „Archivnummer“. Verbindet Papier und Dokument in beide Richtungen.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Ablageort, Nummernkreis, Dokument]
    code: archivnummer
  - begriff: Ablageort
    bereich: grundbegriffe
    beschreibung: Ein Platz, an dem Papier liegt – z. B. ein Ordner, eine Kiste, ein Schließfach oder „vernichtet“. Ablageorte liegen ineinander („zu Hause › Arbeitszimmer Schrank › roter Ordner“). Den Mappentyp bringt das Paket Basis mit.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Verbleib Originaldokumente, Mappentyp]
    code: basis:ablageort
  - begriff: Verbleib Originaldokumente
    bereich: grundbegriffe
    beschreibung: Das Feld an einer Mappe, das auf den Ablageort des Papiers zeigt. In allen Mappentypen mit derselben Kennung, damit gemeinsame Listen und Ansichten funktionieren.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Lagerort, Standort (für Papier)]
    verwandt: [Ablageort]
    code: verbleib_original
  - begriff: Papierkorb
    bereich: grundbegriffe
    beschreibung: Gelöschte Mappen. Sie lassen sich wiederherstellen, bis die eingestellte Zahl an Tagen abgelaufen ist.
    einsteiger: alltag
    begegnet: alle

  # ---------- Arbeiten in der Ablage ----------
  - begriff: Post
    bereich: ablage
    beschreibung: Alles, was in Ablago kommt oder hinausgeht – Scan, Upload, E-Mail. Post ist ein Systemmappentyp mit Kanal, Richtung und Stand.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Posteingang, Inbox]
    verwandt: [Neue Post, Zuordnen, Kanal, Richtung (Post), Stand (Post)]
  - begriff: Neue Post
    bereich: ablage
    beschreibung: Die Ansicht mit Post, die noch nicht zugeordnet oder erledigt ist. Wer Post zugewiesen bekommt, hat zusätzlich die Aufgabe „Post für dich“.
    einsteiger: alltag
    begegnet: alle
  - begriff: Zuordnen
    bereich: ablage
    beschreibung: Post einer vorhandenen oder neuen Mappe zuweisen. Die Dokumente wandern dabei in das Register der Mappe.
    einsteiger: alltag
    begegnet: alle
  - begriff: Kanal
    bereich: ablage
    beschreibung: Wie Post in Ablago kam oder hinausging. Ablago setzt Hochgeladen, E-Mail, Ordner (Eingangsordner) und API selbst; Scan, Import und WebDAV lassen sich in der Liste von Hand wählen.
    einsteiger: fachwort
    begegnet: alle
  - begriff: Richtung (Post)
    bereich: ablage
    beschreibung: Ob Post eingehend oder ausgehend ist. Mit „Per E-Mail versenden“ entsteht ausgehende Post.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Post]
  - begriff: Stand (Post)
    bereich: ablage
    beschreibung: Wie weit Post bearbeitet ist – Neu (noch nicht bearbeitet), Zugeordnet (liegt bei einer passenden Mappe) oder Erledigt (nichts mehr zu tun).
    einsteiger: alltag
    begegnet: alle
    verwandt: [Post, Neue Post]
  - begriff: Zu erledigen
    bereich: ablage
    beschreibung: Die oberste Ansicht – als Liste die Mappen, an denen ich etwas tun soll (meine offenen Aufgaben), als Monat und Jahr meine Termine im Kalender.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Eingang, Inbox, Posteingang, Anstehend]
    verwandt: [Aufgabe, Frist]
    code: eingang
  - begriff: Aufgabe
    bereich: ablage
    beschreibung: Etwas, das ein Mensch an einer Mappe tun soll. Arten sind Passt nicht, Erwähnung, Zugewiesen (von Hand vergeben), Post für dich, Frist, Erinnerung, Vertretung und Auskunft.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Auftrag, Task, Todo]
    verwandt: [Zu erledigen, Frist, Erinnerung, Auftrag]
    code: Aufgabe, AUFGABENARTEN
  - begriff: Erwähnung
    bereich: ablage
    beschreibung: Die Nennung eines Benutzers mit @ in formatiertem Text. Sie erzeugt für ihn eine Aufgabe.
    einsteiger: alltag
    begegnet: alle
  - begriff: Frist
    bereich: ablage
    beschreibung: Eine Aufgabe, die aus einem Datumsfeld mit Vorlauf entsteht, z. B. „Kündigen bis …“.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Erinnerung, Zu erledigen]
  - begriff: Erinnerung
    bereich: ablage
    beschreibung: Eine von Hand gesetzte Aufgabe für einen bestimmten Tag (Mappe ▾ → Erinnern).
    einsteiger: alltag
    begegnet: alle
    code: Erinnerung
  - begriff: Weitergeben
    bereich: ablage
    beschreibung: Eine Aufgabe einem anderen Benutzer übertragen.
    einsteiger: alltag
    begegnet: alle
  - begriff: Abwesenheit
    bereich: ablage
    beschreibung: Ein Zeitraum, in dem ein Benutzer nicht da ist – mit einem Vertreter, der seine Aufgaben übernimmt.
    einsteiger: alltag
    begegnet: alle
    code: Abwesenheit
  - begriff: Vertretung
    bereich: ablage
    beschreibung: Ein Benutzer übernimmt während einer Abwesenheit die Aufgaben eines anderen. Der Vertreter bekommt dazu eine Aufgabe der Art „Vertretung“.
    einsteiger: alltag
    begegnet: alle
    code: Abwesenheit.vertreterId, vertretung (Aufgabenart)
  - begriff: Notiz
    bereich: ablage
    beschreibung: Ein Kommentar an einer Mappe.
    einsteiger: alltag
    begegnet: alle
    code: Notiz
  - begriff: Formatierter Text
    bereich: ablage
    beschreibung: Text mit Überschriften, Listen und Hervorhebungen (Markdown) – als Feldart und in Notizen.
    einsteiger: erklaeren
    begegnet: alle
  - begriff: Historie
    bereich: ablage
    beschreibung: Die Geschichte einer Mappe – Änderungen vorher und nachher, Dokumente, Papierkorb, Notizen, Aufgaben. Das technische Betriebsprotokoll heißt dagegen „Protokoll“.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Protokoll (an der Mappe), Verlauf]
    code: Historieneintrag
  - begriff: Volltext
    bereich: ablage
    beschreibung: Der durchsuchbare Text in den Dokumenten – aus der Textebene der Datei oder aus der Texterkennung.
    einsteiger: fachwort
    begegnet: alle
    verwandt: [Texterkennung, Erweiterte Suche]
  - begriff: Vorschaubild
    bereich: ablage
    beschreibung: Kleines Bild der ersten Seite neben einem PDF oder Bild in der Dokumentliste; entsteht im Hintergrund und wird nicht gesichert.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Dokument]
    nicht_verwenden: [Thumbnail, Miniatur]
    code: vorschau
  - begriff: Erweiterte Suche
    bereich: ablage
    beschreibung: Ein Suchformular über die Felder mehrerer Mappentypen und den Text in Dokumenten.
    einsteiger: alltag
    begegnet: alle
    code: Suchformular
  - begriff: Link
    bereich: ablage
    beschreibung: Eine Adresse auf eine Ansicht oder Mappe, z. B. über „Link kopieren“ – auch lesbar über Mappentyp und Feldwerte. „Link“ steht nur für Adressen; Felder, die auf Mappen zeigen, heißen Verweis.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Direktlink, sprechender Link]
    code: Direktlink
  - begriff: Export
    bereich: ablage
    beschreibung: Ausgewählte Mappen einer Ansicht als Excel, CSV, ZIP oder PDF herunterladen.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Vollexport, Meine Daten exportieren, Sicherung]
  - begriff: Aktionen
    bereich: ablage
    beschreibung: Das Menü „Mappe ▾“ neben dem Titel einer Mappe – Aufgabe vergeben, Erinnern, Versenden, Exportieren und mehr. Hieß früher selbst „Aktionen“.
    einsteiger: alltag
    begegnet: alle

  - begriff: Archivfassung
    bereich: ablage
    beschreibung: 'Ein durchsuchbares PDF/A, das ein Paket wie PDF/A zusätzlich zu einem Dokument ablegt – ein Format, das sich auch in vielen Jahren und ohne Ablago noch öffnen lässt. Das Original bleibt unverändert. Gibt es eine, zeigt Ablago sie an („Ansicht: Archivfassung (PDF/A)“). Auch PDFs, Scans, Fotos und E-Mails (.eml, .msg) bekommen eine; eine E-Mail liest man darin wie einen Brief.'
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Archivkopie, Langzeitfassung]
    verwandt: [Dokument, Version]
    code: Archivfassung
  # ---------- Verwaltung (Werkbank) ----------
  - begriff: Benutzer
    bereich: werkbank
    beschreibung: Ein Konto, mit dem sich jemand anmeldet. Liegt als Systemmappe in Ablago. Personen und Firmen, mit denen man zu tun hat (Kontakte), sind keine Benutzer, sondern gewöhnliche Mappen vom Mappentyp „Person“ bzw. „Organisation“ aus dem Paket Basis.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [User, Account]
    code: Benutzer
  - begriff: Person
    bereich: grundbegriffe
    beschreibung: Ein Mensch, mit dem man zu tun hat – Ansprechpartnerin, Arzt, Vermieter, Verwandte. Mappentyp aus dem Paket Basis (ab 1.1.0). Eine Person ist **kein Benutzer** und kann sich nicht anmelden.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Benutzer, Organisation, Niederlassung]
    nicht_verwenden: [Kontakt (als Mappentyp), Benutzer (für Kontakte)]
    code: basis:person
  - begriff: Organisation
    bereich: grundbegriffe
    beschreibung: Firma, Behörde, Bank, Praxis, Verein oder andere Stelle, mit der man zu tun hat. Mappentyp aus dem Paket Basis; andere Pakete verweisen darauf (Vertragspartner, Versicherer, Bank …).
    einsteiger: alltag
    begegnet: alle
    verwandt: [Niederlassung, Person]
    code: basis:organisation
  - begriff: Niederlassung
    bereich: grundbegriffe
    beschreibung: Filiale, Zweigstelle, Praxis oder Außenstelle einer Organisation – mit eigener Anschrift und eigenem Telefon. Mappentyp aus dem Paket Basis (ab 1.1.0); gehört zu genau einer Organisation.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Organisation, Person]
    nicht_verwenden: [Standort (verwechselbar mit Ablageort), Filiale (als Mappentyp – ist eine der Arten)]
    code: basis:niederlassung
  - begriff: Kann aus Post angelegt werden
    bereich: werkbank
    beschreibung: Haken in den Grunddaten eines Mappentyps (#937). Nur Mappentypen damit stehen beim Übernehmen eines Dokuments aus der Post unter „Wohin gehört das?“ zur Wahl – für alle, die dort Mappen anlegen dürfen. Vorgabe an bei Mappentypen mit Dokumentenregister; Systemmappentypen nie.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Mappentyp, Post, Woran man ihn erkennt]
    code: Mappentyp.ausPost
  - begriff: Woran man ihn erkennt
    bereich: werkbank
    beschreibung: Kurzer Satz in den Grunddaten eines Mappentyps (#937, höchstens 300 Zeichen), z. B. „Enthält Rechnungsnummer, Betrag und Zahlungsziel“. Hilft der Erkennung, ein Dokument dem richtigen Mappentyp zuzuordnen. Die Beschreibung ist für Menschen, dieser Satz für die Erkennung.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Kann aus Post angelegt werden]
    code: Mappentyp.erkennbarAn
  - begriff: Aus Dokument füllen
    bereich: werkbank
    beschreibung: Haken an einem Feld (#938, früher „Für die Erkennung nutzen“) – der Knopf „Aus Dokument ausfüllen“ darf dieses Feld aus einem Foto oder Dokument als Vorschlag füllen. Mit Art („Was steht im Feld?“) und Erkennungshinweis.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Für die Erkennung nutzen (alter Name)]
    verwandt: [Zum Wiederfinden nutzen]
    code: Feld.erkennung
  - begriff: Zum Wiederfinden nutzen
    bereich: werkbank
    beschreibung: Haken an einem Feld (#938) – über diesen Wert findet Ablago vorhandene Mappen in einem Dokument wieder, z. B. Kundennummer, Vertragsnummer, Rechnungsnummer oder Kennzeichen. Daraus entstehen Vorschläge mit Belegen („Woran Ablago das erkennt“) und die Warnung, wenn es eine Mappe schon gibt. Unabhängig von „Eindeutig“.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Aus Dokument füllen]
    code: Feld.wiederfinden
  - begriff: Administrator
    bereich: werkbank
    beschreibung: Ein Benutzer mit Zugang zur Werkbank. Für ihn gelten keine Einschränkungen durch Berechtigungen.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Admin (in der Oberfläche)]
  - begriff: Rolle
    bereich: werkbank
    beschreibung: Eine Gruppe von Benutzern, z. B. „Eltern“. Grundlage für Berechtigungsregeln. Nicht zu verwechseln mit der Systemrolle.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Gruppe, Weitere Rollen]
    verwandt: [Systemrolle]
    code: rolle (Systemtyp), Benutzer.rollen
  - begriff: Systemrolle
    bereich: werkbank
    beschreibung: Ob ein Benutzer Administrator oder Mitglied ist. Nur Administratoren kommen in die Werkbank.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Rolle (für Administrator/Mitglied)]
    verwandt: [Rolle, Administrator]
    code: Rolle, Benutzer.rolle
  - begriff: Berechtigungen
    bereich: werkbank
    beschreibung: Wer was darf. Am Mappentyp – Anlegen, Lesen, Bearbeiten, Löschen, Passwörter sehen – mit einem Standard plus Regeln; an der Ansicht – Sehen, Anlegen, Exportieren – mit Vererbung an die Unteransichten. Für Administratoren gelten sie nicht.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Permissions]
    code: Rechte
  - begriff: Regel
    bereich: werkbank
    beschreibung: Ein Wenn-dann-Baustein der Berechtigungen – Bedingung, dann Recht erteilen oder entziehen, auf Wunsch mit Stopp.
    einsteiger: erklaeren
    begegnet: admin
    code: Regel
  - begriff: Testlauf
    bereich: werkbank
    beschreibung: Prüft, welche Rechte ein bestimmter Benutzer am Ende hat.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Probelauf
    bereich: werkbank
    beschreibung: Eine Automatisierung mit einer gewählten Mappe ausprobieren, ohne dass etwas geändert oder jemand benachrichtigt wird – Ablago zeigt nur, was passieren würde.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Trockenlauf, trocken]
    verwandt: [Testlauf]
    code: trocken
  - begriff: Nummernkreis
    bereich: werkbank
    beschreibung: Fortlaufende Nummern nach einem Muster wie {jjjj}-R{zaehler:4} (ergibt z. B. 2026-R0001), etwa für Rechnungsnummern.
    einsteiger: fachwort
    begegnet: admin
    code: Nummernkreis
  - begriff: Design
    bereich: werkbank
    beschreibung: Wie die Oberfläche aussieht – Logo, Schriftzug, Farben (hell, dunkel, hoher Kontrast oder nach Gerät) und eigenes CSS. Administratoren legen Designs unter Werkbank → Designs an und bestimmen den Standard; jeder Benutzer wählt seines unter Mein Konto unter „Darstellung“.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Theme]
    verwandt: [Darstellung]
  - begriff: Darstellung
    bereich: grundbegriffe
    beschreibung: Der Bereich unter Mein Konto, in dem jeder einstellt, wie Ablago für ihn aussieht – das Design (für sein Konto), die Schriftgröße und die Breite der Bereiche (je Gerät).
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Theme, Ansicht (für das Aussehen)]
    verwandt: [Design, Mein Konto]
  - begriff: Ablago entdecken
    bereich: grundbegriffe
    beschreibung: Seite im Benutzermenü (bei der Hilfe) mit allem, was Ablago noch kann – Neues seit dem letzten Besuch, Rundgänge und alle Tipps nach Bereich. Ausgeblendete Tipps bleiben dort sichtbar.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Rundgang, Tipp]
  - begriff: Rundgang
    bereich: grundbegriffe
    beschreibung: Kurze Führung an der echten Oberfläche in wenigen Schritten, jeder Schritt hebt eine Stelle hervor. Ablagos eigener Rundgang startet bei der ersten Anmeldung eines neuen Kontos; alle finden ihn unter „Ablago entdecken“.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Tour, Onboarding, Tutorial]
    verwandt: [Tipp, Ablago entdecken]
    code: Rundgang, rundgaenge.yaml
  - begriff: Tipp
    bereich: grundbegriffe
    beschreibung: Ein Satz, der zeigt, was man in Ablago noch tun kann – höchstens einer am Tag als leise Zeile auf der Startseite; der Satz führt an die Stelle oder startet einen Rundgang. Mit × ausblenden, in Mein Konto ganz abschalten.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Hinweis (für Tipps), Hilfe-Tipp]
    verwandt: [Rundgang, Ablago entdecken]
    code: Tipp, tipps.yaml
  - begriff: Paket
    bereich: werkbank
    beschreibung: Ein installierbares Bündel aus Mappentypen, Ansichten und Beispielen aus einem Paketkatalog, z. B. „Basis“. Ein Update ergänzt nur; es entfernt und ändert nichts.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Plugin, Erweiterung, App, Modul]
    verwandt: [Paketkatalog, Expertenmodus, Paket-Läufer, Herausgeber]
    code: InstalliertesPaket
  - begriff: Herausgeber
    bereich: werkbank
    beschreibung: Wer ein Paket herausgibt, als umgedrehte Domain, z. B. app.ablago für die offiziellen Pakete (#1084). Steht neben dem Namen, z. B. „Verträge · app.ablago“. Ablago ersetzt ein installiertes Paket nie durch eines mit derselben Id von einem anderen Herausgeber.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Anbieter (für Pakete), Autor (ist die Person, die es geschrieben hat), Publisher]
    verwandt: [Paket, Paketkatalog]
    code: herausgeber, InstalliertesPaket.herausgeber
  - begriff: Paketkatalog
    bereich: werkbank
    beschreibung: Die Liste der Pakete, die ein DMS installieren kann (eine Datei katalog.json im Internet). Ablago fragt den offiziellen Katalog nur auf Knopfdruck ab („Katalog abrufen“). Weitere Kataloge trägt man im Expertenmodus unter „Weitere Quellen“ ein.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Paket, Expertenmodus]
    code: Katalog, OFFIZIELLER_KATALOG
  - begriff: Expertenmodus
    bereich: werkbank
    beschreibung: Ein aufklappbarer Abschnitt unter Werkbank → Pakete, direkt unter den Knöpfen. Aufgeklappt zeigt er „Weitere Quellen“ und „Paket hochladen“ – für Paketentwickler und Ablago ohne Internet. Zu Beginn zugeklappt; der Browser merkt sich je Benutzer, ob er offen ist.
    einsteiger: fachwort
    begegnet: fortgeschritten
    nicht_verwenden: [Erweiterte Ansicht]
    verwandt: [Paket, Paketkatalog]
    code: useExperteOffen
  - begriff: Paket-Läufer
    bereich: werkbank
    beschreibung: Der Teil von Ablago, der den Code von Paketen ausführt – abgeschottet in einem eigenen Prozess, mit Grenzen für Speicher und Zeit und nur mit den Rechten, die ein Administrator bei der Installation bestätigt hat. Netzwerk und Internet erreicht der Code nur unter den Adressen, die das Paket nennt – die Vorschau zeigt das als „kein Zugriff auf Netzwerk und Internet“ oder „Zugriff auf Netzwerk/Internet nur zu …“. Seinen Stand zeigt Werkbank → Pakete → Paket im Abschnitt „Paket-Läufer“.
    einsteiger: fachwort
    begegnet: fortgeschritten
    nicht_verwenden: [Code im Paket-Läufer, Plugin-Host]
    verwandt: [Paket, Dienstkonto]
    code: Paketlaeufer, PaketLaeufer
  - begriff: Dienstkonto
    bereich: werkbank
    beschreibung: Das Konto, mit dem ein Paket mit Code in Ablago arbeitet, z. B. „Paket Texterkennung“. Es meldet sich nie an, steht nicht unter Benutzer, löscht nie und hat nur die Rechte aus dem Paket. In der Historie steht es dort, wo das Paket etwas geändert hat.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Systembenutzer, Bot, technischer Benutzer]
    verwandt: [Paket-Läufer, Benutzer]
    code: "benutzer.art = 'dienst'"
  - begriff: Werkbank anpassen
    bereich: werkbank
    beschreibung: Legt fest, welche Bereiche links in der Werkbank stehen – nach einer Vorlage („Haushalt“, „Betrieb“ oder „Alles“) und mit Abweichungen. Ausblenden schaltet nichts ab. Neue Installationen starten mit „Haushalt“; Installationen von vor dieser Einstellung zeigen alles.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Werkbank, Übersicht, Betrieb]
    code: WerkbankAnsicht, VORLAGEN
  - begriff: Betrieb
    bereich: werkbank
    beschreibung: Die Vorlage unter „Werkbank anpassen“ für Selbständige und kleine Betriebe – mit Nummernkreisen, Archivmodus, Postfächern und weiteren Bereichen. Gegenstück ist die Vorlage „Haushalt“.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Organisation (für die Vorlage)]
    verwandt: [Werkbank anpassen, Haushalt]
    code: organisation (Vorlage)
  - begriff: Übersicht
    bereich: werkbank
    beschreibung: Die erste Seite der Werkbank – was in Ablago gerade zu tun ist, mit Hinweisen, Stand und Bestand.
    einsteiger: alltag
    begegnet: admin
    verwandt: [Werkbank]
  - begriff: Tägliche Zusammenfassung
    bereich: werkbank
    beschreibung: Eine E-Mail, die einmal am Tag die offenen Aufgaben eines Benutzers auflistet – nur, wenn er welche hat und nicht abwesend ist. Administratoren schalten sie unter Werkbank → Einstellungen → Benachrichtigungen und Aufgaben ein; Uhrzeit und Wochentage wählt jeder unter Mein Konto.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Übersicht per E-Mail, Digest]
    verwandt: [Aufgabe, Zu erledigen]
  - begriff: Region
    bereich: werkbank
    beschreibung: Wo die Ablage zu Hause ist – Land, Bundesland und Zeitzone (Werkbank → Einstellungen → Region). Danach richten sich die Feiertage, „heute“ bei Fristen und alle Uhrzeiten von Erinnerungen, Zeitplänen und der Täglichen Zusammenfassung.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Standort, Gebietsschema, Locale]
    verwandt: [Tägliche Zusammenfassung]
    code: region
  - begriff: Archivmodus
    bereich: werkbank
    beschreibung: Eine Einstellung je Mappentyp für Aufbewahrungspflichten – mit Versionen und einer Löschsperre bis zum Fristende.
    einsteiger: erklaeren
    begegnet: admin
    code: Archiv
  - begriff: Aufbewahrung abgelaufen
    bereich: werkbank
    beschreibung: Die Liste der Mappen, deren Aufbewahrungsfrist abgelaufen ist (Werkbank → Benutzer und Sicherheit). Früher „Darf weg“.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Darf weg]
  - begriff: Suche und Volltext
    bereich: werkbank
    beschreibung: Der Werkbank-Bereich unter Post und Eingänge für Texterkennung, Archivfassung, automatisches Verkleinern, Tippfehler und gleichbedeutende Wörter. Fasst die früheren Bereiche „Texterkennung“ und „Suche“ zusammen.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Postfach
    bereich: werkbank
    beschreibung: Ein angebundenes E-Mail-Konto (IMAP), aus dem Ablago Post abholt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Eingangsordner
    bereich: werkbank
    beschreibung: Ein Ordner, den Ablago beobachtet, z. B. für „Scan to Folder“. Jede Datei darin wird Post.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Texterkennung
    bereich: werkbank
    beschreibung: Erkennt Text in Bildern und gescannten PDFs, damit er durchsuchbar wird.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [OCR (in der Oberfläche)]
    code: OcrStand
  - begriff: Anmeldeschutz
    bereich: werkbank
    beschreibung: Sperre nach Fehlversuchen, gesperrte IP-Adressen, Vorgaben zur Zwei-Faktor-Anmeldung und die Anmeldung über einen Anbieter.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Zwei-Faktor-Anmeldung
    bereich: werkbank
    beschreibung: Ein zusätzlicher Code aus einer App bei der Anmeldung.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [2FA, MFA (in der Oberfläche)]
  - begriff: Anmeldung über einen Anbieter
    bereich: werkbank
    beschreibung: Anmelden mit einem fremden Konto, z. B. Microsoft 365 (OpenID Connect).
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [SSO, OIDC (in der Oberfläche)]
  - begriff: Fehler nachstellen
    bereich: werkbank
    beschreibung: Ein Administrator arbeitet vorübergehend unter dem Konto eines anderen Benutzers, um einen Fehler zu sehen. Zurück geht es mit „Zurück zum eigenen Konto“.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Impersonation, Vertretung beenden]
    code: Vertretung

  # ---------- Betrieb und Sicherheit ----------
  - begriff: Haushalt
    bereich: betrieb
    beschreibung: Die Vorlage unter „Werkbank anpassen“ für zu Hause – schlank, nur was eine Familie zum Einrichten und Sichern braucht. Für die ganze Installation heißt es seit 04.11.2026 neutral „Ablage“; „Mandant“ steht nur im Code.
    einsteiger: alltag
    begegnet: admin
    verwandt: [Betrieb, Werkbank anpassen, Ablage]
  - begriff: Einrichtungsassistent
    bereich: betrieb
    beschreibung: Die Schritte beim ersten Start von Ablago.
    einsteiger: alltag
    begegnet: admin
    verwandt: [Einrichtungscode]
  - begriff: Einrichtungscode
    bereich: betrieb
    beschreibung: Der Code aus dem Protokoll des Containers, der die Einrichtung freischaltet.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Schlüssel
    bereich: betrieb
    beschreibung: Der geheime Schlüssel, mit dem Passwortfelder und Sicherungen verschlüsselt sind. Er liegt nie in der Datenbank. Der feste Name eines Felds heißt dagegen Kennung.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Fingerabdruck, Notfallblatt]
  - begriff: Fingerabdruck
    bereich: betrieb
    beschreibung: Eine kurze Prüfkennung, an der man einen Schlüssel wiedererkennt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Notfallblatt
    bereich: betrieb
    beschreibung: Ein PDF mit dem Schlüssel und einer Anleitung zur Wiederherstellung.
    einsteiger: alltag
    begegnet: admin
  - begriff: Sicherung
    bereich: betrieb
    beschreibung: Eine verschlüsselte Gesamtsicherung, die sich in Ablago zurückspielen lässt. Kein Export – ohne Ablago nicht lesbar.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Backup (in der Oberfläche)]
    verwandt: [Wiederherstellen, Probe-Wiederherstellung, Vollexport]
  - begriff: Probe-Wiederherstellung
    bereich: betrieb
    beschreibung: Prüft eine Sicherung, ohne die echten Daten anzutasten.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Wiederherstellen
    bereich: betrieb
    beschreibung: Eine Sicherung in Ablago zurückspielen.
    einsteiger: alltag
    begegnet: admin
  - begriff: Vollexport
    bereich: betrieb
    beschreibung: Alle Daten in offenen Formaten, lesbar auch ohne Ablago – damit niemand an Ablago hängen bleibt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Meine Daten exportieren
    bereich: betrieb
    beschreibung: Ein Benutzer lädt unter Mein Konto seine eigenen Daten herunter.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Persönlicher Export]
  - begriff: Wartungsmodus
    bereich: betrieb
    beschreibung: Eine vorübergehende Sperre für Benutzer mit Ankündigung, z. B. während einer Wiederherstellung.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Wartungsoperationen
    bereich: betrieb
    beschreibung: Einmalige Pflegearbeiten, z. B. Nummern nachträglich vergeben.
    einsteiger: fachwort
    begegnet: admin
  - begriff: Protokoll
    bereich: betrieb
    beschreibung: Das laufende Betriebsprotokoll des Servers mit Modulen und Stufen (Werkbank → Protokoll). Die Geschichte einer Mappe heißt dagegen Historie.
    einsteiger: erklaeren
    begegnet: fortgeschritten
    verwandt: [Historie]
  - begriff: Debug-Modus
    bereich: betrieb
    beschreibung: Ein ausführlicheres technisches Protokoll für die Fehlersuche.
    einsteiger: fachwort
    begegnet: fortgeschritten
  - begriff: Gemeldete Fehler
    bereich: betrieb
    beschreibung: Fehler, die Benutzer über „Fehler melden“ eingereicht haben (Werkbank → Gemeldete Fehler).
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Fehlermeldungen]
  - begriff: Systemzustand
    bereich: betrieb
    beschreibung: Wie es dem Server gerade geht – Speicherplatz mit Warnschwellen und die Auslastung von CPU, Arbeitsspeicher und Netzwerk (Werkbank → Wartung und Fehlersuche → Systemzustand). Gemeint ist der Zustand im Betrieb, nicht die Konfiguration.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Systemumgebung]
    verwandt: [Speicherplatz]
  - begriff: Speicherplatz
    bereich: betrieb
    beschreibung: Wie voll die Datenordner sind, mit Schwellen für Warnungen (unter Systemzustand).
    einsteiger: alltag
    begegnet: admin
    verwandt: [Systemzustand]
  - begriff: Demo-Daten
    bereich: betrieb
    beschreibung: Erzeugte Beispielmappen zum Ausprobieren und für Lasttests.
    einsteiger: alltag
    begegnet: admin
  - begriff: API
    bereich: betrieb
    beschreibung: Die Schnittstelle, über die Programme mit Ablago arbeiten. Zugang mit einem persönlichen API-Schlüssel.
    einsteiger: fachwort
    begegnet: fortgeschritten
  - begriff: Version von Ablago
    bereich: betrieb
    beschreibung: Der Stand des Programms, z. B. 0.73. Ein Update bringt eine neue Version von Ablago; an Dokumenten und ihren Versionen ändert das nichts. Was neu ist, steht unter „Neu in dieser Version“.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Release (in der Oberfläche)]
    verwandt: [Version]
  - begriff: Konsole
