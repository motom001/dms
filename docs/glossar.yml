# Glossar des DMS (#276) – die eine Quelle für alle Begriffe.
#
# Daraus entsteht die Seite „Begriffe“ im Benutzerhandbuch:
#     python3 docs/handbuch/werkzeuge/glossar.py
#
# Je Begriff:
#   begriff          So heißt es in Oberfläche, Handbüchern, Hilfetexten, Meldungen und Release-Notizen.
#   bereich          grundbegriffe | ablage | werkbank | betrieb
#   beschreibung     Was gemeint ist (Grundlage für spätere Übersetzungen – nicht nur das Wort).
#   einsteiger       Einstufung aus Sicht der Einsteiger-Familie (Persona Lena, Stufe 1):
#                      alltag    = versteht sie sofort
#                      erklaeren = geht, wenn die Oberfläche kurz erklärt
#                      fachwort  = verstehen Einsteiger nicht; nur mit Erklärung oder im Expertenmodus
#   begegnet         Wer dem Begriff begegnet: alle | admin (Werkbank) | fortgeschritten (Expertenmodus, Technik)
#   nicht_verwenden  Wörter, die wir dafür nicht schreiben (optional)
#   verwandt         Verwandte Begriffe (optional)
#   code             Bezeichner im Code (optional)
#   profile          Abweichendes Wort je Sprachprofil, z. B. organisation: … (optional, siehe usability-grundsaetze 2.8)
#   konflikt         Nummern offener Konflikte unten (optional)
#
# Neue Begriffe kommen mit dem Release hierher (Qualitätskontrolle).
# Die Personas: docs/handbuch/entwickler/docs/personas.md

stand: '2026-10-31'

begriffe:

  # ---------- Grundbegriffe ----------
  - begriff: Ablage
    bereich: grundbegriffe
    beschreibung: Der Arbeitsbereich für alle Benutzer – mit Ansichten, Listen und Mappen.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Werkbank, Ansicht]
  - begriff: Werkbank
    bereich: grundbegriffe
    beschreibung: Der Arbeitsbereich der Administratoren. Hier werden Mappentypen, Ansichten, Benutzer und Einstellungen gepflegt und das DMS betrieben.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Ablage, Administrator]
  - begriff: Profil
    bereich: grundbegriffe
    beschreibung: Die persönlichen Einstellungen des angemeldeten Benutzers, erreichbar über das Benutzermenü.
    einsteiger: alltag
    begegnet: alle
  - begriff: Mappe
    bereich: grundbegriffe
    beschreibung: Die Grundeinheit des DMS, wie eine Pappmappe im Regal. Sie fasst Angaben, Dokumente und Verweise zu einem Ding zusammen, z. B. zu einem Vertrag, einer Rechnung oder einem Vertragspartner.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Akte, Ordner, Datensatz]
    verwandt: [Mappentyp, Register, Dokument]
    code: Mappe
  - begriff: Mappentyp
    bereich: grundbegriffe
    beschreibung: Der Bauplan einer Mappe – welche Felder und Register sie hat, wie ihr Titel entsteht und wer was darf.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Typ (allein), Vorlage, Klasse]
    verwandt: [Mappe, Feld, Systemmappentyp]
    code: Mappentyp
  - begriff: Systemmappentyp
    bereich: grundbegriffe
    beschreibung: Ein Mappentyp, den das DMS selbst mitbringt – Benutzer, Rolle und Post.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Mappentyp]
    code: Systemtyp
  - begriff: Feld
    bereich: grundbegriffe
    beschreibung: Eine Angabe in einer Mappe, z. B. die Vertragsnummer. Jedes Feld hat eine Feldart wie Text, Zahl, Datum, Betrag, Auswahl, Verweis, Passwort oder formatierter Text.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Feldart, Pflichtfeld, Standardwert]
    code: Feld
  - begriff: Feldart
    bereich: grundbegriffe
    beschreibung: Welche Art von Angabe ein Feld aufnimmt, z. B. Datum oder Betrag.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Feldtyp, Datentyp, Art (allein)]
    code: Feldart
  - begriff: Kennung
    bereich: grundbegriffe
    beschreibung: Der feste, technische Name eines Felds, Registers, Mappentyps oder Nummernkreises, z. B. vertragsnummer. Nach dem Speichern bleibt er gleich, damit gespeicherte Werte, Links und Pakete passen.
    einsteiger: fachwort
    begegnet: admin
    nicht_verwenden: [Schlüssel (für Felder), Key]
    code: key
  - begriff: Pflichtfeld
    bereich: grundbegriffe
    beschreibung: Ein Feld, das ausgefüllt sein muss, bevor die Mappe gespeichert werden kann.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Eindeutig]
  - begriff: Eindeutig
    bereich: grundbegriffe
    beschreibung: Ein Feldwert, der in diesem Mappentyp nur einmal vorkommen darf, z. B. eine Rechnungsnummer.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Standardwert
    bereich: grundbegriffe
    beschreibung: Die Vorbelegung eines Feldes beim Anlegen einer Mappe, auch mit Platzhaltern wie einem Nummernkreis.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Defaultwert]
  - begriff: Register
    bereich: grundbegriffe
    beschreibung: Ein Trennblatt in einer Mappe, z. B. Angaben, Dokumente, Verknüpfungen, Notizen oder Historie.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Tab, Reiter]
    code: Register
  - begriff: Dokument
    bereich: grundbegriffe
    beschreibung: Eine Datei, die im DMS in einem Dokumentenregister einer Mappe liegt. Hochgeladen wird eine Datei; im DMS ist sie ein Dokument.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Version]
    code: Dokument
    konflikt: [17]
  - begriff: Version
    bereich: grundbegriffe
    beschreibung: Eine frühere Fassung eines Dokuments, das ersetzt wurde. Nur in Registern mit Versionierung. Nicht zu verwechseln mit der Version des DMS selbst.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Dokument, Archivmodus]
    code: DokumentVersion
    konflikt: [18]
  - begriff: Verweis
    bereich: grundbegriffe
    beschreibung: Ein Feld, das auf andere Mappen zeigt, z. B. von einer Rechnung auf den Vertrag.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Referenz, Link, Relation]
    verwandt: [Verknüpfungen]
    code: FeldVerweis
  - begriff: Verknüpfungen
    bereich: grundbegriffe
    beschreibung: Das Register, das alle Mappen zeigt, die auf diese Mappe verweisen – die Gegenrichtung des Verweises.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Verweis]
  - begriff: Titel
    bereich: grundbegriffe
    beschreibung: Der Anzeigename einer Mappe. Er wird aus einer Vorlage mit Feldwerten gebildet.
    einsteiger: alltag
    begegnet: alle
  - begriff: Filter (Titel)
    bereich: grundbegriffe
    beschreibung: Formatiert einen Platzhalter in der Titel-Vorlage, z. B. nur das Jahr eines Datums oder gekürzter Text. Steht hinter einem senkrechten Strich, z. B. {datum|jahr}.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Titel]
  - begriff: Ansicht
    bereich: grundbegriffe
    beschreibung: Eine gespeicherte Auswahl von Mappen – welche Mappentypen, mit welchen Bedingungen. Ansichten stehen im Baum links in der Ablage. Wie etwas aussieht, heißt dagegen „Darstellung“.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Sicht, Filter, View]
    verwandt: [Unteransicht, Bedingung, Trefferliste]
    code: Sicht
  - begriff: Unteransicht
    bereich: grundbegriffe
    beschreibung: Eine Ansicht unterhalb einer anderen. Sie erbt deren Berechtigungen.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Untersicht]
  - begriff: Trefferliste
    bereich: grundbegriffe
    beschreibung: Legt fest, welche Spalten eine Liste zeigt – am Mappentyp und an der Ansicht.
    einsteiger: fachwort
    begegnet: admin
    code: Trefferliste
    konflikt: [11]
  - begriff: Bedingung
    bereich: grundbegriffe
    beschreibung: Ein Filter einer Ansicht auf Feldwerte, Anzahlen, Fristen oder Persönliches („mir zugewiesen“).
    einsteiger: erklaeren
    begegnet: admin
    code: Bedingung
  - begriff: Favoriten
    bereich: grundbegriffe
    beschreibung: Mappen oder Ansichten, die ein Benutzer mit dem Stern markiert hat.
    einsteiger: alltag
    begegnet: alle
  - begriff: Papierkorb
    bereich: grundbegriffe
    beschreibung: Gelöschte Mappen. Sie lassen sich wiederherstellen, bis die eingestellte Zahl an Tagen abgelaufen ist.
    einsteiger: alltag
    begegnet: alle

  # ---------- Arbeiten in der Ablage ----------
  - begriff: Post
    bereich: ablage
    beschreibung: Alles, was ins DMS kommt oder hinausgeht – Scan, Upload, E-Mail. Post ist ein Systemmappentyp mit Kanal, Richtung und Stand.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Posteingang, Inbox]
    verwandt: [Neue Post, Zuordnen, Kanal]
  - begriff: Neue Post
    bereich: ablage
    beschreibung: Die Ansicht mit Post, die noch nicht zugeordnet oder erledigt ist. Wer Post zugewiesen bekommt, hat zusätzlich die Aufgabe „Post für dich“.
    einsteiger: alltag
    begegnet: alle
  - begriff: Zuordnen
    bereich: ablage
    beschreibung: Post einer vorhandenen oder neuen Mappe zuweisen. Die Dokumente wandern dabei in das Register der Mappe.
    einsteiger: alltag
    begegnet: alle
  - begriff: Kanal
    bereich: ablage
    beschreibung: Woher Post kam – hochgeladen, per E-Mail, aus dem Eingangsordner oder über die API.
    einsteiger: fachwort
    begegnet: alle
  - begriff: Zu erledigen
    bereich: ablage
    beschreibung: Die oberste Ansicht. Sie zeigt die Mappen, an denen ich etwas tun soll (meine offenen Aufgaben).
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Eingang, Inbox, Posteingang]
    verwandt: [Aufgabe]
    code: eingang
  - begriff: Aufgabe
    bereich: ablage
    beschreibung: Etwas, das ein Mensch an einer Mappe tun soll. Arten sind Passt nicht, Erwähnung, Zugewiesen (von Hand vergeben), Post für dich, Frist, Erinnerung und Vertretung.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Auftrag, Task, Todo]
    verwandt: [Zu erledigen, Frist, Erinnerung, Auftrag]
    code: Aufgabe
    konflikt: [12]
  - begriff: Erwähnung
    bereich: ablage
    beschreibung: Die Nennung eines Benutzers mit @ in formatiertem Text. Sie erzeugt für ihn eine Aufgabe.
    einsteiger: alltag
    begegnet: alle
  - begriff: Frist
    bereich: ablage
    beschreibung: Eine Aufgabe, die aus einem Datumsfeld mit Vorlauf entsteht, z. B. „Kündigen bis …“.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Erinnerung, Anstehend]
  - begriff: Erinnerung
    bereich: ablage
    beschreibung: Eine von Hand gesetzte Aufgabe für einen bestimmten Tag (Aktionen → Erinnern).
    einsteiger: alltag
    begegnet: alle
    code: Erinnerung
  - begriff: Anstehend
    bereich: ablage
    beschreibung: Die Ansicht auf Fristen und Erinnerungen, deren Vorlauf noch nicht begonnen hat.
    einsteiger: alltag
    begegnet: alle
    code: Anstehend
  - begriff: Weitergeben
    bereich: ablage
    beschreibung: Eine Aufgabe einem anderen Benutzer übertragen.
    einsteiger: alltag
    begegnet: alle
  - begriff: Abwesenheit
    bereich: ablage
    beschreibung: Ein Zeitraum, in dem ein Benutzer nicht da ist – mit einem Vertreter, der seine Aufgaben übernimmt.
    einsteiger: alltag
    begegnet: alle
    code: Abwesenheit
  - begriff: Vertretung
    bereich: ablage
    beschreibung: Ein Benutzer übernimmt während einer Abwesenheit die Aufgaben eines anderen.
    einsteiger: alltag
    begegnet: alle
    code: Vertretung
  - begriff: Notiz
    bereich: ablage
    beschreibung: Ein Kommentar an einer Mappe.
    einsteiger: alltag
    begegnet: alle
    code: Notiz
  - begriff: Formatierter Text
    bereich: ablage
    beschreibung: Text mit Überschriften, Listen und Hervorhebungen (Markdown) – als Feldart und in Notizen.
    einsteiger: erklaeren
    begegnet: alle
  - begriff: Historie
    bereich: ablage
    beschreibung: Die Geschichte einer Mappe – Änderungen vorher und nachher, Dokumente, Papierkorb, Notizen, Aufgaben. Das technische Betriebsprotokoll heißt dagegen „Protokoll“.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Protokoll (an der Mappe), Verlauf]
    code: Historieneintrag
  - begriff: Volltext
    bereich: ablage
    beschreibung: Der durchsuchbare Text in den Dokumenten – aus der Textebene der Datei oder aus der Texterkennung.
    einsteiger: fachwort
    begegnet: alle
    verwandt: [Texterkennung, Erweiterte Suche]
  - begriff: Erweiterte Suche
    bereich: ablage
    beschreibung: Ein Suchformular über die Felder mehrerer Mappentypen und den Text in Dokumenten.
    einsteiger: alltag
    begegnet: alle
    code: Suchformular
  - begriff: Link
    bereich: ablage
    beschreibung: Eine Adresse auf eine Ansicht oder Mappe, z. B. über „Link kopieren“ – auch lesbar über Mappentyp und Feldwerte. „Link“ steht nur für Adressen; Felder, die auf Mappen zeigen, heißen Verweis.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Direktlink, sprechender Link]
    code: Direktlink
  - begriff: Export
    bereich: ablage
    beschreibung: Ausgewählte Mappen einer Ansicht als Excel, CSV, ZIP oder PDF herunterladen.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Vollexport, Meine Daten exportieren, Sicherung]
  - begriff: Aktionen
    bereich: ablage
    beschreibung: Das Menü an einer Mappe – Aufgabe vergeben, Erinnern, Versenden, Exportieren und mehr.
    einsteiger: alltag
    begegnet: alle

  # ---------- Verwaltung (Werkbank) ----------
  - begriff: Benutzer
    bereich: werkbank
    beschreibung: Ein Konto, mit dem sich jemand anmeldet. Liegt als Systemmappe im DMS. Nicht zu verwechseln mit einer Person als Kontakt.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [User, Account]
    code: Benutzer
    konflikt: [14]
  - begriff: Administrator
    bereich: werkbank
    beschreibung: Ein Benutzer mit Zugang zur Werkbank. Für ihn gelten keine Einschränkungen durch Berechtigungen.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Admin (in der Oberfläche)]
  - begriff: Rolle
    bereich: werkbank
    beschreibung: Eine Gruppe von Benutzern, z. B. „Eltern“. Grundlage für Berechtigungsregeln. Nicht zu verwechseln mit der Systemrolle.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Gruppe, Weitere Rollen]
    verwandt: [Systemrolle]
    code: Rolle
  - begriff: Systemrolle
    bereich: werkbank
    beschreibung: Ob ein Benutzer Administrator oder Mitglied ist. Nur Administratoren kommen in die Werkbank.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Rolle (für Administrator/Mitglied)]
    verwandt: [Rolle, Administrator]
    code: rolle (am Benutzer)
  - begriff: Berechtigungen
    bereich: werkbank
    beschreibung: Wer an Mappentypen und Ansichten was darf (Lesen, Ändern, Anlegen, Löschen, Sehen, Exportieren). Ein Standard plus Regeln.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Permissions]
    code: Rechte
  - begriff: Regel
    bereich: werkbank
    beschreibung: Ein Wenn-dann-Baustein der Berechtigungen – Bedingung, dann Recht erteilen oder entziehen, auf Wunsch mit Stopp.
    einsteiger: erklaeren
    begegnet: admin
    code: Regel
  - begriff: Testlauf
    bereich: werkbank
    beschreibung: Prüft, welche Rechte ein bestimmter Benutzer am Ende hat.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Nummernkreis
    bereich: werkbank
    beschreibung: Fortlaufende Nummern nach einem Muster wie {yyyy}-R{0000}, z. B. für Rechnungsnummern.
    einsteiger: fachwort
    begegnet: admin
    code: Nummernkreis
  - begriff: Design
    bereich: werkbank
    beschreibung: Logo, Schriftzug, Farben und eigenes CSS des DMS.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Theme]
    konflikt: [19]
  - begriff: Paket
    bereich: werkbank
    beschreibung: Ein installierbares Bündel aus Mappentypen, Ansichten und Beispielen aus einem Paketkatalog, z. B. „Haushalt“.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Plugin, Erweiterung, App, Modul]
    code: InstalliertesPaket
  - begriff: Archivmodus
    bereich: werkbank
    beschreibung: Eine Einstellung je Mappentyp für Aufbewahrungspflichten – mit Versionen und einer Löschsperre bis zum Fristende.
    einsteiger: erklaeren
    begegnet: admin
    code: Archiv
  - begriff: Darf weg
    bereich: werkbank
    beschreibung: Die Liste der Mappen, deren Aufbewahrungsfrist abgelaufen ist.
    einsteiger: alltag
    begegnet: admin
  - begriff: Postfach
    bereich: werkbank
    beschreibung: Ein angebundenes E-Mail-Konto (IMAP), aus dem das DMS Post abholt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Eingangsordner
    bereich: werkbank
    beschreibung: Ein Ordner, den das DMS beobachtet, z. B. für „Scan to Folder“. Jede Datei darin wird Post.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Texterkennung
    bereich: werkbank
    beschreibung: Erkennt Text in Bildern und gescannten PDFs, damit er durchsuchbar wird.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [OCR (in der Oberfläche)]
    code: OcrStand
  - begriff: Anmeldeschutz
    bereich: werkbank
    beschreibung: Sperre nach Fehlversuchen, gesperrte IP-Adressen, Vorgaben zur Zwei-Faktor-Anmeldung und die Anmeldung über einen Anbieter.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Zwei-Faktor-Anmeldung
    bereich: werkbank
    beschreibung: Ein zusätzlicher Code aus einer App bei der Anmeldung.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [2FA, MFA (in der Oberfläche)]
  - begriff: Anmeldung über einen Anbieter
    bereich: werkbank
    beschreibung: Anmelden mit einem fremden Konto, z. B. Microsoft 365 (OpenID Connect).
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [SSO, OIDC (in der Oberfläche)]
  - begriff: Fehler nachstellen
    bereich: werkbank
    beschreibung: Ein Administrator arbeitet vorübergehend unter dem Konto eines anderen Benutzers, um einen Fehler zu sehen. Zurück geht es mit „Zurück zum eigenen Konto“.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Impersonation, Vertretung beenden]

  # ---------- Betrieb und Sicherheit ----------
  - begriff: Haushalt
    bereich: betrieb
    beschreibung: Der Haushalt oder die Organisation, für die das DMS eingerichtet ist. Eine Installation ist ein Haushalt. „Mandant“ steht nur im Code und, wo technisch nötig, im Administratorhandbuch.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Mandant (in der Oberfläche)]
    code: Mandant, haushalt_id
    profile: {privat: Haushalt, organisation: Organisation}
  - begriff: Einrichtungsassistent
    bereich: betrieb
    beschreibung: Die Schritte beim ersten Start des DMS.
    einsteiger: alltag
    begegnet: admin
    verwandt: [Einrichtungscode]
  - begriff: Einrichtungscode
    bereich: betrieb
    beschreibung: Der Code aus dem Protokoll des Containers, der die Einrichtung freischaltet.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Schlüssel
    bereich: betrieb
    beschreibung: Der geheime Schlüssel, mit dem Passwortfelder und Sicherungen verschlüsselt sind. Er liegt nie in der Datenbank. Der feste Name eines Felds heißt dagegen Kennung.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Fingerabdruck, Notfallblatt]
  - begriff: Fingerabdruck
    bereich: betrieb
    beschreibung: Eine kurze Prüfkennung, an der man einen Schlüssel wiedererkennt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Notfallblatt
    bereich: betrieb
    beschreibung: Ein PDF mit dem Schlüssel und einer Anleitung zur Wiederherstellung.
    einsteiger: alltag
    begegnet: admin
  - begriff: Sicherung
    bereich: betrieb
    beschreibung: Eine verschlüsselte Gesamtsicherung, die sich in ein DMS zurückspielen lässt. Kein Export – ohne DMS nicht lesbar.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Backup (in der Oberfläche)]
    verwandt: [Wiederherstellen, Probe-Wiederherstellung, Vollexport]
  - begriff: Probe-Wiederherstellung
    bereich: betrieb
    beschreibung: Prüft eine Sicherung, ohne die echten Daten anzutasten.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Wiederherstellen
    bereich: betrieb
    beschreibung: Eine Sicherung in ein DMS zurückspielen.
    einsteiger: alltag
    begegnet: admin
  - begriff: Vollexport
    bereich: betrieb
    beschreibung: Alle Daten in offenen Formaten, lesbar auch ohne DMS – damit niemand am DMS hängen bleibt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Meine Daten exportieren
