# Offene Konflikte: gleiche oder ähnliche Wörter für verschiedene Dinge.
# Entschieden wird einzeln (eigene Issues); bis dahin gelten die Begriffe oben.
konflikte:
  - nr: 1
    titel: „Aufgabe“ ist Oberbegriff und zugleich eine Art
    vorschlag: Oberbegriff bleibt; die Art heißt z. B. „Zugewiesen“ oder „Persönliche Aufgabe“.
    entschieden: '2026-10-31'
    entscheidung: Die Art heißt „Zugewiesen“; der Oberbegriff bleibt „Aufgabe“.
  - nr: 2
    titel: „Eingang“ ist nicht eingehende Post
    vorschlag: „Eingang“ → „Zu erledigen“ oder „Meine Aufgaben“; oder „Eingangsordner“ → „Scan-Ordner“.
    entschieden: '2026-10-31'
    entscheidung: „Eingang“ heißt „Zu erledigen“; „Eingangsordner“ bleibt.
  - nr: 3
    titel: „Protokoll“ für die Geschichte einer Mappe und für das Betriebsprotokoll
    vorschlag: Mappe → „Verlauf“, Werkbank → „Protokoll“.
    entschieden: '2026-10-31'
    entscheidung: Mappe → „Historie“, Werkbank → „Protokoll“.
  - nr: 4
    titel: „Schlüssel“ für Verschlüsselung, Kennung eines Feldes und API-Schlüssel
    vorschlag: Feld und Mappentyp → „Kennung“; Verschlüsselung bleibt „Schlüssel“.
    entschieden: '2026-10-31'
    entscheidung: Feld, Register, Mappentyp und Nummernkreis → „Kennung“; Verschlüsselung und API-Schlüssel bleiben „Schlüssel“.
  - nr: 5
    titel: „Sicht“ und „Ansicht“ liegen zu nah beieinander
    vorschlag: „Ansicht …“ im Profil → „Darstellung …“.
    entschieden: '2026-10-31'
    entscheidung: „Sicht“ → „Ansicht“; im Profil „Darstellung auf diesem Gerät“; „Werkbank anpassen“; bei den Paketen „Expertenmodus“.
  - nr: 6
    titel: „Vertretung“ auch beim Fehler nachstellen („Vertretung beenden“)
    vorschlag: Menüpunkt „Zurück zum eigenen Konto“.
    entschieden: '2026-10-31'
    entscheidung: „Zurück zum eigenen Konto“.
  - nr: 7
    titel: „Fehlermeldungen“ meint gemeldete Fehler
    vorschlag: „Gemeldete Fehler“.
    entschieden: '2026-10-31'
    entscheidung: „Gemeldete Fehler“.
  - nr: 8
    titel: Verweis, Referenz, Verknüpfung, Link, Direktlink
    vorschlag: Feldart „Verweis“, Gegenrichtung „Verknüpfungen“, „Link“ nur für Adressen; eines von „Direktlink“ und „sprechender Link“.
    entschieden: '2026-10-31'
    entscheidung: Feldart „Verweis“, Register „Verknüpfungen“; Adressen heißen nur „Link“.
  - nr: 9
    titel: Export, Vollexport, persönlicher Export, Sicherung
    vorschlag: Sicherung klar als „kein Export“ abgrenzen; „Meine Daten exportieren“ und „Persönlicher Export“ auf einen Namen bringen.
    entschieden: '2026-10-31'
    entscheidung: Überall „Meine Daten exportieren“; die Sicherung steht im Handbuch klar als „kein Export“.
  - nr: 10
    titel: „Wartung“ dreifach, mit den Paketen bald vierfach
    vorschlag: Werkbank-Gruppe neu benennen („Betrieb“), „Wartungsoperationen“ → „Pflegearbeiten“.
  - nr: 11
    titel: „Trefferliste“ am Mappentyp und an der Sicht
    vorschlag: Beschreiben, wie beide zusammenspielen; für Einsteiger ggf. „Spalten“.
  - nr: 12
    titel: „Aufgabe“ und „Auftrag“ sind sehr nah
    vorschlag: Bei einer Umbenennung von Konflikt 1 nicht „Auftrag“ verwenden.
  - nr: 13
    titel: Mandant, Haushalt, Organisation, Firma
    vorschlag: In der Oberfläche „Haushalt“ bzw. „Organisation“ je Sprachprofil, „Mandant“ nur technisch.
    entschieden: '2026-10-31'
    entscheidung: „Haushalt“ in allem, was Benutzer sehen; „Mandant“ nur im Code und wo technisch nötig.
  - nr: 14
    titel: Benutzer und Person
    vorschlag: „Benutzer“ ist ein Konto, „Person“ ein Kontakt (Paket Basis) – im Glossar getrennt.
  - nr: 15
    titel: Übersicht, Zusammenfassung, Anstehend
    vorschlag: Kein echter Konflikt, aber jeweils definieren.
  - nr: 16
    titel: Typ, Mappentyp, Feldart, Art
    vorschlag: Konsequent „Mappentyp“ und „Feldart“ schreiben.
    entschieden: '2026-10-31'
    entscheidung: Konsequent „Mappentyp“ und „Feldart“.
  - nr: 17
    titel: Dokument, Datei, Anhang
    vorschlag: Datei = was hochgeladen wird, Dokument = was im DMS liegt, Anhang = an einer E-Mail.
  - nr: 18
    titel: Version eines Dokuments und Version des DMS
    vorschlag: Im Handbuch klar trennen („Neu in dieser Version“ vs. „Versionen“ eines Dokuments).
  - nr: 19
    titel: Design, Darstellung, Theme
    vorschlag: Klären, was in Werkbank und Profil jeweils gemeint ist.
  - nr: 20
    titel: „Neue Post“ als Ansicht und als Art einer Aufgabe
    vorschlag: Die Aufgabenart umbenennen.
    entschieden: '2026-10-31'
    entscheidung: Die Aufgabenart heißt „Post für dich“; die Ansicht „Neue Post“ bleibt.
  - nr: 22
    titel: „Rolle“ für Administrator/Mitglied und für Gruppen wie „Eltern“
    vorschlag: Zwei Begriffe.
    entschieden: '2026-10-31'
    entscheidung: „Systemrolle“ (Administrator, Mitglied) und „Rolle“ (Gruppen).
