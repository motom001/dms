# Glossar des DMS (#276) – die eine Quelle für alle Begriffe.
#
# Daraus entsteht die Seite „Begriffe“ im Benutzerhandbuch:
#     python3 docs/handbuch/werkzeuge/glossar.py
#
# Je Begriff:
#   begriff          So heißt es in Oberfläche, Handbüchern, Hilfetexten, Meldungen und Release-Notizen.
#   bereich          grundbegriffe | ablage | werkbank | betrieb
#   beschreibung     Was gemeint ist (Grundlage für spätere Übersetzungen – nicht nur das Wort).
#   einsteiger       Einstufung für die Einsteiger-Familie (Persona Lena, Stufe 1):
#                      alltag    = versteht sie sofort
#                      erklaeren = geht, wenn die Oberfläche kurz erklärt
#                      fachwort  = verstehen Einsteiger nicht; nur mit Erklärung oder im Expertenmodus
#   begegnet         Wer dem Begriff begegnet: alle | admin (Werkbank) | fortgeschritten (Expertenmodus, Technik)
#   nicht_verwenden  Wörter, die wir dafür nicht schreiben (optional)
#   verwandt         Verwandte Begriffe (optional)
#   code             Bezeichner im Code (optional)
#   profile          Abweichendes Wort je Sprachprofil, z. B. organisation: … (optional, siehe usability-grundsaetze 2.8).
#                    Sprachprofile sind geplant; die Seite „Begriffe“ kennzeichnet sie so.
#   konflikt         Nummern offener Konflikte unten (optional)
#
# Neue Begriffe kommen mit dem Release hierher (Qualitätskontrolle).
# Die Personas: docs/handbuch/entwickler/docs/personas.md

stand: '2026-10-31'

begriffe:

  # ---------- Grundbegriffe ----------
  - begriff: Ablage
    bereich: grundbegriffe
    beschreibung: Der Arbeitsbereich für alle Benutzer – mit Ansichten, Listen und Mappen.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Werkbank, Ansicht]
  - begriff: Werkbank
    bereich: grundbegriffe
    beschreibung: Der Arbeitsbereich der Administratoren. Hier werden Mappentypen, Ansichten, Benutzer und Einstellungen gepflegt und das DMS betrieben.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Ablage, Administrator, Werkbank anpassen]
  - begriff: Profil
    bereich: grundbegriffe
    beschreibung: Die persönlichen Einstellungen des angemeldeten Benutzers, erreichbar über das Benutzermenü → „Mein Konto“.
    einsteiger: alltag
    begegnet: alle
  - begriff: Mappe
    bereich: grundbegriffe
    beschreibung: Die Grundeinheit des DMS, wie eine Pappmappe im Regal. Sie fasst Angaben, Dokumente und Verweise zu einem Ding zusammen, z. B. zu einem Vertrag, einer Rechnung oder einem Vertragspartner.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Akte, Ordner, Datensatz]
    verwandt: [Mappentyp, Register, Dokument]
    code: Mappe
  - begriff: Mappentyp
    bereich: grundbegriffe
    beschreibung: Der Bauplan einer Mappe – welche Felder und Register sie hat, wie ihr Titel entsteht und wer was darf.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Typ (allein), Vorlage, Klasse]
    verwandt: [Mappe, Feld, Systemmappentyp]
    code: Mappentyp
  - begriff: Systemmappentyp
    bereich: grundbegriffe
    beschreibung: Ein Mappentyp, den das DMS selbst mitbringt – Benutzer, Rolle und Post.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Mappentyp]
    code: Systemtyp
  - begriff: Feld
    bereich: grundbegriffe
    beschreibung: Eine Angabe in einer Mappe, z. B. die Vertragsnummer. Jedes Feld hat eine Feldart – Text, Langtext, Formatierter Text, Zahl, Betrag, Datum, Ja/Nein, Auswahlliste, Verweis oder Passwort.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Feldart, Pflichtfeld, Standardwert]
    code: Feld
  - begriff: Feldart
    bereich: grundbegriffe
    beschreibung: Welche Art von Angabe ein Feld aufnimmt, z. B. Datum oder Betrag. Die Oberfläche schreibt „Feldart“.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Feldtyp, Datentyp, Art (allein)]
    code: Feldtyp, FELDTYPEN, Feld.typ
  - begriff: Kennung
    bereich: grundbegriffe
    beschreibung: Der feste, technische Name eines Felds, Registers, Mappentyps oder Nummernkreises, z. B. vertragsnummer. Nach dem Speichern bleibt er gleich, damit gespeicherte Werte, Links und Pakete passen.
    einsteiger: fachwort
    begegnet: admin
    nicht_verwenden: [Schlüssel (für Felder), Key]
    code: key, schluessel
  - begriff: Pflichtfeld
    bereich: grundbegriffe
    beschreibung: Ein Feld, das ausgefüllt sein muss, bevor die Mappe gespeichert werden kann.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Eindeutig]
  - begriff: Eindeutig
    bereich: grundbegriffe
    beschreibung: Ein Feldwert, der in diesem Mappentyp nur einmal vorkommen darf, z. B. eine Rechnungsnummer.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Standardwert
    bereich: grundbegriffe
    beschreibung: Die Vorbelegung eines Feldes beim Anlegen einer Mappe, auch mit Platzhaltern wie einem Nummernkreis.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Defaultwert]
  - begriff: Register
    bereich: grundbegriffe
    beschreibung: Ein Trennblatt in einer Mappe, z. B. Allgemein (mit Feldern), Dokumente, Verknüpfungen oder Historie. Notizen sind kein Register; sie öffnen sich über den Knopf „Notizen“ an der Mappe.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Tab, Reiter]
    code: Register
  - begriff: Dokument
    bereich: grundbegriffe
    beschreibung: Eine Datei, die im DMS in einem Dokumentenregister einer Mappe liegt. Hochgeladen wird eine Datei; im DMS ist sie ein Dokument. An einer E-Mail heißt sie Anhang.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Version]
    code: Dokument
  - begriff: Version
    bereich: grundbegriffe
    beschreibung: Ein Dokument kann mehrere Versionen haben. Beim Ersetzen entsteht eine neue Version, die älteren bleiben darunter und lassen sich zurückholen. Nur in Registern mit Versionierung. Nicht zu verwechseln mit der Version des DMS.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Revision, Stand (für Dokumente)]
    verwandt: [Dokument, Archivmodus, Version des DMS]
    code: DokumentVersion
  - begriff: Verweis
    bereich: grundbegriffe
    beschreibung: Ein Feld, das auf andere Mappen zeigt, z. B. von einer Rechnung auf den Vertrag.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Referenz, Link, Relation]
    verwandt: [Verknüpfungen, Verweisart]
    code: referenz, Feld.zielTyp
  - begriff: Verknüpfungen
    bereich: grundbegriffe
    beschreibung: Das Register, das alle Mappen zeigt, die auf diese Mappe verweisen – die Gegenrichtung des Verweises.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Verweis]
  - begriff: Verweisart
    bereich: grundbegriffe
    beschreibung: Ob ein Verweis eine Zugehörigkeit ist („gehört zu“, z. B. eine Rechnung zum Vertrag) oder nur ein Bezug (z. B. der Aussteller). Die Mappe zeigt die Art am Verweis und in den Verknüpfungen.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Verweis]
    code: Verweisart, VERWEISARTEN
  - begriff: Titel
    bereich: grundbegriffe
    beschreibung: Der Anzeigename einer Mappe. Er wird aus einer Vorlage mit Feldwerten gebildet.
    einsteiger: alltag
    begegnet: alle
  - begriff: Filter (Titel)
    bereich: grundbegriffe
    beschreibung: Formatiert einen Platzhalter in der Titel-Vorlage, z. B. nur das Jahr eines Datums oder gekürzter Text. Steht hinter einem senkrechten Strich, z. B. {datum|jahr}.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Titel]
  - begriff: Ansicht
    bereich: grundbegriffe
    beschreibung: Eine gespeicherte Auswahl von Mappen – welche Mappentypen, mit welchen Bedingungen. Ansichten stehen im Baum links in der Ablage. Wie etwas aussieht, heißt dagegen „Darstellung“.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [Sicht, Filter, View]
    verwandt: [Unteransicht, Bedingung, Trefferliste]
    code: Sicht
  - begriff: Unteransicht
    bereich: grundbegriffe
    beschreibung: Eine Ansicht unterhalb einer anderen. Sie erbt deren Berechtigungen.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Untersicht]
  - begriff: Trefferliste
    bereich: grundbegriffe
    beschreibung: Legt fest, welche Spalten eine Liste zeigt. Ein Mappentyp hat eine oder mehrere Trefferlisten; eine davon ist der Standard. Eine Ansicht oder ein Verknüpfungsregister wählt eine davon, sonst gilt der Standard. Zeigt eine Ansicht mehrere Mappentypen, stehen nur Trefferlisten mit gleicher Kennung in allen zur Wahl, mit den gemeinsamen Spalten.
    einsteiger: fachwort
    begegnet: admin
    code: Trefferliste
  - begriff: Bedingung
    bereich: grundbegriffe
    beschreibung: Ein Filter einer Ansicht auf Feldwerte, Anzahlen, Fristen oder Persönliches, z. B. ein Feld gleich „aktueller Benutzer“ oder „ist mein Favorit“.
    einsteiger: erklaeren
    begegnet: admin
    code: Bedingung
  - begriff: Favoriten
    bereich: grundbegriffe
    beschreibung: Mappen, die ein Benutzer mit dem Stern markiert hat. Die Ansicht „Favoriten“ zeigt sie.
    einsteiger: alltag
    begegnet: alle
  - begriff: Archivnummer
    bereich: grundbegriffe
    beschreibung: Nummer auf einem Aufkleber am Papieroriginal (z. B. A-000123), dieselbe steht am Dokument im DMS. Eindeutig je Haushalt; kommt aus dem Nummernkreis „Archivnummer“. Verbindet Papier und Dokument in beide Richtungen.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Ablageort, Nummernkreis, Dokument]
    code: archivnummer
  - begriff: Ablageort
    bereich: grundbegriffe
    beschreibung: Ein Platz, an dem Papier liegt – z. B. ein Ordner, eine Kiste, ein Schließfach oder „vernichtet“. Ablageorte liegen ineinander („zu Hause › Arbeitszimmer Schrank › roter Ordner“). Jedes DMS hat diesen Mappentyp; er lässt sich erweitern, aber nicht löschen.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Verbleib Originaldokumente, Mappentyp]
    code: ablageort
  - begriff: Verbleib Originaldokumente
    bereich: grundbegriffe
    beschreibung: Das Feld an einer Mappe, das auf den Ablageort des Papiers zeigt. In allen Mappentypen mit derselben Kennung, damit gemeinsame Listen und Ansichten funktionieren.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Lagerort, Standort (für Papier)]
    verwandt: [Ablageort]
    code: verbleib_original
  - begriff: Papierkorb
    bereich: grundbegriffe
    beschreibung: Gelöschte Mappen. Sie lassen sich wiederherstellen, bis die eingestellte Zahl an Tagen abgelaufen ist.
    einsteiger: alltag
    begegnet: alle

  # ---------- Arbeiten in der Ablage ----------
  - begriff: Post
    bereich: ablage
    beschreibung: Alles, was ins DMS kommt oder hinausgeht – Scan, Upload, E-Mail. Post ist ein Systemmappentyp mit Kanal, Richtung und Stand.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Posteingang, Inbox]
    verwandt: [Neue Post, Zuordnen, Kanal, Richtung (Post), Stand (Post)]
  - begriff: Neue Post
    bereich: ablage
    beschreibung: Die Ansicht mit Post, die noch nicht zugeordnet oder erledigt ist. Wer Post zugewiesen bekommt, hat zusätzlich die Aufgabe „Post für dich“.
    einsteiger: alltag
    begegnet: alle
  - begriff: Zuordnen
    bereich: ablage
    beschreibung: Post einer vorhandenen oder neuen Mappe zuweisen. Die Dokumente wandern dabei in das Register der Mappe.
    einsteiger: alltag
    begegnet: alle
  - begriff: Kanal
    bereich: ablage
    beschreibung: Wie Post ins DMS kam oder hinausging. Das DMS setzt Hochgeladen, E-Mail, Ordner (Eingangsordner) und API selbst; Scan, Import und WebDAV lassen sich in der Liste von Hand wählen.
    einsteiger: fachwort
    begegnet: alle
  - begriff: Richtung (Post)
    bereich: ablage
    beschreibung: Ob Post eingehend oder ausgehend ist. Mit „Per E-Mail versenden“ entsteht ausgehende Post.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Post]
  - begriff: Stand (Post)
    bereich: ablage
    beschreibung: Wie weit Post bearbeitet ist – Neu (noch nicht bearbeitet), Zugeordnet (liegt bei einer passenden Mappe) oder Erledigt (nichts mehr zu tun).
    einsteiger: alltag
    begegnet: alle
    verwandt: [Post, Neue Post]
  - begriff: Zu erledigen
    bereich: ablage
    beschreibung: Die oberste Ansicht. Sie zeigt die Mappen, an denen ich etwas tun soll (meine offenen Aufgaben).
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Eingang, Inbox, Posteingang]
    verwandt: [Aufgabe]
    code: eingang
  - begriff: Aufgabe
    bereich: ablage
    beschreibung: Etwas, das ein Mensch an einer Mappe tun soll. Arten sind Passt nicht, Erwähnung, Zugewiesen (von Hand vergeben), Post für dich, Frist, Erinnerung und Vertretung.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Auftrag, Task, Todo]
    verwandt: [Zu erledigen, Frist, Erinnerung, Auftrag]
    code: Aufgabe, AUFGABENARTEN
  - begriff: Erwähnung
    bereich: ablage
    beschreibung: Die Nennung eines Benutzers mit @ in formatiertem Text. Sie erzeugt für ihn eine Aufgabe.
    einsteiger: alltag
    begegnet: alle
  - begriff: Frist
    bereich: ablage
    beschreibung: Eine Aufgabe, die aus einem Datumsfeld mit Vorlauf entsteht, z. B. „Kündigen bis …“.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Erinnerung, Anstehend]
  - begriff: Erinnerung
    bereich: ablage
    beschreibung: Eine von Hand gesetzte Aufgabe für einen bestimmten Tag (Aktionen → Erinnern).
    einsteiger: alltag
    begegnet: alle
    code: Erinnerung
  - begriff: Anstehend
    bereich: ablage
    beschreibung: Die Ansicht mit meinen Fristen und Erinnerungen der nächsten Tage (Standard 30) – kommende und solche, die schon fällig sind und unter „Zu erledigen“ stehen.
    einsteiger: alltag
    begegnet: alle
    code: Anstehend
  - begriff: Weitergeben
    bereich: ablage
    beschreibung: Eine Aufgabe einem anderen Benutzer übertragen.
    einsteiger: alltag
    begegnet: alle
  - begriff: Abwesenheit
    bereich: ablage
    beschreibung: Ein Zeitraum, in dem ein Benutzer nicht da ist – mit einem Vertreter, der seine Aufgaben übernimmt.
    einsteiger: alltag
    begegnet: alle
    code: Abwesenheit
  - begriff: Vertretung
    bereich: ablage
    beschreibung: Ein Benutzer übernimmt während einer Abwesenheit die Aufgaben eines anderen. Der Vertreter bekommt dazu eine Aufgabe der Art „Vertretung“.
    einsteiger: alltag
    begegnet: alle
    code: Abwesenheit.vertreterId, vertretung (Aufgabenart)
  - begriff: Notiz
    bereich: ablage
    beschreibung: Ein Kommentar an einer Mappe.
    einsteiger: alltag
    begegnet: alle
    code: Notiz
  - begriff: Formatierter Text
    bereich: ablage
    beschreibung: Text mit Überschriften, Listen und Hervorhebungen (Markdown) – als Feldart und in Notizen.
    einsteiger: erklaeren
    begegnet: alle
  - begriff: Historie
    bereich: ablage
    beschreibung: Die Geschichte einer Mappe – Änderungen vorher und nachher, Dokumente, Papierkorb, Notizen, Aufgaben. Das technische Betriebsprotokoll heißt dagegen „Protokoll“.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Protokoll (an der Mappe), Verlauf]
    code: Historieneintrag
  - begriff: Volltext
    bereich: ablage
    beschreibung: Der durchsuchbare Text in den Dokumenten – aus der Textebene der Datei oder aus der Texterkennung.
    einsteiger: fachwort
    begegnet: alle
    verwandt: [Texterkennung, Erweiterte Suche]
  - begriff: Vorschaubild
    bereich: ablage
    beschreibung: Kleines Bild der ersten Seite neben einem PDF oder Bild in der Dokumentliste; entsteht im Hintergrund und wird nicht gesichert.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Dokument]
    nicht_verwenden: [Thumbnail, Miniatur]
    code: vorschau
  - begriff: Erweiterte Suche
    bereich: ablage
    beschreibung: Ein Suchformular über die Felder mehrerer Mappentypen und den Text in Dokumenten.
    einsteiger: alltag
    begegnet: alle
    code: Suchformular
  - begriff: Link
    bereich: ablage
    beschreibung: Eine Adresse auf eine Ansicht oder Mappe, z. B. über „Link kopieren“ – auch lesbar über Mappentyp und Feldwerte. „Link“ steht nur für Adressen; Felder, die auf Mappen zeigen, heißen Verweis.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Direktlink, sprechender Link]
    code: Direktlink
  - begriff: Export
    bereich: ablage
    beschreibung: Ausgewählte Mappen einer Ansicht als Excel, CSV, ZIP oder PDF herunterladen.
    einsteiger: erklaeren
    begegnet: alle
    verwandt: [Vollexport, Meine Daten exportieren, Sicherung]
  - begriff: Aktionen
    bereich: ablage
    beschreibung: Das Menü an einer Mappe – Aufgabe vergeben, Erinnern, Versenden, Exportieren und mehr.
    einsteiger: alltag
    begegnet: alle

  # ---------- Verwaltung (Werkbank) ----------
  - begriff: Benutzer
    bereich: werkbank
    beschreibung: Ein Konto, mit dem sich jemand anmeldet. Liegt als Systemmappe im DMS. Personen und Firmen, mit denen man zu tun hat (Kontakte), sind keine Benutzer, sondern gewöhnliche Mappen vom Mappentyp „Person“ bzw. „Organisation“ aus dem Paket Basis.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [User, Account]
    code: Benutzer
  - begriff: Person
    bereich: grundbegriffe
    beschreibung: Ein Mensch, mit dem man zu tun hat – Ansprechpartnerin, Arzt, Vermieter, Verwandte. Mappentyp aus dem Paket Basis (ab 1.1.0). Eine Person ist **kein Benutzer** und kann sich nicht anmelden.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Benutzer, Organisation, Niederlassung]
    nicht_verwenden: [Kontakt (als Mappentyp), Benutzer (für Kontakte)]
    code: basis_person
  - begriff: Organisation
    bereich: grundbegriffe
    beschreibung: Firma, Behörde, Bank, Praxis, Verein oder andere Stelle, mit der man zu tun hat. Mappentyp aus dem Paket Basis; andere Pakete verweisen darauf (Vertragspartner, Versicherer, Bank …).
    einsteiger: alltag
    begegnet: alle
    verwandt: [Niederlassung, Person]
    code: basis_organisation
  - begriff: Niederlassung
    bereich: grundbegriffe
    beschreibung: Filiale, Zweigstelle, Praxis oder Außenstelle einer Organisation – mit eigener Anschrift und eigenem Telefon. Mappentyp aus dem Paket Basis (ab 1.1.0); gehört zu genau einer Organisation.
    einsteiger: alltag
    begegnet: alle
    verwandt: [Organisation, Person]
    nicht_verwenden: [Standort (verwechselbar mit Ablageort), Filiale (als Mappentyp – ist eine der Arten)]
    code: basis_niederlassung
  - begriff: Administrator
    bereich: werkbank
    beschreibung: Ein Benutzer mit Zugang zur Werkbank. Für ihn gelten keine Einschränkungen durch Berechtigungen.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Admin (in der Oberfläche)]
  - begriff: Rolle
    bereich: werkbank
    beschreibung: Eine Gruppe von Benutzern, z. B. „Eltern“. Grundlage für Berechtigungsregeln. Nicht zu verwechseln mit der Systemrolle.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Gruppe, Weitere Rollen]
    verwandt: [Systemrolle]
    code: rolle (Systemtyp), Benutzer.rollen
  - begriff: Systemrolle
    bereich: werkbank
    beschreibung: Ob ein Benutzer Administrator oder Mitglied ist. Nur Administratoren kommen in die Werkbank.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Rolle (für Administrator/Mitglied)]
    verwandt: [Rolle, Administrator]
    code: Rolle, Benutzer.rolle
  - begriff: Berechtigungen
    bereich: werkbank
    beschreibung: Wer was darf. Am Mappentyp – Anlegen, Lesen, Bearbeiten, Löschen, Passwörter sehen – mit einem Standard plus Regeln; an der Ansicht – Sehen, Anlegen, Exportieren – mit Vererbung an die Unteransichten. Für Administratoren gelten sie nicht.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Permissions]
    code: Rechte
  - begriff: Regel
    bereich: werkbank
    beschreibung: Ein Wenn-dann-Baustein der Berechtigungen – Bedingung, dann Recht erteilen oder entziehen, auf Wunsch mit Stopp.
    einsteiger: erklaeren
    begegnet: admin
    code: Regel
  - begriff: Testlauf
    bereich: werkbank
    beschreibung: Prüft, welche Rechte ein bestimmter Benutzer am Ende hat.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Nummernkreis
    bereich: werkbank
    beschreibung: Fortlaufende Nummern nach einem Muster wie {jjjj}-R{zaehler:4} (ergibt z. B. 2026-R0001), etwa für Rechnungsnummern.
    einsteiger: fachwort
    begegnet: admin
    code: Nummernkreis
  - begriff: Design
    bereich: werkbank
    beschreibung: Wie die Oberfläche aussieht – Logo, Schriftzug, Farben (hell, dunkel, hoher Kontrast oder nach Gerät) und eigenes CSS. Administratoren legen Designs unter Werkbank → Designs an und bestimmen den Standard; jeder Benutzer wählt seines im Profil unter „Darstellung“.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Theme]
    verwandt: [Darstellung]
  - begriff: Darstellung
    bereich: grundbegriffe
    beschreibung: Der Bereich im Profil, in dem jeder einstellt, wie das DMS für ihn aussieht – das Design (für sein Konto), die Schriftgröße und die Breite der Bereiche (je Gerät).
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Theme, Ansicht (für das Aussehen)]
    verwandt: [Design, Profil]
  - begriff: Paket
    bereich: werkbank
    beschreibung: Ein installierbares Bündel aus Mappentypen, Ansichten und Beispielen aus einem Paketkatalog, z. B. „Basis“. Ein Update ergänzt nur; es entfernt und ändert nichts.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Plugin, Erweiterung, App, Modul]
    verwandt: [Paketkatalog, Expertenmodus, Paket-Läufer]
    code: InstalliertesPaket
  - begriff: Paketkatalog
    bereich: werkbank
    beschreibung: Die Liste der Pakete, die ein DMS installieren kann (eine Datei katalog.json im Netz). Das DMS fragt den offiziellen Katalog nur auf Knopfdruck ab („Katalog abrufen“). Weitere Kataloge trägt man im Expertenmodus unter „Weitere Quellen“ ein.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Paket, Expertenmodus]
    code: Katalog, OFFIZIELLER_KATALOG
  - begriff: Expertenmodus
    bereich: werkbank
    beschreibung: Ein Schalter unter Werkbank → Pakete. Er blendet „Weitere Quellen“ und „Paket hochladen“ ein – für Paketentwickler und DMS ohne Internet. Gilt je Benutzer und ist zu Beginn aus.
    einsteiger: fachwort
    begegnet: fortgeschritten
    nicht_verwenden: [Erweiterte Ansicht]
    verwandt: [Paket, Paketkatalog]
    code: pakete_erweitert
  - begriff: Paket-Läufer
    bereich: werkbank
    beschreibung: Der Teil des DMS, der den Code von Paketen ausführt. Geplant – bis dahin läuft Code in Paketen nicht; ihre Einstellungen lassen sich schon pflegen.
    einsteiger: fachwort
    begegnet: fortgeschritten
    verwandt: [Paket]
    code: PaketLaeufer
  - begriff: Werkbank anpassen
    bereich: werkbank
    beschreibung: Legt fest, welche Bereiche links in der Werkbank stehen – nach einer Vorlage („Haushalt“, „Betrieb“ oder „Alles“) und mit Abweichungen. Ausblenden schaltet nichts ab. Neue Installationen starten mit „Haushalt“; Installationen von vor dieser Einstellung zeigen alles.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Werkbank, Übersicht, Betrieb]
    code: WerkbankAnsicht, VORLAGEN
  - begriff: Betrieb
    bereich: werkbank
    beschreibung: Die Vorlage unter „Werkbank anpassen“ für Selbständige und kleine Betriebe – mit Nummernkreisen, Archivmodus, Postfächern und weiteren Bereichen. Geplant ist „Betrieb“ auch als Sprachprofil für Firmen (Gegenstück zu „Haushalt“).
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Organisation (für die Vorlage)]
    verwandt: [Werkbank anpassen, Haushalt]
    code: organisation (Vorlage)
  - begriff: Übersicht
    bereich: werkbank
    beschreibung: Die erste Seite der Werkbank – was in diesem DMS gerade zu tun ist, mit Hinweisen, Stand und Bestand.
    einsteiger: alltag
    begegnet: admin
    verwandt: [Werkbank]
  - begriff: Tägliche Zusammenfassung
    bereich: werkbank
    beschreibung: Eine E-Mail, die einmal am Tag die offenen Aufgaben eines Benutzers auflistet – nur, wenn er welche hat und nicht abwesend ist. Administratoren schalten sie unter Werkbank → Aufgaben ein; Uhrzeit und Wochentage wählt jeder im Profil.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Übersicht per E-Mail, Digest]
    verwandt: [Aufgabe, Anstehend]
  - begriff: Archivmodus
    bereich: werkbank
    beschreibung: Eine Einstellung je Mappentyp für Aufbewahrungspflichten – mit Versionen und einer Löschsperre bis zum Fristende.
    einsteiger: erklaeren
    begegnet: admin
    code: Archiv
  - begriff: Darf weg
    bereich: werkbank
    beschreibung: Die Liste der Mappen, deren Aufbewahrungsfrist abgelaufen ist.
    einsteiger: alltag
    begegnet: admin
  - begriff: Postfach
    bereich: werkbank
    beschreibung: Ein angebundenes E-Mail-Konto (IMAP), aus dem das DMS Post abholt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Eingangsordner
    bereich: werkbank
    beschreibung: Ein Ordner, den das DMS beobachtet, z. B. für „Scan to Folder“. Jede Datei darin wird Post.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Texterkennung
    bereich: werkbank
    beschreibung: Erkennt Text in Bildern und gescannten PDFs, damit er durchsuchbar wird.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [OCR (in der Oberfläche)]
    code: OcrStand
  - begriff: Anmeldeschutz
    bereich: werkbank
    beschreibung: Sperre nach Fehlversuchen, gesperrte IP-Adressen, Vorgaben zur Zwei-Faktor-Anmeldung und die Anmeldung über einen Anbieter.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Zwei-Faktor-Anmeldung
    bereich: werkbank
    beschreibung: Ein zusätzlicher Code aus einer App bei der Anmeldung.
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [2FA, MFA (in der Oberfläche)]
  - begriff: Anmeldung über einen Anbieter
    bereich: werkbank
    beschreibung: Anmelden mit einem fremden Konto, z. B. Microsoft 365 (OpenID Connect).
    einsteiger: erklaeren
    begegnet: alle
    nicht_verwenden: [SSO, OIDC (in der Oberfläche)]
  - begriff: Fehler nachstellen
    bereich: werkbank
    beschreibung: Ein Administrator arbeitet vorübergehend unter dem Konto eines anderen Benutzers, um einen Fehler zu sehen. Zurück geht es mit „Zurück zum eigenen Konto“.
    einsteiger: erklaeren
    begegnet: admin
    nicht_verwenden: [Impersonation, Vertretung beenden]
    code: Vertretung

  # ---------- Betrieb und Sicherheit ----------
  - begriff: Haushalt
    bereich: betrieb
    beschreibung: Der Haushalt (oder die Firma), für den das DMS eingerichtet ist. Eine Installation ist ein Haushalt. „Mandant“ steht nur im Code und, wo technisch nötig, im Administratorhandbuch.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Mandant (in der Oberfläche)]
    code: mandant, haushalt_id
    profile: {privat: Haushalt, betrieb: Betrieb}
  - begriff: Einrichtungsassistent
    bereich: betrieb
    beschreibung: Die Schritte beim ersten Start des DMS.
    einsteiger: alltag
    begegnet: admin
    verwandt: [Einrichtungscode]
  - begriff: Einrichtungscode
    bereich: betrieb
    beschreibung: Der Code aus dem Protokoll des Containers, der die Einrichtung freischaltet.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Schlüssel
    bereich: betrieb
    beschreibung: Der geheime Schlüssel, mit dem Passwortfelder und Sicherungen verschlüsselt sind. Er liegt nie in der Datenbank. Der feste Name eines Felds heißt dagegen Kennung.
    einsteiger: erklaeren
    begegnet: admin
    verwandt: [Fingerabdruck, Notfallblatt]
  - begriff: Fingerabdruck
    bereich: betrieb
    beschreibung: Eine kurze Prüfkennung, an der man einen Schlüssel wiedererkennt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Notfallblatt
    bereich: betrieb
    beschreibung: Ein PDF mit dem Schlüssel und einer Anleitung zur Wiederherstellung.
    einsteiger: alltag
    begegnet: admin
  - begriff: Sicherung
    bereich: betrieb
    beschreibung: Eine verschlüsselte Gesamtsicherung, die sich in ein DMS zurückspielen lässt. Kein Export – ohne DMS nicht lesbar.
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Backup (in der Oberfläche)]
    verwandt: [Wiederherstellen, Probe-Wiederherstellung, Vollexport]
  - begriff: Probe-Wiederherstellung
    bereich: betrieb
    beschreibung: Prüft eine Sicherung, ohne die echten Daten anzutasten.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Wiederherstellen
    bereich: betrieb
    beschreibung: Eine Sicherung in ein DMS zurückspielen.
    einsteiger: alltag
    begegnet: admin
  - begriff: Vollexport
    bereich: betrieb
    beschreibung: Alle Daten in offenen Formaten, lesbar auch ohne DMS – damit niemand am DMS hängen bleibt.
    einsteiger: erklaeren
    begegnet: admin
  - begriff: Meine Daten exportieren
    bereich: betrieb
    beschreibung: Ein Benutzer lädt im Profil seine eigenen Daten herunter.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Persönlicher Export]
  - begriff: Wartungsmodus
    bereich: betrieb
    beschreibung: Eine vorübergehende Sperre für Benutzer mit Ankündigung, z. B. während einer Wiederherstellung.
    einsteiger: erklaeren
    begegnet: admin
    konflikt: [10]
  - begriff: Wartungsoperationen
    bereich: betrieb
    beschreibung: Einmalige Pflegearbeiten, z. B. Nummern nachträglich vergeben.
    einsteiger: fachwort
    begegnet: admin
    konflikt: [10]
  - begriff: Protokoll
    bereich: betrieb
    beschreibung: Das laufende Betriebsprotokoll des Servers mit Modulen und Stufen (Werkbank → Protokoll). Die Geschichte einer Mappe heißt dagegen Historie.
    einsteiger: erklaeren
    begegnet: fortgeschritten
    verwandt: [Historie]
  - begriff: Debug-Modus
    bereich: betrieb
    beschreibung: Ein ausführlicheres technisches Protokoll für die Fehlersuche.
    einsteiger: fachwort
    begegnet: fortgeschritten
  - begriff: Gemeldete Fehler
    bereich: betrieb
    beschreibung: Fehler, die Benutzer über „Fehler melden“ eingereicht haben (Werkbank → Gemeldete Fehler).
    einsteiger: alltag
    begegnet: admin
    nicht_verwenden: [Fehlermeldungen]
  - begriff: Speicherplatz
    bereich: betrieb
    beschreibung: Wie voll die Datenordner sind, mit Schwellen für Warnungen.
    einsteiger: alltag
    begegnet: admin
  - begriff: Demo-Daten
    bereich: betrieb
    beschreibung: Erzeugte Beispielmappen zum Ausprobieren und für Lasttests.
    einsteiger: alltag
    begegnet: admin
  - begriff: API
    bereich: betrieb
    beschreibung: Die Schnittstelle, über die Programme mit dem DMS arbeiten. Zugang mit einem persönlichen API-Schlüssel.
    einsteiger: fachwort
    begegnet: fortgeschritten
  - begriff: Version des DMS
    bereich: betrieb
    beschreibung: Der Stand des Programms, z. B. 0.73. Ein Update bringt eine neue Version des DMS; an Dokumenten und ihren Versionen ändert das nichts. Was neu ist, steht unter „Neu in dieser Version“.
    einsteiger: alltag
    begegnet: alle
    nicht_verwenden: [Release (in der Oberfläche)]
    verwandt: [Version]
  - begriff: Konsole
    bereich: betrieb
    beschreibung: Der Befehl „dms“ im Container für Notfall und Betrieb.
    einsteiger: fachwort
    begegnet: fortgeschritten
  - begriff: Auftrag
    bereich: betrieb
    beschreibung: Arbeit, die das DMS im Hintergrund erledigt und deren Fortschritt man sieht, z. B. Demo-Daten erzeugen, Vollexport, Nummern nachträglich vergeben. Es läuft immer nur ein Auftrag. Arbeit für Menschen heißt Aufgabe.
    einsteiger: fachwort
    begegnet: admin
    nicht_verwenden: [Job]
    code: Auftrag

# Offene Konflikte: gleiche oder ähnliche Wörter für verschiedene Dinge.
# Entschieden wird einzeln (eigene Issues); bis dahin gelten die Begriffe oben.
konflikte:
  - nr: 1
    titel: „Aufgabe“ ist Oberbegriff und zugleich eine Art
    vorschlag: Oberbegriff bleibt; die Art heißt z. B. „Zugewiesen“ oder „Persönliche Aufgabe“.
    entschieden: '2026-10-31'
    entscheidung: Die Art heißt „Zugewiesen“; der Oberbegriff bleibt „Aufgabe“.
  - nr: 2
    titel: „Eingang“ ist nicht eingehende Post
    vorschlag: „Eingang“ → „Zu erledigen“ oder „Meine Aufgaben“; oder „Eingangsordner“ → „Scan-Ordner“.
    entschieden: '2026-10-31'
    entscheidung: „Eingang“ heißt „Zu erledigen“; „Eingangsordner“ bleibt.
  - nr: 3
    titel: „Protokoll“ für die Geschichte einer Mappe und für das Betriebsprotokoll
    vorschlag: Mappe → „Verlauf“, Werkbank → „Protokoll“.
    entschieden: '2026-10-31'
    entscheidung: Mappe → „Historie“, Werkbank → „Protokoll“.
  - nr: 4
    titel: „Schlüssel“ für Verschlüsselung, Kennung eines Feldes und API-Schlüssel
    vorschlag: Feld und Mappentyp → „Kennung“; Verschlüsselung bleibt „Schlüssel“.
    entschieden: '2026-10-31'
    entscheidung: Feld, Register, Mappentyp und Nummernkreis → „Kennung“; Verschlüsselung und API-Schlüssel bleiben „Schlüssel“.
  - nr: 5
    titel: „Sicht“ und „Ansicht“ liegen zu nah beieinander
    vorschlag: „Ansicht …“ im Profil → „Darstellung …“.
    entschieden: '2026-10-31'
    entscheidung: „Sicht“ → „Ansicht“; im Profil „Darstellung auf diesem Gerät“; „Werkbank anpassen“; bei den Paketen „Expertenmodus“.
  - nr: 6
    titel: „Vertretung“ auch beim Fehler nachstellen („Vertretung beenden“)
    vorschlag: Menüpunkt „Zurück zum eigenen Konto“.
    entschieden: '2026-10-31'
    entscheidung: „Zurück zum eigenen Konto“.
  - nr: 7
    titel: „Fehlermeldungen“ meint gemeldete Fehler
    vorschlag: „Gemeldete Fehler“.
    entschieden: '2026-10-31'
    entscheidung: „Gemeldete Fehler“.
  - nr: 8
    titel: Verweis, Referenz, Verknüpfung, Link, Direktlink
    vorschlag: Feldart „Verweis“, Gegenrichtung „Verknüpfungen“, „Link“ nur für Adressen; eines von „Direktlink“ und „sprechender Link“.
    entschieden: '2026-10-31'
    entscheidung: Feldart „Verweis“, Register „Verknüpfungen“; Adressen heißen nur „Link“.
  - nr: 9
    titel: Export, Vollexport, persönlicher Export, Sicherung
    vorschlag: Sicherung klar als „kein Export“ abgrenzen; „Meine Daten exportieren“ und „Persönlicher Export“ auf einen Namen bringen.
    entschieden: '2026-10-31'
    entscheidung: Überall „Meine Daten exportieren“; die Sicherung steht im Handbuch klar als „kein Export“.
  - nr: 10
    titel: „Wartung“ dreifach – Werkbank-Gruppe „Wartung und Fehlersuche“, Wartungsmodus, Wartungsoperationen
    vorschlag: Werkbank-Gruppe neu benennen („Betrieb“), „Wartungsoperationen“ → „Pflegearbeiten“.
  - nr: 11
    titel: „Trefferliste“ am Mappentyp und an der Ansicht
    vorschlag: Beschreiben, wie beide zusammenspielen; für Einsteiger ggf. „Spalten“.
    entschieden: '2026-10-31'
    entscheidung: Kein neues Wort. Der Mappentyp legt seine Trefferlisten fest, eine davon ist der Standard; eine Ansicht wählt eine davon, sonst gilt der Standard (siehe „Trefferliste“).
  - nr: 12
    titel: „Aufgabe“ und „Auftrag“ sind sehr nah
    vorschlag: Bei einer Umbenennung von Konflikt 1 nicht „Auftrag“ verwenden.
    entschieden: '2026-10-31'
    entscheidung: Beide Wörter bleiben. „Aufgabe“ ist Arbeit für Menschen, „Auftrag“ Arbeit, die das DMS im Hintergrund erledigt.
  - nr: 13
    titel: Mandant, Haushalt, Organisation, Firma
    vorschlag: In der Oberfläche „Haushalt“ bzw. „Organisation“ je Sprachprofil, „Mandant“ nur technisch.
    entschieden: '2026-10-31'
    entscheidung: „Haushalt“ in allem, was Benutzer sehen; „Mandant“ nur im Code und wo technisch nötig.
  - nr: 14
    titel: Benutzer und Person
    vorschlag: „Benutzer“ ist ein Konto, „Person“ ein Kontakt (Paket Basis) – im Glossar getrennt.
    entschieden: '2026-10-31'
    entscheidung: „Benutzer“ ist ein Konto zum Anmelden. Kontakte – Personen, Firmen, Behörden – sind gewöhnliche Mappen und keine Benutzer.
  - nr: 15
    titel: Übersicht, Zusammenfassung, Anstehend
    vorschlag: Kein echter Konflikt, aber jeweils definieren.
    entschieden: '2026-10-31'
    entscheidung: Drei Begriffe mit je eigener Bedeutung – „Übersicht“ (erste Seite der Werkbank), „Tägliche Zusammenfassung“ (E-Mail mit offenen Aufgaben), „Anstehend“ (Ansicht mit Fristen und Erinnerungen).
  - nr: 16
    titel: Typ, Mappentyp, Feldart, Art
    vorschlag: Konsequent „Mappentyp“ und „Feldart“ schreiben.
    entschieden: '2026-10-31'
    entscheidung: Konsequent „Mappentyp“ und „Feldart“.
  - nr: 17
    titel: Dokument, Datei, Anhang
    vorschlag: Datei = was hochgeladen wird, Dokument = was im DMS liegt, Anhang = an einer E-Mail.
    entschieden: '2026-10-31'
    entscheidung: Datei = was hochgeladen oder heruntergeladen wird, Dokument = was im DMS in einer Mappe liegt, Anhang = an einer E-Mail.
  - nr: 18
    titel: Version eines Dokuments und Version des DMS
    vorschlag: Im Handbuch klar trennen („Neu in dieser Version“ vs. „Versionen“ eines Dokuments).
    entschieden: '2026-10-31'
    entscheidung: Zwei Begriffe – „Version“ gehört zu einem Dokument, „Version des DMS“ ist der Stand des Programms. Erklärt auf der Seite „Versionen verstehen“.
  - nr: 19
    titel: Design, Darstellung, Theme
    vorschlag: Klären, was in Werkbank und Profil jeweils gemeint ist.
    entschieden: '2026-10-31'
    entscheidung: „Design“ legen Administratoren in der Werkbank an (Logo, Farben, eigenes CSS); „Darstellung“ ist der Bereich im Profil, in dem jeder sein Design, die Schriftgröße und die Breiten wählt. „Theme“ nicht verwenden.
  - nr: 20
    titel: „Neue Post“ als Ansicht und als Art einer Aufgabe
    vorschlag: Die Aufgabenart umbenennen.
    entschieden: '2026-10-31'
    entscheidung: Die Aufgabenart heißt „Post für dich“; die Ansicht „Neue Post“ bleibt.
  - nr: 22
    titel: „Rolle“ für Administrator/Mitglied und für Gruppen wie „Eltern“
    vorschlag: Zwei Begriffe.
    entschieden: '2026-10-31'
    entscheidung: „Systemrolle“ (Administrator, Mitglied) und „Rolle“ (Gruppen).
  - nr: 23
    titel: „Organisation“ für drei Dinge
    vorschlag: „Organisation“ ist eine Vorlage unter „Werkbank anpassen“, das geplante Wort für den Haushalt im Sprachprofil für Firmen und ein Mappentyp im Paket Basis. Klären, welches das Wort behält; bis dahin im Text immer sagen, welches gemeint ist.
    entschieden: '2026-10-31'
    entscheidung: „Organisation“ bleibt nur für den Mappentyp im Paket Basis. Die Werkbank-Vorlage und das geplante Sprachprofil für Firmen heißen „Betrieb“ (Paar Haushalt ↔ Betrieb).
