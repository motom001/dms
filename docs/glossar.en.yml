# Glossar auf Englisch (#730) – zu jedem Begriff aus docs/glossar.yml das englische Wort und die Beschreibung.
#
# Daraus entsteht die Seite „Terms“ im englischen Benutzerhandbuch (benutzer/docs-en/begriffe.md):
#     python3 docs/handbuch/werkzeuge/glossar.py
#
# Schlüssel ist der deutsche Begriff genau wie in glossar.yml. Fehlt ein Begriff, zeigt die Seite ihn mit
# deutscher Beschreibung. Die Wörter folgen der englischen Oberfläche (shared/src/sprachen/en, #729).

begriffe:
  Ablago:
    begriff: Ablago
    beschreibung: The name of the program – document filing for home and small businesses. One word, only the A in capitals. When the kind of program is meant, it is still called a "DMS" (document management system).
  Ablage:
    begriff: Library
    beschreibung: The work area for all users – with views, lists and folders. At the same time the word for the whole installation, at home as at work ("name of your Library", "Library id"); one installation is one Library.
  Werkbank:
    begriff: Workbench
    beschreibung: The administrators' work area. Folder types, views, users and settings are maintained and Ablago is operated here.
  Mein Konto:
    begriff: My account
    beschreibung: The personal settings of the signed-in user – one click on your own name at the top right, then "My account". We describe paths the way you click, e.g. "My account → Security → API keys".
  Mappe:
    begriff: Folder
    beschreibung: The basic unit of Ablago, like a cardboard folder on the shelf. It brings together details, documents and links about one thing, e.g. a contract, an invoice or a contract partner. A folder in Ablago is not a directory on a disk – it has fields and tabs, and other folders can link to it.
  Mappentyp:
    begriff: Folder type
    beschreibung: The blueprint of a folder – which fields and tabs it has, how its title is formed and who may do what.
  Systemmappentyp:
    begriff: System folder type
    beschreibung: A folder type that Ablago brings itself – User, Role and Post.
  Kann aus Post angelegt werden:
    begriff: Can be created from post
    beschreibung: Tick in the basics of a folder type (#937). Only folder types with it can be chosen under "Where does this belong?" when a document is taken over from the post – for everyone who may create folders there. On by default for folder types with a documents tab; never for system folder types.
  Ist Teil einer anderen Mappe:
    begriff: Is part of another folder
    beschreibung: Tick in the basics of a folder type with the link field through which the folder belongs ("Belongs to it through", #1031). Its folders are then parts, e.g. invoice items of an invoice – only at the parent folder, without a view of their own, not in search and "+ New". The field becomes required; no chains. The type takes over the read permissions of the parent once as a default when it is switched on; later changes there do not apply. In the package format gehoertZu.
  Woran man ihn erkennt:
    begriff: How to recognise it
    beschreibung: Short sentence in the basics of a folder type (#937, at most 300 characters), e.g. "Contains invoice number, amount and payment deadline". Helps recognition assign a document to the right folder type. The description is for people, this sentence for recognition.
  Aus Dokument füllen:
    begriff: Fill from document
    beschreibung: Tick on a field (#938, formerly "Use for recognition") – the button "Fill in from document" may fill this field from a photo or document as a suggestion. With kind ("What is in the field?") and recognition hint.
  Zum Wiederfinden nutzen:
    begriff: Use to find existing folders
    beschreibung: Tick on a field (#938) – Ablago uses this value to find existing folders again in a document, e.g. customer number, contract number, invoice number or registration number. This results in suggestions with evidence ("How Ablago recognises it") and the warning if a folder already exists. Independent of "Unique".
  Beim Auswählen übernehmen:
    begriff: Copy when selected
    beschreibung: Setting on a link field (#1037) – pairs "field of the referenced folder → field of this folder". When a folder is chosen, Ablago suggests its values in empty fields, marked "suggested from …" (e.g. the notice period from the contract type). Never overwrites, never passwords, only values you may read.
  Feld:
    begriff: Field
    beschreibung: A detail in a folder, e.g. the contract number. Every field has a field kind – text, long text, formatted text, number, amount, date, yes/no, choice list, link or password.
  Feldart:
    begriff: Field kind
    beschreibung: What kind of detail a field takes, e.g. date or amount.
  Zeitraum:
    begriff: Period
    beschreibung: Field kind for a length of time made of a whole number and a unit – days, weeks, months or years, e.g. the notice period "3 months" or the term "1 year". Sorted and compared by length. Not to be confused with "in period" in date conditions (year, month).
  Tabelle:
    begriff: Table
    beschreibung: Field kind without a value of its own – shows, between the fields of a folder, the folders of another type that link to it, with the columns of a results list, e.g. the items of an invoice; below it "+ New" (such as "+ Item"). Only folders you may read; no totals.
  Teil:
    begriff: Part
    beschreibung: A folder that always belongs to another one and only appears there – such as an invoice item at its invoice (#1031). Parts are not shown in views, search and "Recently opened"; what is in a part finds the parent folder ("found in …") if you may read both. If you open a part directly, "Part of …" is shown at the top. Deleted and restored with the parent folder. No protection – it remains reachable through the API, export and links.
  Übergeordnete Mappe:
    begriff: Parent folder
    beschreibung: The folder a part belongs to – such as the invoice of its items (#1031). The parts are shown at it (usually as a table), new ones are created there, and they go with it when it is deleted and restored.
  Prozent:
    begriff: Percentage
    beschreibung: Field kind for a percentage, e.g. the tax rate "19%" – with decimals, freely chosen (foreign rates too). "19", "19%" and "19.0" mean the same.
  Gutschrift:
    begriff: Credit note
    beschreibung: An amount you get back (also a refund) – in Ablago an amount with a minus, e.g. "−£25.00". This only works for amount fields where the administrator has ticked "Allow negative amounts"; the field then says "Enter it with a minus".
  Format:
    begriff: Format
    beschreibung: What may be in a text field – email, phone, website, IBAN or postcode. New and changed details must match; on the phone the matching keyboard appears; email and phone can be tapped. Saved details remain valid. Date fields have limits instead (earliest, latest, also "today").
  Kennung:
    begriff: Identifier
    beschreibung: The fixed, technical name of a field, tab, folder type or number sequence, e.g. vertragsnummer (up to 60 characters). After saving it stays the same, so that saved values, links and packages fit. Folder types from packages have the identifier package:identifier, e.g. basis:person (#1084); your own folder types one without a colon.
  Pflichtfeld:
    begriff: Required field
    beschreibung: A field that must be filled in before the folder can be saved.
  Eindeutig:
    begriff: Unique
    beschreibung: A field value that may occur only once in this folder type, e.g. an invoice number.
  Standardwert:
    begriff: Default value
    beschreibung: The prefilled value of a field when creating a folder, also with placeholders such as a number sequence.
  Register:
    begriff: Tab
    beschreibung: A divider in a folder, e.g. General (with fields), Documents, Links or History. Notes and History are fixed tabs of every folder.
  Dokument:
    begriff: Document
    beschreibung: A file that lies in a document tab of a folder in Ablago. A file is uploaded; in Ablago it is a document. On an email it is called an attachment.
  Archivfassung:
    begriff: Archive version
    beschreibung: 'A searchable PDF/A that a package such as PDF/A stores in addition to a document – a format that can still be opened in many years and without Ablago. The original stays unchanged. If there is one, Ablago shows it ("View: archive version (PDF/A)"). PDFs, scans, photos and emails (.eml, .msg) can get one; you read an email in it like a letter.'
  Version:
    begriff: Version
    beschreibung: A document can have several versions. Replacing creates a new version; the older ones stay underneath and can be restored. Only in tabs with versioning. Not to be confused with the version of Ablago.
  Verweis:
    begriff: Link (field)
    beschreibung: A field that points to other folders, e.g. from an invoice to the contract. It can point to folders of one or several folder types (e.g. "concerns" to vehicle, flat or contract).
  Zieltyp:
    begriff: Target type
    beschreibung: A folder type whose folders a link may point to; a link has one or several. With "all of the same type", several chosen folders stay with the type of the first one. Packages can also bring optional target types – types of another package that Ablago adds as soon as it is installed.
  Berechnetes Feld:
    begriff: Calculated field
    beschreibung: A field whose value a package works out, e.g. "Cancel by" or the status of a contract. In the folder it is read-only, with "calculated by …" and the name of the package underneath. If the package no longer calculates it, the last value stays ("no longer calculated") until the administrator releases the field again.
  Zusammengesetztes Feld:
    begriff: Combined field
    beschreibung: A field that Ablago puts together from other fields of the folder when saving, e.g. "Sender · Invoice number". In the folder it is read-only, with "combined from …" underneath. If it is unique, the combination may exist only once; links count by the folder itself, not by its name.
  Hinweis von Paketen:
    begriff: Note from a package
    beschreibung: A short sentence that a package sets on a folder, e.g. "The items add up to €118.40, the invoice says €120.80". It appears in yellow in the notes line above the tabs, always with the name of the package, and never stops you saving.
  Verknüpfungen:
    begriff: Links (tab)
    beschreibung: The tab that shows all folders linking to this folder – the opposite direction of the link.
  Verweisart:
    begriff: Link kind
    beschreibung: Whether a link is a belonging ("belongs to", e.g. an invoice to the contract) or only a reference (e.g. the issuer). The folder shows the kind on the link and in the links tab.
  Titel:
    begriff: Title
    beschreibung: The display name of a folder. It is formed from a template with field values.
  Filter (Titel):
    begriff: Filter (title)
    beschreibung: Formats a placeholder in the title template, e.g. only the year of a date or shortened text. Comes after a vertical bar, e.g. {datum|jahr}.
  Ansicht:
    begriff: View
    beschreibung: A saved selection of folders – which folder types, with which conditions. Views are in the tree on the left of the Library. How something looks, on the other hand, is called "appearance".
  Unteransicht:
    begriff: Sub-view
    beschreibung: A view below another one. It inherits its permissions.
  Trefferliste:
    begriff: Result list
    beschreibung: Sets which columns a list shows. A folder type has one or more result lists; one of them is the default. A view or a links tab chooses one of them, otherwise the default applies. If a view shows several folder types, only result lists with the same identifier in all of them can be chosen, with the common columns.
  Bedingung:
    begriff: Condition
    beschreibung: A view's filter on field values, counts, deadlines, personal things or the Library attribute, e.g. a field equal to "current user", "is my favourite" or "Library is also used for work".
  Anzeigen, wenn …:
    begriff: Show if …
    beschreibung: Setting on a field or section of a folder type – the folder only shows it when the conditions apply, e.g. section "Rent" only for contract type rent. A hidden section hides all fields up to the next section. Hiding is for tidiness, not protection – values stay saved and appear in the API, exports and data access requests; a field is only required while it is shown.
  Beruflich genutzt:
    begriff: Used for work
    beschreibung: The one attribute of the Library – the Library is also used for work (self-employed, club, business). Default no. Folder types then show their work-related fields and sections; permissions, views and automations can look at it. Applies to the whole Library, not per person; set it in Workbench → Use.
  Eigene Organisation:
    begriff: Own organisation
    beschreibung: The organisation in the Library that is "us" – your own business, company or trade. Marked by the field "Own organisation" (package Basis); only someone managing the own organisation may set it. Name, address, contact, controller and data protection officer are kept there once and used by requests and the deletion concept; recognition never takes it as sender. Several are possible.
  Favoriten:
    begriff: Favourites
    beschreibung: Folders a user has marked with the star. The view "Favourites" shows them. A favourite is also a subscription – if others change the folder, there is a bundled notification "Changed" (can be switched off per favourite).
  Archivnummer:
    begriff: Archive number
    beschreibung: The number on a sticker on the paper original (e.g. A-000123); the same number is on the document in Ablago. Unique per Library; comes from the number sequence "Archive number". Connects paper and document in both directions.
  Ablageort:
    begriff: Storage location
    beschreibung: A place where paper is kept – e.g. a binder, a box, a safe deposit box or "destroyed". Storage locations lie inside each other ("at home › study cupboard › red binder"). The folder type comes with the Basis package.
  Verbleib Originaldokumente:
    begriff: Whereabouts of original documents
    beschreibung: The field on a folder that points to the paper's storage location. In all folder types with the same identifier, so that common lists and views work.
  Papierkorb:
    begriff: Bin
    beschreibung: Deleted folders. They can be restored until the set number of days has passed.
  Post:
    begriff: Post
    beschreibung: Everything that comes into Ablago or goes out – scan, upload, email. Post is a system folder type with channel, direction and status.
  Neue Post:
    begriff: New post
    beschreibung: The view with post that has not yet been assigned or completed. Whoever is given post additionally has the task "Post for you".
  Zuordnen:
    begriff: Assign
    beschreibung: Assigning post to an existing or new folder. The documents move into the folder's tab in the process.
  Kanal:
    begriff: Channel
    beschreibung: How post came into Ablago or went out. Ablago sets Uploaded, email, Folder (intake folder) and API itself; Scan, Import and WebDAV can be chosen by hand in the list.
  Richtung (Post):
    begriff: Direction (post)
    beschreibung: Whether post is incoming or outgoing. "Send by email" creates outgoing post.
  Von (Post):
    begriff: From (post)
    beschreibung: Who sent the post – for incoming post the sender, for a sent email Ablago with “Reply to”. The same key `von` as on contract and invoice, so that a list across several types can show the same column. Until 0.240 the field was called “Sender”.
  An (Post):
    begriff: To (post)
    beschreibung: Who incoming post in the household is for – a person (user). While the post is new, it is listed under “To do” for them with the task “Post for you”; that only happens when “To” is a user. The addresses of a sent email are in “To (address)”. Until 0.240 the field was called “For”.
  Stand (Post):
    begriff: Status (post)
    beschreibung: How far post has been handled – New (not yet handled), Assigned (is with a matching folder) or Done (nothing more to do).
  Zu erledigen:
    begriff: To do
    beschreibung: The top view – as a list, the folders where I should do something (my open tasks); as month and year, my dates in a calendar.
  Aufgabe:
    begriff: Task
    beschreibung: Something a person should do on a folder. Kinds are Doesn't fit, Mention, Assigned (given by hand), Post for you, Deadline, Reminder, stand-in and Access request.
  Erwähnung:
    begriff: Mention
    beschreibung: Naming a user with @ in formatted text. It creates a task for them.
  Frist:
    begriff: Deadline
    beschreibung: A task that arises from a date field with a lead time, e.g. "Cancel by …".
  Erinnerung:
    begriff: Reminder
    beschreibung: A task set by hand for a particular day (folder ▾ → Remind).
  Weitergeben:
    begriff: Pass on
    beschreibung: Transferring a task to another user.
  Abwesenheit:
    begriff: Absence
    beschreibung: A period in which a user is not there – with a stand-in who takes over their tasks.
  Vertretung:
    begriff: Stand-in
    beschreibung: A user takes over another's tasks during an absence. The stand-in gets a task of the kind "Stand-in" for this.
  Notiz:
    begriff: Note
    beschreibung: A comment on a folder.
  Formatierter Text:
    begriff: Formatted text
    beschreibung: Text with headings, lists and emphasis (Markdown) – as a field kind and in notes.
  Historie:
    begriff: History
    beschreibung: The story of a folder – changes before and after, documents, bin, notes, tasks. The technical operating log, on the other hand, is called "log".
  Volltext:
    begriff: Full text
    beschreibung: The searchable text in the documents – from the file's text layer or from text recognition.
  Vorschaubild:
    begriff: Preview
    beschreibung: A small image of the first page next to a PDF or image in the document list; created in the background and not backed up.
  Erweiterte Suche:
    begriff: Advanced search
    beschreibung: A search form across the fields of several folder types and the text in documents.
  Link:
    begriff: Link (address)
    beschreibung: An address of a view or folder, e.g. via "Copy link" – also readable via folder type and field values. In the German interface, "Link" only stands for addresses; fields that point to folders are called Verweis.
  Export:
    begriff: Export
    beschreibung: Downloading selected folders of a view as Excel, CSV, ZIP or PDF.
  Aktionen:
    begriff: Actions
    beschreibung: The menu "Folder ▾" next to a folder's title – assign task, remind, send, export and more. It used to be called "Actions" itself.
  Benutzer:
    begriff: User
    beschreibung: An account with which someone signs in. Stored as a system folder in Ablago. People and companies you deal with (contacts) are not users, but ordinary folders of the folder type "Person" or "Organisation" from the package Basis.
  Person:
    begriff: Person
    beschreibung: A human you deal with – contact person, doctor, landlord, relatives. Folder type from the package Basis (from 1.1.0). A person is **not a user** and can't sign in.
  Organisation:
    begriff: Organisation
    beschreibung: A company, authority, bank, practice, club or other body you deal with. Folder type from the package Basis; other packages link to it (contract partner, insurer, bank …).
  Niederlassung:
    begriff: Branch
    beschreibung: A branch, office, practice or outpost of an organisation – with its own address and phone. Folder type from the package Basis (from 1.1.0); belongs to exactly one organisation.
  Administrator:
    begriff: Administrator
    beschreibung: A user with access to the workbench. Permissions don't restrict them.
  Rolle:
    begriff: Role
    beschreibung: A group of users, e.g. "Parents". The basis for permission rules. Not to be confused with the system role.
  Systemrolle:
    begriff: System role
    beschreibung: Whether a user is an administrator or a member. Only administrators get into the workbench.
  Berechtigungen:
    begriff: Permissions
    beschreibung: Who may do what. On the folder type – create, read, edit, delete, see passwords – with a default plus rules; on the view – see, create, export – inherited by the sub-views. They don't apply to administrators.
  Regel:
    begriff: Rule
    beschreibung: An if-then building block of the permissions – a condition, then grant or withdraw a permission, optionally with stop.
  Testlauf:
    begriff: Test run
    beschreibung: Checks which permissions a particular user ends up with.
  Probelauf:
    begriff: Trial run
    beschreibung: Trying out an automation with a chosen folder without anything being changed or anyone being notified – Ablago only shows what would happen.
  Paket nach Zeitplan ausführen:
    begriff: Run package on schedule
    beschreibung: Then card of an automation with the trigger "Schedule" – it tells a package that its time has been reached (e.g. "Check contracts daily" at 5 a.m.) so that it recalculates something that depends only on the date. The package works with its own rights; an automation supplied with a package only calls its own package.
  Gleich eingeschaltet:
    begriff: Switched on straight away
    beschreibung: An automation supplied with a package that the package offers ticked when installing. The administrator can untick it; an update never changes on or off afterwards.
  Nummernkreis:
    begriff: Number sequence
    beschreibung: Sequential numbers following a pattern such as {jjjj}-R{zaehler:4} (giving e.g. 2026-R0001), for instance for invoice numbers.
  Design:
    begriff: Design
    beschreibung: What the interface looks like – logo, lettering, colours (light, dark, high contrast or following the device) and your own CSS. Administrators create designs under Workbench → Designs and set the default; every user chooses theirs under My account in "Appearance".
  Darstellung:
    begriff: Appearance
    beschreibung: The area under My account in which everyone sets how Ablago looks for them – the design (for their account), the font size and the width of the areas (per device).
  Ablago entdecken:
    begriff: Discover Ablago
    beschreibung: Page in the user menu (next to Help) with everything else Ablago can do – what is new since the last visit, tours and all tips by area. Hidden tips stay visible there.
  Rundgang:
    begriff: Tour
    beschreibung: A short guided walk on the real interface in a few steps; each step highlights one place. Ablago's own tour starts the first time a new account signs in; everyone finds it under "Discover Ablago".
  Tipp:
    begriff: Tip
    beschreibung: One sentence showing what else you can do in Ablago – at most one a day as a quiet line on the start page; the sentence leads to the place or starts a tour. Hide it with ×, switch it off completely in My account.
  Paket:
    begriff: Package
    beschreibung: An installable bundle of folder types, views and examples from a package catalogue, e.g. "Basis". An update only adds; it removes and changes nothing.
  Beispiel-Mappe:
    begriff: Sample folder
    beschreibung: A folder with invented data that a package creates on request when installing (tick "Create sample folders"), so you can see what belongs in a folder – to try out, not to keep. Unchanged examples can be removed again together with their documents. Unlike a preset.
  Vorgabe:
    begriff: Preset
    beschreibung: A folder a package brings to keep – such as the contract types "Electricity" or "Rent" from the Contracts package, often with templates. Always comes along, carries the marking "Preset from the package …" and is otherwise an ordinary folder. Updates only bring new versions as long as nobody has changed it; whatever was deleted stays deleted. Unlike an example (invented data to try out, on request, removable).
  Vorlage:
    begriff: Template
    beschreibung: Plain text (Markdown) with placeholders such as {vertragsnummer}, e.g. a cancellation letter on a contract type. Packages bring templates with their presets; they are stored as a document in the folder's tab. No HTML, no images, links only https://. "Letter from template" (Folder ▾) turns it into a PDF letter with the folder's details.
  Brief aus Vorlage:
    begriff: Letter from template
    beschreibung: A template and the details of a folder become a letter as a PDF (Folder ▾ → Letter from template …) – with letterhead, address, date and subject, e.g. a cancellation for a contract. Only what the person may see is filled in, never passwords; if something is missing, the letter shows a visible gap such as [Contract number]. File as a document or download.
  Herausgeber:
    begriff: Publisher
    beschreibung: Who publishes a package, as a reversed domain, e.g. app.ablago for the official packages (#1084). It is shown next to the name, e.g. "Contracts · app.ablago". Ablago never replaces an installed package with one of the same ID from a different publisher.
  Paketkatalog:
    begriff: Package catalogue
    beschreibung: The list of packages a DMS can install (a file katalog.json on the internet). Ablago only queries the official catalogue at the push of a button ("Fetch catalogue"). Further catalogues are entered in expert mode under "Further sources".
  Expertenmodus:
    begriff: Expert mode
    beschreibung: An expandable section under Workbench → Packages, directly below the buttons. Expanded, it shows "Further sources" and "Upload package" – for package developers and Ablago without the internet. Collapsed at first; the browser remembers per user whether it is open.
  Paket-Läufer:
    begriff: Package runner
    beschreibung: The part of Ablago that runs the code of packages – isolated in its own process, with limits for memory and time and only with the permissions an administrator confirmed during installation. The code only reaches the network and the internet at the addresses the package names – the preview shows this as "no access to network and internet" or "access to network/internet only to …". Its status is shown under Workbench → Packages → package in the section "Package runner".
  Dienstkonto:
    begriff: Service account
    beschreibung: The account with which a package with code works in Ablago, e.g. "Package Text recognition". It never signs in, isn't listed under Users, never deletes and only has the permissions from the package. In the history it appears where the package changed something.
  Werkbank anpassen:
    begriff: Customise the workbench
    beschreibung: Sets which areas are on the left of the workbench – following a template ("Household", "Business" or "Everything") and with exceptions. Hiding doesn't switch anything off. New installations start with "Household"; installations from before this setting show everything.
  Betrieb:
    begriff: Business
    beschreibung: The template under "Customise the workbench" for the self-employed and small businesses – with number sequences, archive mode, mailboxes and further areas. Its counterpart is the template "Household".
  Übersicht:
    begriff: Overview
    beschreibung: The first page of the workbench – what needs doing in Ablago right now, with notices, status and inventory.
  Tägliche Zusammenfassung:
    begriff: Daily summary
    beschreibung: An email that lists a user's open tasks once a day – only if they have some and aren't absent. Administrators switch it on under Workbench → Settings → Notifications and tasks; everyone chooses the time and weekdays under My account.
  Region:
    begriff: Region
    beschreibung: Where the Library is at home – country, state and time zone (Workbench → Settings → Region). Public holidays, "today" for deadlines and all times of reminders, schedules and the Daily summary follow it.
  Archivmodus:
    begriff: Archive mode
    beschreibung: A setting per folder type for retention obligations – with versions and a deletion lock until the end of the period.
  Stichtag:
    begriff: Reference date
    beschreibung: The date field from which the period runs in archive mode – until 31.12. of its year plus the years. If it is empty, the folder's creation date counts or, with "doesn't expire yet", the period only starts once it is filled in.
  Aufbewahrung abgelaufen:
    begriff: Retention expired
    beschreibung: The list of folders whose retention period has expired (Workbench → Users and security). Formerly "May go".
  Suche und Volltext:
    begriff: Search and full text
    beschreibung: The workbench area under Post and incoming for text recognition, archive version, automatic shrinking, typos and synonyms. Combines the former areas "Text recognition" and "Search".
  Postfach:
    begriff: Mailbox
    beschreibung: A connected email account (IMAP) from which Ablago fetches post.
  Eingangsordner:
    begriff: Intake folder
    beschreibung: A folder that Ablago watches, e.g. for "Scan to Folder". Every file in it becomes post.
  Texterkennung:
    begriff: Text recognition
    beschreibung: Recognises text in images and scanned PDFs so that it becomes searchable.
  Anmeldeschutz:
    begriff: Sign-in protection
    beschreibung: Lock after failed attempts, blocked IP addresses, requirements for two-factor sign-in and sign-in via a provider.
  Zwei-Faktor-Anmeldung:
    begriff: Two-factor sign-in
    beschreibung: An additional code from an app when signing in.
  Anmeldung über einen Anbieter:
    begriff: Sign-in via a provider
    beschreibung: Signing in with someone else's account, e.g. Microsoft 365 (OpenID Connect).
  Fehler nachstellen:
    begriff: Reproduce a problem
    beschreibung: An administrator temporarily works under another user's account to see a problem. "Back to your own account" returns.
  Haushalt:
    begriff: Household
    beschreibung: The template under "Customise the workbench" for home – lean, only what a family needs for setting up and backing up. Since 04.11.2026 the whole installation is neutrally called "Library" (Ablage); "Mandant" only appears in the code.
  Einrichtungsassistent:
    begriff: Setup wizard
    beschreibung: The steps when Ablago is started for the first time.
  Einrichtungscode:
    begriff: Setup code
    beschreibung: The code from the container's log that unlocks the setup.
  Schlüssel:
    begriff: Key
    beschreibung: The secret key with which password fields and backups are encrypted. It is never in the database. The fixed name of a field, on the other hand, is called identifier.
  Fingerabdruck:
    begriff: Fingerprint
    beschreibung: A short check code by which you recognise a key.
  Notfallblatt:
    begriff: Emergency sheet
    beschreibung: A PDF with the key and instructions for restoring.
  Sicherung:
    begriff: Backup
    beschreibung: An encrypted complete backup that can be restored in Ablago. Not an export – not readable without Ablago.
  Probe-Wiederherstellung:
    begriff: Test restore
    beschreibung: Checks a backup without touching the real data.
  Wiederherstellen:
    begriff: Restore
    beschreibung: Restoring a backup in Ablago.
  Vollexport:
    begriff: Full export
    beschreibung: All data in open formats, readable even without Ablago – so that nobody is tied to Ablago.
  Meine Daten exportieren:
    begriff: Export my data
    beschreibung: A user downloads their own data under My account.
  Wartungsmodus:
    begriff: Maintenance mode
    beschreibung: A temporary lock for users with an announcement, e.g. during a restore.
  Wartungsoperationen:
    begriff: Maintenance operations
    beschreibung: One-off upkeep work, e.g. assigning numbers retrospectively.
  Protokoll:
    begriff: Log
    beschreibung: The server's running operating log with modules and levels (Workbench → Log). A folder's story, on the other hand, is called history.
  Debug-Modus:
    begriff: Debug mode
    beschreibung: A more detailed technical log for troubleshooting.
  Gemeldete Fehler:
    begriff: Reported problems
    beschreibung: Problems that users have submitted via "Report a problem" (Workbench → Reported problems).
  Systemzustand:
    begriff: System health
    beschreibung: How the server is doing right now – storage space with warning thresholds and the load of CPU, memory and network (Workbench → Maintenance and troubleshooting → system health). It means the state in operation, not the configuration.
  Speicherplatz:
    begriff: Storage space
    beschreibung: How full the data folders are, with thresholds for warnings (under system health).
  Demo-Daten:
    begriff: Demo data
    beschreibung: Generated sample folders for trying out and for load tests.
  API:
    begriff: API
    beschreibung: The interface through which programs work with Ablago. Access with a personal API key.
  Version von Ablago:
    begriff: Version of Ablago
    beschreibung: The state of the program, e.g. 0.73. An update brings a new version of Ablago; it changes nothing about documents and their versions. What's new is listed under "New in this version".
  Konsole:
    begriff: Console
    beschreibung: The command "dms" in the container for emergencies and operation.
  Auftrag:
    begriff: Job
    beschreibung: Work that Ablago does in the background and whose progress you can see, e.g. creating demo data, full export, assigning numbers retrospectively. Only one job runs at a time. Work for people is called a task.
