site_name: Ablago – Entwicklerhandbuch
site_description: "Mitmachen bei Ablago: Arbeitsweise, Entwicklung, Aufbau und Release"
site_url: !ENV [SITE_URL, 'https://help.ablago.app/entwickler/aktuell/']
repo_url: https://github.com/motom001/dms
repo_name: motom001/dms
edit_uri: edit/main/docs/handbuch/entwickler/docs/
docs_dir: docs
# Bildschirmfotos anderer Sprachen gehören nur in deren Fassung (#730, werkzeuge/sprache_hook.py).
exclude_docs: |
  bilder/en/
copyright: Der Quellcode von Ablago steht unter der Apache-2.0; Name und Logo sind davon nicht erfasst · <a href="https://github.com/sponsors/motom001">Projekt unterstützen</a> · Das Handbuch lädt nichts von Dritten (<a href="https://help.ablago.app/admin/aktuell/datenschutz/#keine-telemetrie">Datenschutz</a>)

theme:
  name: material
  # Hinweis auf ältere Versionen (#111)
  custom_dir: ../overrides
  # Logo und Favicon aus marke/ (#689)
  logo: marke/ablago-app-blau.svg
  favicon: marke/favicon.svg
  language: de
  # Keine Schrift von Google (#698): Systemschrift, nichts von fremden Diensten.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dunkle Darstellung }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Helle Darstellung }

extra_css:
  - stylesheets/ablago.css

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Diagramme liegen als Bild unter docs/grafiken/ (Quelle *.mmd daneben, mmdc -s 2) – Mermaid
  # würde sonst von unpkg.com geladen (#698).
  - pymdownx.superfences
  - pymdownx.keys

extra:
  # Sprachumschalter (#730): dieselbe Seite auf Englisch unter …/en/ (overrides/partials/alternate.html).
  alternate:
    - { name: Deutsch, link: ./, lang: de }
    - { name: English, link: en/, lang: en }
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Projekt unterstützen (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Quellcode auf GitHub

nav:
  - Mitmachen: index.md
  - Für wen wir bauen: personas.md
  - Loslegen: loslegen.md
  - Beitrag einreichen: beitrag.md
  - Stil und Abhängigkeiten: stil.md
  - Gestaltung und Bausteine:
      - Überblick: bausteine.md
      - Feld: bausteine-feld.md
      - Knopf: bausteine-knopf.md
      - Speicherleiste: bausteine-speicherleiste.md
      - Reiter: bausteine-reiter.md
      - Schalter: bausteine-schalter.md
      - PaketChip: bausteine-paketchip.md
      - Eingaben mit Einheit: bausteine-einheit.md
      - Tabelle: bausteine-tabelle.md
      - Suche: bausteine-suche.md
      - Umschalter: bausteine-umschalter.md
      - Bereiche: bausteine-bereiche.md
      - Fassungen: bausteine-fassungen.md
      - Menü: bausteine-menue.md
      - Wahlhaken: bausteine-wahlhaken.md
      - Mehrfachauswahl: bausteine-mehrfachauswahl.md
      - Platzhalter: bausteine-platzhalter.md
  - Release: release.md
  - Kern:
      - Aufbau: aufbau.md
      - Leistung: leistung.md
      - Einrichtungsdatei: einrichtungsdatei.md
  - Pakete:
      - Pakete entwickeln: pakete.md
      - Pakete mit Code: pakete-code.md
  - Clients:
      - Clients entwickeln: clients.md
  - Weiteres:
      - Begriffe (Glossar): https://help.ablago.app/benutzer/aktuell/begriffe/
      - Issues auf GitHub: https://github.com/motom001/dms/issues
      - Administratorhandbuch: https://help.ablago.app/admin/aktuell/
      - "Wie komme ich an ein DMS?": https://help.ablago.app/installieren/aktuell/
