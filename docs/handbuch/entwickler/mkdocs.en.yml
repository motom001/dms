# Englische Fassung (#730): erbt alles von mkdocs.yml, eigene Seiten in docs-en/, gebaut nach …/entwickler/en/.
# Alles außer Seiten (Stile, Logo, Bilder) holt werkzeuge/sprache_hook.py aus docs/; Grafiken mit Text als *.en.svg.
INHERIT: mkdocs.yml
site_name: Ablago – Developer manual
site_description: "Contributing to Ablago: how we work, development, architecture and release"
site_url: !ENV [SITE_URL, 'https://help.ablago.app/entwickler/aktuell/en/']
edit_uri: edit/main/docs/handbuch/entwickler/docs-en/
docs_dir: docs-en
copyright: Ablago's source code is licensed under Apache-2.0; the name and logo are not covered · <a href="https://github.com/sponsors/motom001">Support the project</a> · This manual loads nothing from third parties (<a href="https://help.ablago.app/admin/aktuell/en/datenschutz/#keine-telemetrie">privacy</a>)

theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search:
      lang: en

hooks:
  - ../werkzeuge/sprache_hook.py

# Die Anker sind dieselben wie im Deutschen (werkzeuge/anker.py) – ein falscher fällt beim Bauen auf.
validation:
  anchors: warn

extra_css:
  - stylesheets/ablago.css
  - stylesheets/sprache.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Diagramme liegen als Bild unter docs/grafiken/ (Quelle *.mmd daneben, mmdc -s 2) – Mermaid
  # würde sonst von unpkg.com geladen (#698).
  - pymdownx.superfences
  - pymdownx.keys

extra:
  alternate:
    - { name: Deutsch, link: ../, lang: de }
    - { name: English, link: ./, lang: en }
  # Hinweis oben auf jeder Seite (#730, overrides/main.html). Entfällt, sobald jemand die Übersetzung durchgesehen hat.
  maschinell:
    text: Machine-translated – improvements welcome.
    verweis: Suggest an improvement
    link: https://github.com/motom001/dms/issues/new
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Support the project (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Source code on GitHub

nav:
  - Contributing: index.md
  - Who we build for: personas.md
  - Getting started: loslegen.md
  - Submitting a contribution: beitrag.md
  - Style and dependencies: stil.md
  - Design and building blocks:
      - Overview: bausteine.md
      - Field: bausteine-feld.md
      - Button: bausteine-knopf.md
      - Save bar: bausteine-speicherleiste.md
      - Tabs: bausteine-reiter.md
      - Switch: bausteine-schalter.md
      - Package chip: bausteine-paketchip.md
      - Inputs with a unit: bausteine-einheit.md
      - Table: bausteine-tabelle.md
      - Search: bausteine-suche.md
      - Toggle: bausteine-umschalter.md
      - Areas: bausteine-bereiche.md
      - Versions: bausteine-fassungen.md
      - Menu: bausteine-menue.md
      - Selection checkbox: bausteine-wahlhaken.md
      - Multiple selection: bausteine-mehrfachauswahl.md
  - Release: release.md
  - Core:
      - Architecture: aufbau.md
      - Performance: leistung.md
      - Setup file: einrichtungsdatei.md
  - Packages:
      - Developing packages: pakete.md
      - Packages with code: pakete-code.md
  - Clients:
      - Developing clients: clients.md
  - More:
      - Terms (glossary): https://help.ablago.app/benutzer/aktuell/en/begriffe/
      - Issues on GitHub: https://github.com/motom001/dms/issues
      - Administrator manual: https://help.ablago.app/admin/aktuell/en/
      - "How do I get a DMS?": https://help.ablago.app/installieren/aktuell/en/
