site_name: DMS – Benutzerhandbuch
site_description: Arbeiten mit dem DMS – Mappen, Dokumente, Suche und Profil
site_url: !ENV [SITE_URL, 'https://motom001.github.io/dms/benutzer/aktuell/']
repo_url: https://github.com/motom001/dms
repo_name: motom001/dms
edit_uri: edit/main/docs/handbuch/benutzer/docs/
docs_dir: docs
copyright: DMS steht unter der AGPL-3.0 · <a href="https://github.com/sponsors/motom001">Projekt unterstützen</a>

theme:
  name: material
  # Hinweis auf ältere Versionen (#111)
  custom_dir: ../overrides
  language: de
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dunkle Darstellung }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Helle Darstellung }

plugins:
  - search:
      lang: de

extra_css:
  - stylesheets/selbstcheck.css
extra_javascript:
  - javascripts/selbstcheck.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

extra:
  # Versionsauswahl (#111): versions.json wie bei „mike“, „aktuell“ = neuestes Release
  version:
    provider: mike
    default: aktuell
    alias: true
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Projekt unterstützen (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Quellcode auf GitHub

nav:
  - Willkommen: index.md
  - Wofür ein DMS?: wofuer.md
  - Neu in dieser Version: neu.md
  - Erste Schritte: erste-schritte.md
  - Arbeiten in der Ablage:
      - Sichten und Listen: ablage.md
      - Mappen: mappen.md
      - Dokumente: dokumente.md
      - Eingang und Aufgaben: eingang.md
      - Notizen, Erwähnungen, Protokoll: zusammenarbeit.md
      - E-Mail, PDF und Link: versenden.md
      - Benutzer und Rollen: benutzer-und-rollen.md
  - Profil und Einstellungen: profil.md
  - Häufige Fragen: fragen.md
  - Weiteres:
      - Was ist neu? (Changelog): https://github.com/motom001/dms/releases
      - Administratorhandbuch: https://motom001.github.io/dms/admin/
      - "Wie komme ich an ein DMS?": https://motom001.github.io/dms/installieren/
      - Entwicklerhandbuch: https://motom001.github.io/dms/entwickler/
