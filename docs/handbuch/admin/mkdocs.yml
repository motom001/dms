site_name: DMS – Administratorhandbuch
site_description: Einrichten, betreiben und erweitern des DMS
site_url: !ENV [SITE_URL, 'https://motom001.github.io/dms/admin/aktuell/']
repo_url: https://github.com/motom001/dms
repo_name: motom001/dms
edit_uri: edit/main/docs/handbuch/admin/docs/
docs_dir: docs
copyright: DMS steht unter der Apache-2.0 · <a href="https://github.com/sponsors/motom001">Projekt unterstützen</a>

theme:
  name: material
  # Hinweis auf ältere Versionen (#111)
  custom_dir: ../overrides
  language: de
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dunkle Darstellung }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Helle Darstellung }

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Wiederkehrende Hinweise an einer Stelle (#296): docs/handbuch/snippets/
  - pymdownx.snippets:
      base_path: [docs/handbuch/snippets, ../snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.keys

extra:
  # Versionsauswahl (#111): versions.json wie bei „mike“, „aktuell“ = neuestes Release
  version:
    provider: mike
    default: aktuell
    alias: true
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Projekt unterstützen (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Quellcode auf GitHub

nav:
  - Überblick: index.md
  - Neu in dieser Version: neu.md
  - Installation und Betrieb:
      - Einrichtung und Betrieb: installation.md
      - "Wie komme ich an ein DMS?": https://motom001.github.io/dms/installieren/aktuell/
      - Aktualisieren und Sichern: aktualisieren.md
      - Wachsen und umziehen: wachsen.md
      - Verschlüsselung: verschluesselung.md
  - Werkbank:
      - Werkbank und Übersicht: uebersicht.md
      - Ablage aufbauen:
          - Mappentypen: mappentypen.md
          - Ansichten: sichten.md
          - Nummernkreise: nummernkreise.md
          - Stempel beim Weitergeben: stempel.md
          - Pakete: pakete.md
          - Archivmodus und Aufbewahrung: archiv.md
          - Datenschutz im DMS: datenschutz.md
          - Löschkonzept (Vorlage): loeschkonzept.md
          - Links über Feldwerte: direktlinks.md
      - Benutzer und Sicherheit:
          - Benutzer und Rollen: benutzer.md
          - Berechtigungen: berechtigungen.md
      - Post und Eingänge:
          - Postfächer: postfaecher.md
          - Eingangsordner: eingangsordner.md
          - WebDAV-Laufwerk: webdav.md
          - Texterkennung und Wartung: texterkennung.md
      - Daten sichern:
          - Sicherung: sicherung.md
          - Wiederherstellen: wiederherstellen.md
          - Daten exportieren: export.md
          - Papierkorb: papierkorb.md
      - Einstellungen:
          - Benachrichtigungen und Aufgaben: aufgaben.md
          - Anmeldeschutz: anmeldeschutz.md
          - Designs: designs.md
      - Wartung und Fehlersuche:
          - Systemzustand: speicherplatz.md
          - Protokoll, Datenbank, Technik: fehlersuche.md
          - Wartungsmodus: wartungsmodus.md
          - Demo-Daten: demo.md
  - Notfall:
      - "Notfall: kein Admin mehr": notfall.md
      - "Konsole: Befehl dms": konsole.md
      - Verfahrensdokumentation (Vorlage): verfahrensdokumentation.md
  - Schnittstelle (API): api.md
  - Hintergrund:
      - Technik: technik.md
      - Entscheidungen: entscheidungen.md
      - Begriffe (Glossar): https://motom001.github.io/dms/benutzer/aktuell/begriffe/
  - Weiteres:
      - Was ist neu? (Changelog): https://github.com/motom001/dms/releases
      - Benutzerhandbuch: https://motom001.github.io/dms/benutzer/
      - "Wie komme ich an ein DMS?": https://motom001.github.io/dms/installieren/
      - Entwicklerhandbuch: https://motom001.github.io/dms/entwickler/
