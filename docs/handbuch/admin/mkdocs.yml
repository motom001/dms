site_name: Ablago – Administratorhandbuch
site_description: Ablago einrichten, betreiben und erweitern
site_url: !ENV [SITE_URL, 'https://help.ablago.app/admin/aktuell/']
repo_url: https://github.com/motom001/dms
repo_name: motom001/dms
edit_uri: edit/main/docs/handbuch/admin/docs/
docs_dir: docs
# Bildschirmfotos anderer Sprachen gehören nur in deren Fassung (#730, werkzeuge/sprache_hook.py).
exclude_docs: |
  bilder/en/
copyright: Der Quellcode von Ablago steht unter der Apache-2.0; Name und Logo sind davon nicht erfasst · <a href="https://github.com/sponsors/motom001">Projekt unterstützen</a> · Das Handbuch lädt nichts von Dritten (<a href="https://help.ablago.app/admin/aktuell/datenschutz/#keine-telemetrie">Datenschutz</a>)

theme:
  name: material
  # Hinweis auf ältere Versionen (#111)
  custom_dir: ../overrides
  # Logo und Favicon aus marke/ (#689)
  logo: marke/ablago-app-blau.svg
  favicon: marke/favicon.svg
  language: de
  # Keine Schrift von Google (#698): Systemschrift, nichts von fremden Diensten.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dunkle Darstellung }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Helle Darstellung }

extra_css:
  - stylesheets/ablago.css

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Wiederkehrende Hinweise an einer Stelle (#296): docs/handbuch/snippets/
  - pymdownx.snippets:
      base_path: [docs/handbuch/snippets, ../snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.keys

extra:
  # Sprachumschalter (#730): dieselbe Seite auf Englisch unter …/en/ (overrides/partials/alternate.html).
  alternate:
    - { name: Deutsch, link: ./, lang: de }
    - { name: English, link: en/, lang: en }
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/motom001
      name: Projekt unterstützen (GitHub Sponsors)
    - icon: fontawesome/brands/github
      link: https://github.com/motom001/dms
      name: Quellcode auf GitHub

