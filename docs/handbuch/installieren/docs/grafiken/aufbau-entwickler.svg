="10" fill="#ffffff" stroke="#dde2e6"/><g transform="translate(254 226) scale(1.1)"><path d="M13 2 5 13.5h6l-1 8.5 8-11.5h-6z" fill="none" stroke="#c77700" stroke-width="2" stroke-linejoin="round"/></g><text x="290" y="240" font-size="14" fill="#1c2328" font-weight="700" text-anchor="start">SSD (einzeln)</text><text x="254" y="266" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Dokumente und Schlüssel</text><text x="254" y="283" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">schneller Zugriff</text><rect x="510" y="210" width="240" height="96" rx="10" fill="#ffffff" stroke="#dde2e6"/><g transform="translate(524 226) scale(1.1)"><rect x="4" y="4" width="16" height="5" rx="1.5" fill="none" stroke="#00796b" stroke-width="2"/><rect x="4" y="10" width="16" height="5" rx="1.5" fill="none" stroke="#00796b" stroke-width="2"/><rect x="4" y="16" width="16" height="5" rx="1.5" fill="none" stroke="#00796b" stroke-width="2"/></g><text x="560" y="240" font-size="14" fill="#1c2328" font-weight="700" text-anchor="start">RAID 5 (Festplatten)</text><text x="524" y="266" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">Sicherungen des DMS</text><text x="524" y="283" font-size="12" fill="#5b6670" font-weight="400" text-anchor="start">übersteht eine kaputte Platte</text><line x1="560" y1="170" x2="370" y2="208" stroke="#00796b" stroke-width="2" marker-end="url(#spitze)"/><line x1="640" y1="170" x2="630" y2="208" stroke="#00796b" stroke-width="2" marker-end="url(#spitze)"/><text x="250" y="340" font-size="11.5" fill="#5b6670" font-weight="400" text-anchor="start">Fällt die SSD aus, hilft die Sicherung – mit dem Schlüssel vom Notfallblatt.</text><rect x="510" y="410" width="240" height="70" rx="10" fill="#ffffff" stroke="#dde2e6"/><text x="525" y="438" font-size="14" fill="#1c2328" font-weight="700" text-anchor="start">Cloudspeicher</text><text x="525" y="458" font-size="11.5" fill="#5b6670" font-weight="400" text-anchor="start"